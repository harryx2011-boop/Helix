[package]
name = "helix-fetch"
version = "1.5.0"
edition = "2021"
license = "Apache-2.0"
description = "TLS-impersonating fetch tier for Helix"

[[bin]]
name = "helix-fetch"
path = "src/main.rs"

[dependencies]
# wreq exposes the TLS/HTTP2 handshake, which is the whole point of this
# service: a coherent browser identity has to be constructed at the transport
# layer, and mainstream HTTP clients do not let you shape it.
#
# It is the maintained successor to rquest, whose every published version was
# yanked from crates.io. wreq-util carries the browser emulation profiles.
#
# 0.16/0.2 need rustc 1.98, which is now the toolchain in use. The upgrade is
# what makes newer identities presentable: wreq-util 0.1 stopped at Chrome 137,
# while real browsers are on 149+, so every capture recorded a user-agent the
# transport layer could not match.
wreq = "0.16"
wreq-util = "0.2"
# wreq 0.16 dropped its Url re-export in favour of http::Uri; the initial URL
# check still wants a parser, so depend on the crate wreq itself uses.
url = "2"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
