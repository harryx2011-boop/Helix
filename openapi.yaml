openapi: 3.1.0

info:
  title: Helix
  version: 0.1.0
  summary: Self-hostable, BYOK web-data API.
  description: |
    Helix turns web pages and documents into clean, structured, LLM-ready data.

    It is self-hosted and bring-your-own-key throughout: Helix never bundles an LLM,
    a proxy pool or a vector store. You configure your own providers; your provider
    bills you directly. Helix takes no margin on inference.

    ## Credentials

    Two distinct concepts, never conflated:

    - **Helix API keys** (`Authorization: Bearer hx_...`) authenticate *you* to this
      Helix instance. Create as many as you like, one per project, each revocable.
    - **Provider credentials** (LLM, embedding, proxy, vector store) belong to the
      operator and are set through environment variables on the server. Helix calls
      *your* models with *your* keys.

    ## Failure semantics

    A page that returns a bot-challenge interstitial is a **failure**, not a success,
    even when the upstream status is 200. Such responses come back as a typed
    `FetchFailure` with a machine-readable `reason`. Helix never returns challenge
    HTML dressed up as content.

    Rate limiting **fails open**: if the limiter's backing store is unavailable the
    request proceeds and the server logs a warning. Infrastructure trouble here never
    becomes a 429 for you. Every response carries `X-RateLimit-*` headers so
    autonomous clients can self-throttle without parsing error strings.

    ## Estimating before you run

    Any operation whose cost scales with discovered pages accepts `estimate: true`
    and returns projected work — pages, time, tokens, provider spend — without
    doing it.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://localhost:7400/v1
    description: Local self-hosted default
  - url: '{scheme}://{host}/v1'
    description: Your deployment
    variables:
      scheme: { default: https, enum: [http, https] }
      host: { default: localhost:7400 }

security:
  - ApiKey: []

tags:
  - name: Scrape
    description: Single-resource read. Web pages and documents share one envelope.
  - name: Crawl
    description: Multi-page discovery and read.
  - name: Search
    description: Web search, optionally scraping each result.
  - name: Monitors
    description: Scheduled re-reads with change detection.
  - name: Jobs
    description: Status, results and cancellation for asynchronous work.
  - name: System
    description: Health, profiles and capability discovery.

paths:
  /scrape:
    post:
      tags: [Scrape]
      summary: Read one URL
      description: |
        Fetches a single URL and returns it in the formats you ask for.

        Works identically for HTML pages, PDFs and Office documents — the response
        envelope is the same shape regardless of what was on the other end. PDFs are
        classified before parsing, so scanned documents route to OCR rather than
        silently returning garbled text.

        Synchronous. For many URLs, use `/crawl` with an explicit URL list or call `/scrape` concurrently.
      operationId: scrape
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScrapeRequest' }
            examples:
              minimal:
                summary: Just the markdown
                value: { url: 'https://example.com' }
              structured:
                summary: Extract to a schema with your own model
                value:
                  url: 'https://example.com/pricing'
                  formats: [markdown, json]
                  extract:
                    schema:
                      type: object
                      properties:
                        plans:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              monthlyPrice: { type: number }
              rendered:
                summary: Force a browser and act on the page
                value:
                  url: 'https://example.com/app'
                  tier: chromium
                  formats: [markdown, screenshot]
                  actions:
                    - { type: click, selector: '#accept-cookies' }
                    - { type: scroll, direction: down }
                    - { type: wait, milliseconds: 500 }
      responses:
        '200':
          description: |
            The fetch resolved. Check `success` — a typed failure (including a bot
            challenge) is reported here rather than as an HTTP error, so you can see
            which tier and profile were tried.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScrapeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /map:
    post:
      tags: [Crawl]
      summary: List a site's URLs
      description: |
        Discovers URLs without reading them. Sitemap-first, falling back to link
        discovery from the seed page.

        Cheap and fast, and the basis of cost estimation for `/crawl` — map first to
        learn how many pages exist, then decide.
      operationId: map
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MapRequest' }
      responses:
        '200':
          description: Discovered URLs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /crawl:
    post:
      tags: [Crawl, Jobs]
      summary: Crawl a site
      description: |
        Discovers and reads pages from a seed URL.

        Respects `robots.txt` by default, including `Crawl-delay`. Politeness is
        adaptive: concurrency ramps while a host stays healthy and backs off on 429s
        or latency spikes.

        Pass `estimate: true` to get projected pages, time and cost without crawling.
      operationId: crawl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrawlRequest' }
            examples:
              basic:
                summary: Crawl a docs site
                value: { url: 'https://docs.example.com', limit: 200 }
              estimate:
                summary: What would this cost?
                value: { url: 'https://docs.example.com', estimate: true }
              toVectors:
                summary: Crawl straight into a vector store
                value:
                  url: 'https://docs.example.com'
                  chunk: { strategy: semantic, maxTokens: 512 }
                  destination: { type: qdrant, collection: docs }
      responses:
        '200':
          description: Estimate only — returned when `estimate` is true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estimate' }
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /search:
    post:
      tags: [Search]
      summary: Search the web, optionally reading the results
      description: |
        Runs a web search and, when `scrape` is set, reads each result in the same
        call — so one request goes from question to page content.
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
      responses:
        '200':
          description: Search results, with page content when `scrape` was set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /monitor:
    get:
      tags: [Monitors]
      summary: List monitors
      description: Monitors created with the calling API key, newest first.
      operationId: listMonitors
      responses:
        '200':
          description: Your monitors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  monitors:
                    type: array
                    items: { $ref: '#/components/schemas/Monitor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Monitors]
      summary: Create a monitor
      description: |
        Watches one URL on a schedule and tells you what changed.

        Each check re-reads the page through the same fetch ladder as `/scrape`
        and compares the markdown with the last snapshot. An unchanged page
        stores no new snapshot and sends nothing. A changed page stores a
        snapshot, records a diff at word, line or character granularity, and
        queues a webhook with the diff inline.

        `sensitivity: significant` strips relative timestamps, clock times,
        dates and tracking parameters before comparing, so rotating noise does
        not count as a change. Keyword triggers narrow it further without a
        model call.

        The schedule is a cron expression or an interval (`15m`, `6h`, `1d`).
        The operator sets the minimum gap between checks
        (`HELIX_MONITOR_MIN_INTERVAL`, hourly by default); a schedule under it
        is rejected with `field: schedule`.
      operationId: createMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonitorRequest' }
            examples:
              pricing:
                summary: Watch a pricing page every hour
                value:
                  url: 'https://example.com/pricing'
                  schedule: '0 * * * *'
                  sensitivity: significant
                  webhook: 'https://your.app/webhooks/helix'
              restock:
                summary: Only tell me when a phrase disappears
                value:
                  url: 'https://example.com/product/123'
                  schedule: { every: '6h', timezone: 'Europe/London' }
                  trigger: { keywordDisappears: 'Out of stock' }
                  webhook: { url: 'https://your.app/webhooks/helix', secret: 'a-shared-secret' }
      responses:
        '201':
          description: Monitor created. The first check runs at `nextCheckAt`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
              example:
                success: true
                id: 'f2a1c6e0-4b7d-4c1e-9a3b-2d5e8f7a1b23'
                monitorId: 'f2a1c6e0-4b7d-4c1e-9a3b-2d5e8f7a1b23'
                url: 'https://example.com/pricing'
                schedule: { cron: '0 * * * *', timezone: 'UTC' }
                sensitivity: significant
                diff: { granularity: word, inline: true }
                trigger: {}
                webhook: { url: 'https://your.app/webhooks/helix', events: [changed], metadata: null, headers: [], signed: false }
                status: active
                createdAt: '2026-08-24T12:30:00.000Z'
                updatedAt: '2026-08-24T12:30:00.000Z'
                lastCheckedAt: null
                nextCheckAt: '2026-08-24T13:00:00.000Z'
                lastChangeAt: null
                lastError: null
                stats: { checks: 0, changes: 0, pagesUnchanged: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /monitor/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Monitors]
      summary: Get a monitor
      description: Status, stats and the latest snapshot (markdown) once a check has run.
      operationId: getMonitor
      responses:
        '200':
          description: The monitor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Monitors]
      summary: Update a monitor
      description: |
        Change the schedule, read options, diff, trigger, sensitivity or webhook,
        or pause and resume with `status`. A new schedule is validated against the
        instance minimum and resets `nextCheckAt`. Send `webhook: null` to remove it.
      operationId: updateMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonitorPatch' }
      responses:
        '200':
          description: The updated monitor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Monitors]
      summary: Delete a monitor
      description: Stops the schedule and removes the monitor, its snapshots, history and pending deliveries.
      operationId: deleteMonitor
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  /monitor/{id}/history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: cursor, in: query, required: false, schema: { type: integer }, description: Return entries older than this id. Taken from `next`. }
      - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 50 } }
    get:
      tags: [Monitors]
      summary: Change timeline
      description: Every check, newest first, including the quiet ones. Paginated by cursor.
      operationId: monitorHistory
      responses:
        '200':
          description: The timeline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  monitorId: { type: string, format: uuid }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/MonitorHistoryEntry' }
                  next:
                    type: string
                    nullable: true
                    description: Path of the next page, or null on the last page.
        '404': { $ref: '#/components/responses/NotFound' }

  /monitor/{id}/snapshots/{snapshotId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: snapshotId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Monitors]
      summary: Read a snapshot
      description: The markdown captured by one check. `snapshotUrl` in history entries and webhook payloads points here.
      operationId: monitorSnapshot
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitorSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }

  /monitor/{id}/check:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Monitors]
      summary: Check now
      description: |
        Runs one check immediately, outside the schedule, and returns the
        resulting history entry. The regular schedule is unaffected. The check
        takes the same lock and the same instance-wide slot as a scheduled one:
        a monitor already mid-check answers 409 `check_in_progress`, a paused
        monitor 409 `monitor_paused`, and an instance with every slot busy 503
        `busy` with `Retry-After`.
      operationId: checkMonitor
      responses:
        '200':
          description: The check that ran.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  monitorId: { type: string, format: uuid }
                  check: { $ref: '#/components/schemas/MonitorHistoryEntry' }
                  webhookQueued: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Paused (`monitor_paused`) or already running (`check_in_progress`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Every check slot is in use (`busy`). Retry after the `Retry-After` seconds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /monitor/{id}/deliveries:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Monitors]
      summary: Webhook deliveries
      description: The last 100 deliveries for this monitor with their attempt count, last error and next retry. Dead-lettered ones can be replayed.
      operationId: monitorDeliveries
      responses:
        '200':
          description: Deliveries, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  monitorId: { type: string, format: uuid }
                  deliveries:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
        '404': { $ref: '#/components/responses/NotFound' }

  /monitor/{id}/deliveries/{deliveryId}/replay:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: deliveryId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Monitors]
      summary: Replay a dead-lettered delivery
      description: Puts a dead delivery back on the queue with a fresh attempt count. Pending and delivered rows are refused with 409.
      operationId: replayMonitorDelivery
      responses:
        '200':
          description: Queued again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  delivery: { $ref: '#/components/schemas/WebhookDelivery' }
        '409':
          description: Not dead-lettered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: cursor
        in: query
        schema: { type: string }
        description: Continue a paginated result set.
    get:
      tags: [Jobs]
      summary: Get job status and results
      operationId: getJob
      responses:
        '200':
          description: Job state, with results so far.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Jobs]
      summary: Cancel a job
      description: |
        Stops the job. Already-completed results stay retrievable. Cancellation does
        not emit a failure webhook per queued URL.
      operationId: cancelJob
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{id}/errors:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Jobs]
      summary: Per-URL failures for a job
      description: Every failure with its typed reason, the tier and profile tried, and whether escalation remains.
      operationId: getJobErrors
      responses:
        '200':
          description: Failures.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items: { $ref: '#/components/schemas/FetchFailure' }
                  robotsBlocked:
                    type: array
                    items: { type: string, format: uri }
        '404': { $ref: '#/components/responses/NotFound' }

  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: health
      security: []
      responses:
        '200':
          description: Service health, including each dependency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: One or more dependencies are unhealthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:

  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: hx_...
      description: |
        A Helix API key. Create as many as you need, one per project; each can be
        revoked independently and carries its own rate limit and usage counter.

        This authenticates you to Helix. It is unrelated to your LLM, proxy and
        vector-store credentials, which live in server environment variables and are
        never sent over this API.

  headers:
    RateLimitLimit:
      description: Requests permitted in the current window.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests left in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Unix seconds at which the window resets.
      schema: { type: integer }

  responses:
    JobAccepted:
      description: Job accepted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JobAccepted' }
    BadRequest:
      description: The request was malformed or self-contradictory.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unsupportedKeyword:
              summary: A schema keyword that induces hallucination
              value:
                error: invalid_schema
                message: >-
                  `minItems` is not supported in extraction schemas. Length
                  constraints make models invent entries to satisfy them. Describe
                  the expectation in the field description instead.
                field: extract.schema.properties.plans
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        Rate limit exceeded. Returned only for genuine limit breaches — never
        because Helix's own limiter backend was unavailable.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
        X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Format:
      type: string
      description: |
        An output representation.

        `markdown` is clean prose. `html` is sanitised, `rawHtml` untouched.
        `json` requires `extract` and returns schema-conforming data. `screenshot`
        and `pdf` force the Chromium tier. `chunks` returns semantically split text
        with stable anchors for citation.
      enum: [markdown, html, rawHtml, text, links, images, screenshot, pdf, json, chunks, summary]

    Tier:
      type: string
      description: |
        Fetch tier. Omit to let Helix escalate on evidence — cheapest first, moving
        up only when a block is detected, content is absent from the raw HTML, or a
        requested capability demands it.

        Framework detection alone never triggers escalation: server-rendered React
        and Vue frequently need no browser at all.
      enum: [auto, plain, tls, lightpanda, chromium]
      default: auto

    ScrapeOptions:
      type: object
      description: Shared read options. Reused by scrape, batch, crawl and search.
      properties:
        formats:
          type: array
          items: { $ref: '#/components/schemas/Format' }
          default: [markdown]
        tier: { $ref: '#/components/schemas/Tier' }
        onlyMainContent:
          type: boolean
          default: true
          description: Strip navigation, headers, footers and other furniture.
        includeSelectors:
          type: array
          items: { type: string }
        excludeSelectors:
          type: array
          items: { type: string }
        extractor:
          type: string
          enum: [trafilatura, readability, auto]
          default: trafilatura
          description: |
            HTML-to-text engine. trafilatura is the more precise; readability
            recovers more at the cost of including extra. `auto` picks per page shape.
        waitFor:
          type: integer
          description: Milliseconds to wait after load. Browser tiers only.
          minimum: 0
          maximum: 30000
        timeout:
          type: integer
          default: 30000
          minimum: 1000
          maximum: 300000
        actions:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Action' }
          description: Steps to run before reading. Forces the Chromium tier.
        headers:
          type: object
          additionalProperties: { type: string }
        profile:
          type: string
          description: Browser identity to present. Omit for an automatic choice.
        proxy: { $ref: '#/components/schemas/ProxyConfig' }
        location:
          type: object
          properties:
            country: { type: string, minLength: 2, maxLength: 2 }
            languages:
              type: array
              items: { type: string }
        extract: { $ref: '#/components/schemas/ExtractConfig' }
        chunk: { $ref: '#/components/schemas/ChunkConfig' }
        document: { $ref: '#/components/schemas/DocumentConfig' }
        cache:
          type: object
          properties:
            maxAge:
              type: integer
              description: Serve a cached copy if newer than this many milliseconds. 0 forces a fresh read.
              default: 0
            store:
              type: boolean
              default: true

    ScrapeRequest:
      allOf:
        - type: object
          required: [url]
          properties:
            url: { type: string, format: uri }
        - $ref: '#/components/schemas/ScrapeOptions'

    Action:
      type: object
      required: [type]
      discriminator: { propertyName: type }
      properties:
        type:
          type: string
          enum: [wait, click, write, press, scroll, screenshot, executeJavascript, scrape]
        selector: { type: string }
        milliseconds: { type: integer }
        text: { type: string }
        key: { type: string }
        direction: { type: string, enum: [up, down] }
        script: { type: string }
        fullPage: { type: boolean }

    ExtractConfig:
      type: object
      description: |
        Structured extraction using your configured model.

        Page content is relevance-scored and trimmed before it reaches the model
        rather than dumped wholesale — cheaper and more accurate.

        Constrained decoding guarantees the *shape* of the output and guarantees
        nothing about its truth. Length keywords such as `minItems` and `maxItems`
        are rejected because they push models to invent entries; say what you expect
        in the field description instead.
      properties:
        schema:
          type: object
          description: A JSON Schema. Over ~30 fields, split into several calls — accuracy degrades measurably.
        prompt: { type: string }
        model:
          type: string
          description: Override the server's default model. Must be configured on the server.
        includeSources:
          type: boolean
          default: false
          description: Return the passage that grounded each field.

    ChunkConfig:
      type: object
      description: Split content for retrieval. Chunks carry stable anchors that survive re-crawls, so citations keep resolving.
      properties:
        strategy:
          type: string
          enum: [semantic, heading, fixed]
          default: semantic
        maxTokens: { type: integer, default: 512 }
        overlap: { type: integer, default: 64 }
        contextual:
          type: boolean
          default: false
          description: Prepend a short generated summary to each chunk for retrieval accuracy. Costs one model call per chunk.

    DocumentConfig:
      type: object
      description: |
        Document handling. PDFs are classified before parsing, so a scanned document
        routes to OCR instead of returning garbled characters.
      properties:
        ocr:
          type: string
          enum: [auto, never, always]
          default: auto
        maxPages: { type: integer, minimum: 1 }
        tables:
          type: string
          enum: [auto, high-fidelity]
          default: auto
          description: '`high-fidelity` routes to a table-specialised parser. Slower, markedly better on complex tables.'

    ProxyConfig:
      type: object
      description: Your own proxy. Helix ships no pool and never proxies through its own credentials.
      properties:
        url:
          type: string
          description: 'scheme://user:pass@host:port'
        sessionId:
          type: string
          description: Reuse the same exit IP across requests sharing this value.
        geo: { type: string, minLength: 2, maxLength: 2 }

    Destination:
      type: object
      description: Write results straight to your own store, skipping a round trip.
      required: [type]
      properties:
        type: { type: string, enum: [qdrant, pgvector] }
        collection: { type: string }
        namespace: { type: string }
        upsertMode:
          type: string
          enum: [update-in-place, append]
          default: update-in-place
          description: |
            `update-in-place` derives deterministic point IDs from the URL, so
            re-crawling a site updates existing vectors instead of duplicating them.

    WebhookConfig:
      type: object
      required: [url]
      description: |
        Signed with HMAC-SHA256 over `{timestamp}.{body}`, sent as
        `Helix-Signature: t=<unix>,v1=<hex>`. Compare in constant time and reject
        timestamps outside a five-minute window.

        Delivery retries with exponential backoff for up to three days. Ordering is
        not guaranteed — make your handler idempotent. Exhausted deliveries land in
        a dead-letter queue you can replay.
      properties:
        url: { type: string, format: uri }
        headers:
          type: object
          additionalProperties: { type: string }
        events:
          type: array
          items: { type: string, enum: [started, page, changed, completed, failed] }
        metadata:
          type: object
          description: Echoed back in every delivery.

    MapRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        search: { type: string, description: Rank discovered URLs by relevance to this. }
        sitemap: { type: string, enum: [include, skip, only], default: include }
        includeSubdomains: { type: boolean, default: false }
        ignoreQueryParameters: { type: boolean, default: true }
        limit: { type: integer, default: 5000, maximum: 100000 }

    MapResponse:
      type: object
      properties:
        success: { type: boolean }
        links:
          type: array
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              title: { type: string }
              description: { type: string }
              source: { type: string, enum: [sitemap, links, both] }
              lastModified:
                type: string
                format: date-time
                description: From the sitemap where present. Frequently stale or fabricated — treat as a hint.
        truncated: { type: boolean }

    CrawlRequest:
      allOf:
        - type: object
          required: [url]
          properties:
            url: { type: string, format: uri }
            estimate:
              type: boolean
              default: false
              description: Return projected work instead of crawling.
            limit: { type: integer, default: 1000 }
            maxDepth: { type: integer }
            includePaths:
              type: array
              items: { type: string }
            excludePaths:
              type: array
              items: { type: string }
            allowSubdomains: { type: boolean, default: false }
            allowExternal: { type: boolean, default: false }
            sitemap: { type: string, enum: [include, skip, only], default: include }
            respectRobots:
              type: boolean
              default: true
              description: |
                Honours `robots.txt` including `Crawl-delay`. Disabling is logged and
                is your responsibility — only do it for sites you own or have
                permission to crawl.
            politeness:
              type: string
              enum: [adaptive, fixed]
              default: adaptive
              description: |
                `adaptive` ramps concurrency while a host stays healthy and backs off
                on 429s or rising latency.
            maxConcurrency: { type: integer }
            delay: { type: number, description: Seconds between requests to one host. Overrides adaptive pacing. }
            incremental:
              type: boolean
              default: false
              description: Skip pages whose content hash is unchanged since the last crawl of this site.
            destination: { $ref: '#/components/schemas/Destination' }
            webhook: { $ref: '#/components/schemas/WebhookConfig' }
        - $ref: '#/components/schemas/ScrapeOptions'

    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, maxLength: 500 }
        limit: { type: integer, default: 10, maximum: 100 }
        sources:
          type: array
          items: { type: string, enum: [web, news, images] }
          default: [web]
        categories:
          type: array
          items: { type: string, enum: [github, research, pdf, docs] }
        includeDomains:
          type: array
          items: { type: string }
        excludeDomains:
          type: array
          items: { type: string }
        freshness: { type: string, description: 'Relative window, e.g. `24h`, `7d`, `1y`.' }
        country: { type: string, minLength: 2, maxLength: 2 }
        scrape:
          allOf:
            - $ref: '#/components/schemas/ScrapeOptions'
          description: Read every result in the same call. Omit for metadata only.

    SearchResponse:
      type: object
      properties:
        success: { type: boolean }
        results:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  title: { type: string }
                  url: { type: string, format: uri }
                  snippet: { type: string }
                  position: { type: integer }
                  publishedAt: { type: string, format: date-time }
              - $ref: '#/components/schemas/Document'

    MonitorRequest:
      type: object
      required: [url, schedule]
      properties:
        url: { type: string, format: uri, description: The one page to watch. }
        schedule: { $ref: '#/components/schemas/MonitorSchedule' }
        scrapeOptions:
          type: object
          description: Read options for each check. Same knobs as `/scrape`, minus formats (checks always read markdown).
          properties:
            tier: { $ref: '#/components/schemas/Tier' }
            onlyMainContent: { type: boolean, default: true }
            includeSelectors: { type: array, items: { type: string } }
            excludeSelectors: { type: array, items: { type: string } }
            extractor: { type: string, enum: [trafilatura, readability, auto] }
            waitFor: { type: integer, minimum: 0, maximum: 30000 }
            timeout: { type: integer, minimum: 1000, maximum: 300000 }
            headers: { type: object, additionalProperties: { type: string } }
            profile: { type: string }
            proxy:
              type: object
              properties:
                url: { type: string }
                sessionId: { type: string }
                geo: { type: string, minLength: 2, maxLength: 2 }
        diff: { $ref: '#/components/schemas/MonitorDiffOptions' }
        trigger: { $ref: '#/components/schemas/MonitorTrigger' }
        sensitivity:
          type: string
          enum: [any, significant]
          default: any
          description: |
            `any` compares the text verbatim. `significant` first strips relative
            timestamps ("3 minutes ago"), clock times, dates and tracking parameters,
            so a page whose only difference is noise counts as unchanged.
        webhook:
          description: |
            A URL, or an object with headers, events and a signing secret. Must
            be a public http(s) address: loopback, private-network, link-local
            and metadata addresses are rejected with `field: webhook.url`, and a
            hostname that resolves to one at send time dead-letters the delivery.
          oneOf:
            - { type: string, format: uri }
            - $ref: '#/components/schemas/MonitorWebhook'

    MonitorPatch:
      type: object
      description: Any subset of the create request, plus `status`. At least one field.
      properties:
        schedule: { $ref: '#/components/schemas/MonitorSchedule' }
        scrapeOptions: { type: object }
        diff: { $ref: '#/components/schemas/MonitorDiffOptions' }
        trigger: { $ref: '#/components/schemas/MonitorTrigger' }
        sensitivity: { type: string, enum: [any, significant] }
        webhook:
          nullable: true
          oneOf:
            - { type: string, format: uri }
            - $ref: '#/components/schemas/MonitorWebhook'
        status:
          type: string
          enum: [active, paused]
          description: Pausing clears `nextCheckAt`; resuming computes it from the schedule.

    MonitorSchedule:
      description: |
        A cron expression as a string, or an object with `cron` or `every`
        (`15m`, `6h`, `1d`) and an optional IANA `timezone` (default UTC).
        Business-hours windows are written in cron: `0 9-17 * * 1-5`.
      oneOf:
        - { type: string, example: '0 * * * *' }
        - type: object
          properties:
            cron: { type: string }
            every: { type: string, description: 'Interval such as `15m`, `6h`, `1d`.' }
            timezone: { type: string, default: UTC }

    MonitorDiffOptions:
      type: object
      properties:
        granularity: { type: string, enum: [word, line, character], default: word }
        inline:
          type: boolean
          default: true
          description: Include the diff text and ops in the webhook body. Off sends counts only.

    MonitorTrigger:
      type: object
      description: |
        Narrow what counts as a change. Keyword triggers are string searches on the
        two snapshots and need no model call.
      properties:
        keywordAppears: { type: string, description: Fire only when this phrase appears (case-insensitive). }
        keywordDisappears: { type: string, description: Fire only when this phrase disappears. }
        selector: { type: string, description: Watch only this part of the page. Shorthand for `scrapeOptions.includeSelectors`. }
        minChangeRatio:
          type: number
          minimum: 0
          maximum: 1
          description: Ignore changes smaller than this fraction of the content's tokens.

    MonitorWebhook:
      type: object
      required: [url]
      description: |
        Signed with HMAC-SHA256 over `{timestamp}.{body}` when a `secret` is set
        here or `HELIX_WEBHOOK_SECRET` is set on the instance, sent as
        `Helix-Signature: t=<unix>,v1=<hex>`. `Helix-Event`, `Helix-Delivery-Id`
        and `Helix-Monitor-Id` headers accompany every delivery.

        Delivery retries with backoff (1m, 5m, 30m, 2h, 6h, 12h, then daily)
        for ten attempts over roughly four days, then lands in a dead letter you
        can replay. Ordering is not guaranteed; make the handler idempotent.
      properties:
        url: { type: string, format: uri }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Sent with every delivery. Never echoed back; only the header names are.
        events:
          type: array
          default: [changed]
          items: { type: string, enum: [changed, checked, failed] }
          description: '`changed` on a real change, `checked` on every check, `failed` when a check could not read the page.'
        metadata: { type: object, description: Echoed back in every delivery. }
        secret: { type: string, minLength: 8, description: Per-webhook signing secret. Never echoed back. }

    Monitor:
      type: object
      properties:
        success: { type: boolean }
        id: { type: string, format: uuid }
        monitorId: { type: string, format: uuid, description: Same as `id`. }
        url: { type: string, format: uri }
        schedule:
          type: object
          properties:
            cron: { type: string }
            timezone: { type: string }
            every: { type: string }
        scrapeOptions: { type: object }
        diff: { $ref: '#/components/schemas/MonitorDiffOptions' }
        trigger: { $ref: '#/components/schemas/MonitorTrigger' }
        sensitivity: { type: string, enum: [any, significant] }
        webhook:
          type: object
          nullable: true
          properties:
            url: { type: string, format: uri }
            events: { type: array, items: { type: string } }
            metadata: { type: object, nullable: true }
            headers: { type: array, items: { type: string }, description: Header names only. }
            signed: { type: boolean }
        status:
          type: string
          enum: [active, paused, error]
          description: '`error` after a failed check; clears on the next successful one. Checks keep running.'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastCheckedAt: { type: string, format: date-time, nullable: true }
        nextCheckAt: { type: string, format: date-time, nullable: true, description: Null while paused. }
        lastChangeAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }
        stats:
          type: object
          properties:
            checks: { type: integer }
            changes: { type: integer }
            pagesUnchanged:
              type: integer
              description: Checks that found no change. They store nothing and send nothing.
        latestSnapshot:
          description: Present on `GET /monitor/{id}`; null until the first check.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MonitorSnapshot'

    MonitorSnapshot:
      type: object
      properties:
        id: { type: integer }
        monitorId: { type: string, format: uuid }
        url: { type: string, format: uri }
        capturedAt: { type: string, format: date-time }
        contentHash: { type: string, description: SHA-256 of the markdown. }
        markdown: { type: string }
        snapshotUrl: { type: string }

    MonitorDiff:
      type: object
      description: |
        Exact at the monitor's granularity for ordinary edits. A rewrite too
        large to trace word by word is reported at `line` granularity instead;
        past that it is one delete and one insert, flagged `coarse`. A diff
        whose ops and text exceed 128 KB is stored and delivered with counts
        only, flagged `truncated`.
      properties:
        granularity: { type: string, enum: [word, line, character], description: The granularity that applied, which may be `line` on a large rewrite. }
        added: { type: integer, description: Tokens inserted at the chosen granularity. }
        removed: { type: integer }
        changeRatio: { type: number, description: Changed tokens over the larger side, 0 to 1. }
        coarse: { type: boolean, description: Present and true when the changed region is one delete and one insert. }
        truncated: { type: boolean, description: Present and true when `ops` and `text` were dropped for size. }
        text:
          type: string
          description: 'Line diffs use `+`/`-` prefixes; word and character diffs are inline: `[-old-]{+new+}`.'
        ops:
          type: array
          items:
            type: object
            properties:
              op: { type: string, enum: [equal, insert, delete] }
              text: { type: string }

    MonitorHistoryEntry:
      type: object
      properties:
        id: { type: integer }
        checkedAt: { type: string, format: date-time }
        changed: { type: boolean }
        reason:
          type: string
          enum: [first, changed, unchanged, filtered, trigger_not_met, error]
          description: |
            `first` stored the baseline. `filtered` differed only by noise the
            sensitivity setting ignores. `trigger_not_met` changed but the keyword
            or ratio trigger did not fire; the baseline still moved.
        diff:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MonitorDiff'
        error: { type: string, nullable: true }
        snapshotUrl: { type: string, nullable: true, description: Null when the snapshot was pruned. }

    WebhookDelivery:
      type: object
      properties:
        id: { type: integer }
        event: { type: string, enum: [changed, checked, failed] }
        url: { type: string, format: uri }
        status: { type: string, enum: [pending, delivered, dead] }
        attempts: { type: integer }
        lastError: { type: string, nullable: true }
        responseStatus: { type: integer, nullable: true }
        nextRetryAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, nullable: true }

    Document:
      type: object
      description: The read content of one resource. Identical in shape for web pages and documents.
      properties:
        markdown: { type: string }
        html: { type: string }
        rawHtml: { type: string }
        text: { type: string }
        summary: { type: string }
        links:
          type: array
          items: { type: string, format: uri }
        images:
          type: array
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              alt: { type: string }
        screenshot: { type: string, description: 'Signed URL, expires in 24 hours.' }
        json:
          type: object
          description: Schema-conforming extraction, present when `json` was requested.
        chunks:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              anchor: { type: string, description: 'Stable across re-crawls, so citations keep resolving.' }
              tokens: { type: integer }
              embedding:
                type: array
                items: { type: number }
        metadata: { $ref: '#/components/schemas/Metadata' }

    Metadata:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        language: { type: string }
        sourceUrl: { type: string, format: uri }
        finalUrl: { type: string, format: uri, description: After redirects. }
        statusCode: { type: integer }
        contentType: { type: string }
        fetchedAt: { type: string, format: date-time }
        contentHash: { type: string, description: SHA-256 of normalised content. Drives incremental crawl and change detection. }
        tier: { $ref: '#/components/schemas/Tier' }
        tiersAttempted:
          type: array
          items: { $ref: '#/components/schemas/Tier' }
        profile: { type: string }
        fromCache: { type: boolean }
        document:
          type: object
          description: Present for PDFs and Office files.
          properties:
            pages: { type: integer }
            needsOcr: { type: boolean }
            ocrApplied: { type: boolean }
            suspectedGarbledText:
              type: boolean
              description: >-
                Text layer decoded suspiciously. Common with CJK PDFs; triggers
                an OCR fallback when `ocr` is `auto`.
            parser: { type: string }

    ScrapeResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Document' }
        failure: { $ref: '#/components/schemas/FetchFailure' }
        warnings:
          type: array
          items: { type: string }

    FetchFailure:
      type: object
      description: |
        A typed failure. Bot challenges appear here even when the upstream returned
        200 — a challenge page is never returned as content.
      required: [reason]
      properties:
        url: { type: string, format: uri }
        reason:
          type: string
          enum: [blocked, challenge, timeout, dns, tls, http_error, empty, robots_denied, unsupported_type]
        detail: { type: string }
        statusCode: { type: integer }
        detectedBy:
          type: array
          items: { type: string }
          description: 'Signals that fired, e.g. `cloudflare-interstitial`, `content-too-short`.'
        tier: { $ref: '#/components/schemas/Tier' }
        tiersAttempted:
          type: array
          items: { $ref: '#/components/schemas/Tier' }
        profile: { type: string }
        escalationAvailable:
          type: boolean
          description: Whether a higher tier, another profile or a different proxy could still be tried.

    Estimate:
      type: object
      description: Projected work. Resources rather than credits — Helix sells no inference.
      properties:
        pages: { type: integer }
        pagesFromCache: { type: integer }
        tierBreakdown:
          type: object
          additionalProperties: { type: integer }
        estimatedSeconds: { type: integer }
        estimatedTokens:
          type: object
          properties:
            input: { type: integer }
            output: { type: integer }
        estimatedProviderCost:
          type: object
          description: Your provider's charge at the configured model. Zero when no model is involved.
          properties:
            amount: { type: number }
            currency: { type: string }
            model: { type: string }
        assumptions:
          type: array
          items: { type: string }

    JobAccepted:
      type: object
      properties:
        success: { type: boolean }
        id: { type: string, format: uuid }
        url: { type: string, format: uri, description: Where to poll. }

    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [crawl, batch_scrape, enrich] }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        total: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        next: { type: string, format: uri, description: Cursor for the next page of results. }
        data:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Document'
        usage: { $ref: '#/components/schemas/Usage' }

    Usage:
      type: object
      description: What the job actually consumed. Provider spend is what your provider bills you, not a Helix charge.
      properties:
        pagesFetched: { type: integer }
        pagesFromCache: { type: integer }
        pagesUnchanged: { type: integer }
        browserSeconds: { type: number }
        tokens:
          type: object
          properties:
            input: { type: integer }
            output: { type: integer }
        providerCost:
          type: object
          properties:
            amount: { type: number }
            currency: { type: string }

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded, unhealthy] }
        version: { type: string }
        services:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, degraded, unhealthy] }
              detail: { type: string }
        providers:
          type: object
          description: Which BYOK providers are configured. Never reveals key material.
          additionalProperties:
            type: object
            properties:
              configured: { type: boolean }
              model: { type: string }

    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        field: { type: string }
        requestId: { type: string }
