openapi: 3.1.0

info:
  title: Helix
  version: 0.1.0
  summary: Self-hostable, BYOK web-data API.
  description: |
    Helix turns web pages and documents into clean, structured, LLM-ready data.

    It is self-hosted and bring-your-own-key throughout: Helix never bundles an LLM,
    a proxy pool or a vector store. You configure your own providers; your provider
    bills you directly. Helix takes no margin on inference.

    ## Credentials

    Two distinct concepts, never conflated:

    - **Helix API keys** (`Authorization: Bearer hx_...`) authenticate *you* to this
      Helix instance. Create as many as you like, one per project, each revocable.
    - **Provider credentials** (LLM, embedding, proxy, vector store) belong to the
      operator and are set through environment variables on the server. Helix calls
      *your* models with *your* keys.

    ## Failure semantics

    A page that returns a bot-challenge interstitial is a **failure**, not a success,
    even when the upstream status is 200. Such responses come back as a typed
    `FetchFailure` with a machine-readable `reason`. Helix never returns challenge
    HTML dressed up as content.

    Rate limiting **fails open**: if the limiter's backing store is unavailable the
    request proceeds and the server logs a warning. Infrastructure trouble here never
    becomes a 429 for you. Every response carries `X-RateLimit-*` headers so
    autonomous clients can self-throttle without parsing error strings.

    ## Estimating before you run

    Any operation whose cost scales with discovered pages accepts `estimate: true`
    and returns projected work — pages, time, tokens, provider spend — without
    doing it.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://localhost:7400/v1
    description: Local self-hosted default
  - url: '{scheme}://{host}/v1'
    description: Your deployment
    variables:
      scheme: { default: https, enum: [http, https] }
      host: { default: localhost:7400 }

security:
  - ApiKey: []

tags:
  - name: Scrape
    description: Single-resource read. Web pages and documents share one envelope.
  - name: Parse
    description: Documents by upload or URL, returned in the Scrape envelope.
  - name: Crawl
    description: Multi-page discovery and read.
  - name: Search
    description: Web search, optionally scraping each result.
  - name: Monitors
    description: Scheduled re-reads with change detection.
  - name: Jobs
    description: Status, results and cancellation for asynchronous work.
  - name: System
    description: Health, profiles and capability discovery.

paths:
  /scrape:
    post:
      tags: [Scrape]
      summary: Read one URL
      description: |
        Fetches a single URL and returns it in the formats you ask for.

        Works identically for HTML pages, PDFs and Office documents — the response
        envelope is the same shape regardless of what was on the other end. PDFs are
        classified before parsing, so scanned documents route to OCR rather than
        silently returning garbled text.

        Synchronous. For many URLs, use `/crawl` with an explicit URL list or call `/scrape` concurrently.
      operationId: scrape
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScrapeRequest' }
            examples:
              minimal:
                summary: Just the markdown
                value: { url: 'https://example.com' }
              structured:
                summary: Extract to a schema with your own model
                value:
                  url: 'https://example.com/pricing'
                  formats: [markdown, json]
                  jsonOptions:
                    schema:
                      type: object
                      properties:
                        plans:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              monthlyPrice: { type: number }
                    prompt: Extract every pricing plan on the page.
                    provider: anthropic
                    model: claude-sonnet-4-5
              mobile:
                summary: The phone layout, through your own proxy
                value:
                  url: 'https://example.com'
                  formats: [markdown, screenshot]
                  mobile: true
                  proxy: { url: 'http://user:pass@proxy.example:3128', geo: DE }
              rendered:
                summary: Force a browser and act on the page
                value:
                  url: 'https://example.com/app'
                  tier: chromium
                  formats: [markdown, screenshot]
                  actions:
                    - { type: click, selector: '#accept-cookies' }
                    - { type: scroll, direction: down }
                    - { type: wait, milliseconds: 500 }
      responses:
        '200':
          description: |
            The fetch resolved. Check `success` — a typed failure (including a bot
            challenge) is reported here rather than as an HTTP error, so you can see
            which tier and profile were tried.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScrapeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /parse:
    post:
      tags: [Parse]
      summary: Parse a document
      description: |
        Converts a PDF, DOCX, PPTX or XLSX into markdown (and, with `jsonOptions`,
        structured JSON) — the same envelope `/scrape` returns for web pages.

        Two ways to send the file. A JSON body with `url` makes Helix fetch the
        file first (binary-safe, honouring `timeout` and the upload ceiling). A
        `multipart/form-data` body with a `file` part uploads it directly; the
        other fields ride along as form fields (`formats` comma-separated,
        `jsonOptions` as a JSON string).

        PDFs are classified before parsing: `ocr: auto` runs OCR only when the
        text layer is missing or garbled, `force` always runs it, `off` never
        does and reports `needsOcr` in the metadata instead. Output is cached by
        content hash, so the same file sent twice parses once.

        Synchronous. The upload ceiling is set by the operator
        (`HELIX_PARSE_MAX_UPLOAD_MB`, default 25) and answered with `413`.
        The `url` path only fetches from public hosts over http or https:
        localhost, private, link-local and internal addresses are refused
        with `400`, on the first request and on every redirect. An instance
        holds at most `HELIX_PARSE_MAX_INFLIGHT` parses in memory (default 8)
        and answers `503` with `Retry-After` beyond that.
      operationId: parse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParseRequest' }
            examples:
              url:
                summary: Fetch and parse a remote file
                value:
                  url: 'https://example.com/files/report.pdf'
                  formats: [markdown]
                  ocr: auto
              structured:
                summary: Extract fields with your own model
                value:
                  url: 'https://example.com/files/invoice.pdf'
                  formats: [markdown, json]
                  jsonOptions:
                    schema:
                      type: object
                      properties:
                        invoiceTotal: { type: number }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ParseUpload' }
            encoding:
              file: { contentType: 'application/pdf, application/vnd.openxmlformats-officedocument.*, image/png, image/jpeg' }
      responses:
        '200':
          description: |
            The parse resolved. Check `success` — a remote fetch failure, an
            unsupported file type or an unreachable parser is reported here as a
            typed failure rather than as an HTTP error.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParseResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: The file (uploaded or fetched) exceeds this instance's upload ceiling.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: The request body is neither JSON nor `multipart/form-data`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: This instance is already holding `HELIX_PARSE_MAX_INFLIGHT` parses in memory. Retry after the `Retry-After` header.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /map:
    post:
      tags: [Crawl]
      summary: List a site's URLs
      description: |
        Discovers URLs without reading them. Sitemap-first, falling back to link
        discovery from the seed page.

        Cheap and fast, and the basis of cost estimation for `/crawl` — map first to
        learn how many pages exist, then decide.
      operationId: map
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MapRequest' }
      responses:
        '200':
          description: Discovered URLs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /crawl:
    post:
      tags: [Crawl, Jobs]
      summary: Crawl a site
      description: |
        Discovers and reads pages from a seed URL.

        Respects `robots.txt` by default, including `Crawl-delay`. Politeness is
        adaptive: concurrency ramps while a host stays healthy and backs off on 429s
        or latency spikes.

        Pass `estimate: true` to get projected pages, time and cost without crawling.

        `includePaths` and `excludePaths` take globs (`/blog/*`); a pattern using
        regular-expression syntax (`^/blog`) is treated as one. Exclusion wins
        when both match. `limit` defaults to `HELIX_CRAWL_DEFAULT_LIMIT` and,
        together with `maxDepth`, is capped by the operator. A request above the
        cap is rejected rather than silently clamped.

        With `webhook` set, `started`, `page`, `completed` and `failed` events are
        POSTed to it (see `WebhookPayload`). Cancellation emits nothing.
      operationId: crawl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrawlRequest' }
            examples:
              basic:
                summary: Crawl a docs site
                value: { url: 'https://docs.example.com', limit: 200 }
              estimate:
                summary: What would this cost?
                value: { url: 'https://docs.example.com', estimate: true }
              filtered:
                summary: One section, with a webhook
                value:
                  url: 'https://example.com'
                  limit: 100
                  maxDepth: 3
                  includePaths: ['/blog/*']
                  excludePaths: ['/blog/tag/*']
                  scrapeOptions: { formats: [markdown] }
                  webhook: 'https://myapp.example/webhooks/helix'
              toVectors:
                summary: Crawl straight into a vector store
                value:
                  url: 'https://docs.example.com'
                  chunk: { strategy: semantic, maxTokens: 512 }
                  destination: { type: qdrant, collection: docs }
      responses:
        '200':
          description: Estimate only — returned when `estimate` is true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estimate' }
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /crawl/{jobId}:
    parameters:
      - { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
      - name: cursor
        in: query
        schema: { type: string }
        description: Continue a paginated result set.
    get:
      tags: [Crawl, Jobs]
      summary: Poll a crawl
      description: |
        The same view as `GET /jobs/{id}`, restricted to crawl jobs. Results are
        paginated by `next`; `status` is `queued` until a worker claims the job,
        then `running`, then one of `completed`, `failed` or `cancelled`.
      operationId: getCrawl
      responses:
        '200':
          description: Job state, with results so far.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Crawl, Jobs]
      summary: Cancel a crawl
      description: |
        Stops the crawl. Already-completed results stay retrievable. Cancellation
        does not emit a failure webhook per queued URL.
      operationId: cancelCrawl
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobCancelled' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The job had already finished.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /search:
    post:
      tags: [Search]
      summary: Search the web, optionally reading the results
      description: |
        Runs a web search against the instance's configured backend (SearXNG,
        Serper or SerpAPI) and, when `scrapeOptions` is set, reads each result in
        the same call — so one request goes from question to page content.

        A result page that cannot be read does not fail the search: its row keeps
        `url`, `title` and `description`, carries a typed `failure`, and a line is
        added to `warnings`. One call is bounded by `HELIX_SEARCH_MAX_DURATION_MS`
        (default 120000): pages not read before the budget is spent carry a
        `timeout` failure, and all reads stop when the client disconnects.

        A source the backend cannot answer is reported, not hidden: when every
        requested source fails the call is a 502 `search_failed`; when some
        answer, their results are returned with a `warnings` line per failed
        source and the list is not cached.
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
            example:
              query: transactional email APIs
              limit: 5
              lang: en
              country: us
              tbs: qdr:m
              scrapeOptions:
                formats: [markdown]
                onlyMainContent: true
      responses:
        '200':
          description: Search results, with page content when `scrapeOptions` was set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
              example:
                success: true
                data:
                  web:
                    - url: https://example.com/best-email-apis
                      title: 13 Best Transactional Email APIs
                      description: A comparison of...
                      position: 1
                      markdown: "# 13 Best...\n..."
                      metadata: { statusCode: 200, tier: plain }
                warnings: []
                metadata: { backend: searxng, fromCache: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502':
          description: The search backend failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: No search backend is configured on this instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /monitor:
    get:
      tags: [Monitors]
      summary: List monitors
      description: Monitors created with the calling API key, newest first.
      operationId: listMonitors
      responses:
        '200':
          description: Your monitors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  monitors:
                    type: array
                    items: { $ref: '#/components/schemas/Monitor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Monitors]
      summary: Create a monitor
      description: |
        Watches one URL on a schedule and tells you what changed.

        Each check re-reads the page through the same fetch ladder as `/scrape`
        and compares the markdown with the last snapshot. An unchanged page
        stores no new snapshot and sends nothing. A changed page stores a
        snapshot, records a diff at word, line or character granularity, and
        queues a webhook with the diff inline.

        `sensitivity: significant` strips relative timestamps, clock times,
        dates and tracking parameters before comparing, so rotating noise does
        not count as a change. Keyword triggers narrow it further without a
        model call.

        The schedule is a cron expression or an interval (`15m`, `6h`, `1d`).
        The operator sets the minimum gap between checks
        (`HELIX_MONITOR_MIN_INTERVAL`, hourly by default); a schedule under it
        is rejected with `field: schedule`.
      operationId: createMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonitorRequest' }
            examples:
              pricing:
                summary: Watch a pricing page every hour
                value:
                  url: 'https://example.com/pricing'
                  schedule: '0 * * * *'
                  sensitivity: significant
                  webhook: 'https://your.app/webhooks/helix'
              restock:
                summary: Only tell me when a phrase disappears
                value:
                  url: 'https://example.com/product/123'
                  schedule: { every: '6h', timezone: 'Europe/London' }
                  trigger: { keywordDisappears: 'Out of stock' }
                  webhook: { url: 'https://your.app/webhooks/helix', secret: 'a-shared-secret' }
      responses:
        '201':
          description: Monitor created. The first check runs at `nextCheckAt`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
              example:
                success: true
                id: 'f2a1c6e0-4b7d-4c1e-9a3b-2d5e8f7a1b23'
                monitorId: 'f2a1c6e0-4b7d-4c1e-9a3b-2d5e8f7a1b23'
                url: 'https://example.com/pricing'
                schedule: { cron: '0 * * * *', timezone: 'UTC' }
                sensitivity: significant
                diff: { granularity: word, inline: true }
                trigger: {}
                webhook: { url: 'https://your.app/webhooks/helix', events: [changed], metadata: null, headers: [], signed: false }
                status: active
                createdAt: '2026-08-24T12:30:00.000Z'
                updatedAt: '2026-08-24T12:30:00.000Z'
                lastCheckedAt: null
                nextCheckAt: '2026-08-24T13:00:00.000Z'
                lastChangeAt: null
                lastError: null
                stats: { checks: 0, changes: 0, pagesUnchanged: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /monitor/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Monitors]
      summary: Get a monitor
      description: Status, stats and the latest snapshot (markdown) once a check has run.
      operationId: getMonitor
      responses:
        '200':
          description: The monitor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Monitors]
      summary: Update a monitor
      description: |
        Change the schedule, read options, diff, trigger, sensitivity or webhook,
        or pause and resume with `status`. A new schedule is validated against the
        instance minimum and resets `nextCheckAt`. Send `webhook: null` to remove it.
      operationId: updateMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonitorPatch' }
      responses:
        '200':
          description: The updated monitor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Monitors]
      summary: Delete a monitor
      description: Stops the schedule and removes the monitor, its snapshots, history and pending deliveries.
      operationId: deleteMonitor
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  /monitor/{id}/history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: cursor, in: query, required: false, schema: { type: integer }, description: Return entries older than this id. Taken from `next`. }
      - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 50 } }
    get:
      tags: [Monitors]
      summary: Change timeline
      description: Every check, newest first, including the quiet ones. Paginated by cursor.
      operationId: monitorHistory
      responses:
        '200':
          description: The timeline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  monitorId: { type: string, format: uuid }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/MonitorHistoryEntry' }
                  next:
                    type: string
                    nullable: true
                    description: Path of the next page, or null on the last page.
        '404': { $ref: '#/components/responses/NotFound' }

  /monitor/{id}/snapshots/{snapshotId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: snapshotId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Monitors]
      summary: Read a snapshot
      description: The markdown captured by one check. `snapshotUrl` in history entries and webhook payloads points here.
      operationId: monitorSnapshot
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitorSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }

  /monitor/{id}/check:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Monitors]
      summary: Check now
      description: |
        Runs one check immediately, outside the schedule, and returns the
        resulting history entry. The regular schedule is unaffected. The check
        takes the same lock and the same instance-wide slot as a scheduled one:
        a monitor already mid-check answers 409 `check_in_progress`, a paused
        monitor 409 `monitor_paused`, and an instance with every slot busy 503
        `busy` with `Retry-After`.
      operationId: checkMonitor
      responses:
        '200':
          description: The check that ran.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  monitorId: { type: string, format: uuid }
                  check: { $ref: '#/components/schemas/MonitorHistoryEntry' }
                  webhookQueued: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Paused (`monitor_paused`) or already running (`check_in_progress`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Every check slot is in use (`busy`). Retry after the `Retry-After` seconds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /monitor/{id}/deliveries:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Monitors]
      summary: Webhook deliveries
      description: The last 100 deliveries for this monitor with their attempt count, last error and next retry. Dead-lettered ones can be replayed.
      operationId: monitorDeliveries
      responses:
        '200':
          description: Deliveries, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  monitorId: { type: string, format: uuid }
                  deliveries:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
        '404': { $ref: '#/components/responses/NotFound' }

  /monitor/{id}/deliveries/{deliveryId}/replay:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: deliveryId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Monitors]
      summary: Replay a dead-lettered delivery
      description: Puts a dead delivery back on the queue with a fresh attempt count. Pending and delivered rows are refused with 409.
      operationId: replayMonitorDelivery
      responses:
        '200':
          description: Queued again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  delivery: { $ref: '#/components/schemas/WebhookDelivery' }
        '409':
          description: Not dead-lettered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: cursor
        in: query
        schema: { type: string }
        description: Continue a paginated result set.
    get:
      tags: [Jobs]
      summary: Get job status and results
      operationId: getJob
      responses:
        '200':
          description: Job state, with results so far.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Jobs]
      summary: Cancel a job
      description: |
        Stops the job. Already-completed results stay retrievable. Cancellation does
        not emit a failure webhook per queued URL.
      operationId: cancelJob
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{id}/errors:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Jobs]
      summary: Per-URL failures for a job
      description: Every failure with its typed reason, the tier and profile tried, and whether escalation remains.
      operationId: getJobErrors
      responses:
        '200':
          description: Failures.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items: { $ref: '#/components/schemas/FetchFailure' }
                  robotsBlocked:
                    type: array
                    items: { type: string, format: uri }
        '404': { $ref: '#/components/responses/NotFound' }

  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: health
      security: []
      responses:
        '200':
          description: Service health, including each dependency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: One or more dependencies are unhealthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

components:

  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: hx_...
      description: |
        A Helix API key. Create as many as you need, one per project; each can be
        revoked independently and carries its own rate limit and usage counter.

        This authenticates you to Helix. It is unrelated to your LLM, proxy and
        vector-store credentials, which live in server environment variables and are
        never sent over this API.

  headers:
    RateLimitLimit:
      description: Requests permitted in the current window.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests left in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Unix seconds at which the window resets.
      schema: { type: integer }

  responses:
    JobAccepted:
      description: Job accepted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JobAccepted' }
    BadRequest:
      description: The request was malformed or self-contradictory.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unsupportedKeyword:
              summary: A schema keyword that induces hallucination
              value:
                error: invalid_schema
                message: >-
                  `minItems` is not supported in extraction schemas. Length
                  constraints make models invent entries to satisfy them. Describe
                  the expectation in the field description instead.
                field: jsonOptions.schema.properties.plans.minItems
            proxyUnavailable:
              summary: stealth asked for a proxy the instance does not have
              value:
                error: proxy_unavailable
                message: >-
                  `proxy: "stealth"` needs a proxy configured on this instance. Set
                  HELIX_PROXY_URL, or pass your own as `proxy: { url }`.
                field: proxy
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        Rate limit exceeded. Returned only for genuine limit breaches — never
        because Helix's own limiter backend was unavailable.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
        X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    Format:
      type: string
      description: |
        An output representation.

        `markdown` is clean prose. `html` is the page with scripts, styles,
        comments and inline handlers stripped; `rawHtml` is untouched. `json`
        requires `jsonOptions.schema` and returns schema-conforming data.
        `screenshot` forces the Chromium tier. `chunks` returns split text with
        stable anchors for citation.
      enum: [markdown, html, rawHtml, text, links, screenshot, json, chunks]

    Tier:
      type: string
      description: |
        Fetch tier. Omit to let Helix escalate on evidence — cheapest first, moving
        up only when a block is detected, content is absent from the raw HTML, or a
        requested capability demands it.

        Framework detection alone never triggers escalation: server-rendered React
        and Vue frequently need no browser at all.
      enum: [auto, plain, tls, lightpanda, chromium]
      default: auto

    ScrapeOptions:
      type: object
      description: Shared read options. Reused by scrape and crawl; search takes the `SearchScrapeOptions` subset.
      properties:
        formats:
          type: array
          items: { $ref: '#/components/schemas/Format' }
          default: [markdown]
        tier: { $ref: '#/components/schemas/Tier' }
        onlyMainContent:
          type: boolean
          default: true
          description: Strip navigation, headers, footers and other furniture.
        includeSelectors:
          type: array
          items: { type: string }
        excludeSelectors:
          type: array
          items: { type: string }
        extractor:
          type: string
          enum: [trafilatura, readability, auto]
          default: trafilatura
          description: |
            HTML-to-text engine. trafilatura is the more precise; readability
            recovers more at the cost of including extra. `auto` picks per page shape.
        waitFor:
          type: integer
          description: Milliseconds to wait after load. Browser tiers only.
          minimum: 0
          maximum: 30000
        timeout:
          type: integer
          default: 30000
          minimum: 1000
          maximum: 300000
          description: |
            Milliseconds for the whole fetch. On the browser tiers this is one
            budget shared by navigation, `waitFor`, `actions` and the screenshot,
            not a per-step allowance.
        mobile:
          type: boolean
          default: false
          description: |
            Render in a phone viewport (390x844, touch enabled). Forces the Chromium
            tier when `tier` is `auto`. With `plain`, `tls` or `lightpanda` no
            viewport exists, so the page is fetched as-is, a warning says so, and
            `metadata.mobile` is `false`.
        actions:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Action' }
          description: Steps to run before reading. Forces the Chromium tier.
        headers:
          type: object
          additionalProperties: { type: string }
        profile:
          type: string
          description: Browser identity to present. Omit for an automatic choice.
        proxy:
          description: |
            `auto` uses the instance's `HELIX_PROXY_URL` when one is set and goes
            direct otherwise. `stealth` requires it and is a 400 `proxy_unavailable`
            when none is set. `none` goes direct regardless. An object is your own
            proxy for this one request. Helix ships no pool.

            A proxied request never uses the `lightpanda` tier: `auto` skips it, and
            asking for it explicitly is a failure rather than a fetch from the
            instance's own address.
          oneOf:
            - type: string
              enum: [auto, stealth, none]
            - $ref: '#/components/schemas/ProxyConfig'
        extract:
          allOf:
            - $ref: '#/components/schemas/ExtractConfig'
          description: 'Same option as `jsonOptions`. Send one of the two, not both.'
        jsonOptions:
          allOf:
            - $ref: '#/components/schemas/ExtractConfig'
          description: 'Structured extraction for the `json` format. `schema` is required when `json` is requested.'
        chunk: { $ref: '#/components/schemas/ChunkConfig' }

    ScrapeRequest:
      allOf:
        - type: object
          required: [url]
          properties:
            url: { type: string, format: uri }
        - $ref: '#/components/schemas/ScrapeOptions'

    Action:
      type: object
      required: [type]
      discriminator: { propertyName: type }
      properties:
        type:
          type: string
          enum: [wait, click, write, press, scroll, screenshot, executeJavascript, scrape]
        selector: { type: string }
        milliseconds: { type: integer }
        text: { type: string }
        key: { type: string }
        direction: { type: string, enum: [up, down] }
        script: { type: string }
        fullPage: { type: boolean }

    ExtractConfig:
      type: object
      description: |
        Structured extraction using your configured model.

        Page content is relevance-scored and trimmed before it reaches the model
        rather than dumped wholesale — cheaper and more accurate.

        Constrained decoding guarantees the *shape* of the output and guarantees
        nothing about its truth. Length keywords such as `minItems` and `maxItems`
        are rejected because they push models to invent entries; say what you expect
        in the field description instead.
      properties:
        schema:
          type: object
          description: 'A JSON Schema. Required for the `json` format. Over ~30 fields, split into several calls.'
        prompt:
          type: string
          maxLength: 4000
          description: 'Guidance for the model. Accompanies a schema; it cannot replace one.'
        provider:
          type: string
          enum: [anthropic, openai, openrouter, google, gemini, ollama, vllm, openai-compatible]
          description: |
            Override the instance default provider. Its key must already be
            configured (`ANTHROPIC_API_KEY`, `OPENAI_API_KEY`, `OPENROUTER_API_KEY`,
            `GEMINI_API_KEY` or `GOOGLE_API_KEY`, `OPENAI_COMPATIBLE_BASE_URL`);
            Helix never accepts credentials over the API.
        model:
          type: string
          maxLength: 200
          description: |
            Override the instance default model. When `provider` differs from the
            instance default and `model` is omitted, a standard model for that
            provider is used; `ollama`, `vllm` and `openai-compatible` have none,
            so `model` is required there (400 with `field: jsonOptions.model`).
        includeSources:
          type: boolean
          default: false
          description: |
            Return the passages that reached the model as `jsonSources`: each with
            its `text`, its `index` in page order, and the relevance `score` that
            selected it.

    ChunkConfig:
      type: object
      description: Split content for retrieval. Chunks carry stable anchors that survive re-crawls, so citations keep resolving.
      properties:
        strategy:
          type: string
          enum: [semantic, heading, fixed]
          default: semantic
        maxTokens: { type: integer, default: 512, minimum: 64, maximum: 4096 }
        overlap: { type: integer, default: 64, minimum: 0, maximum: 1024 }

    DocumentConfig:
      type: object
      description: |
        Document handling. PDFs are classified before parsing, so a scanned document
        routes to OCR instead of returning garbled characters.
      properties:
        ocr:
          type: string
          enum: [auto, never, always]
          default: auto
        maxPages: { type: integer, minimum: 1 }
        tables:
          type: string
          enum: [auto, high-fidelity]
          default: auto
          description: '`high-fidelity` routes to a table-specialised parser. Slower, markedly better on complex tables.'

    ProxyConfig:
      type: object
      description: Your own proxy. Helix ships no pool and never proxies through its own credentials.
      properties:
        url:
          type: string
          description: 'scheme://user:pass@host:port'
        sessionId:
          type: string
          description: Reuse the same exit IP across requests sharing this value.
        geo: { type: string, minLength: 2, maxLength: 2 }

    Destination:
      type: object
      description: Write results straight to your own store, skipping a round trip.
      required: [type]
      properties:
        type: { type: string, enum: [qdrant, pgvector] }
        collection: { type: string }
        namespace: { type: string }
        upsertMode:
          type: string
          enum: [update-in-place, append]
          default: update-in-place
          description: |
            `update-in-place` derives deterministic point IDs from the URL, so
            re-crawling a site updates existing vectors instead of duplicating them.

    WebhookConfig:
      type: object
      required: [url]
      description: |
        When `HELIX_WEBHOOK_SECRET` is set, deliveries are signed with HMAC-SHA256
        over `{timestamp}.{body}` and sent as `Helix-Signature: t=<unix>,v1=<hex>`.
        Compare in constant time and reject timestamps outside a five-minute
        window. Every delivery also carries `Helix-Event` and `Helix-Delivery-Id`.

        Delivery retries with exponential backoff (one minute, doubling, capped at
        six hours) for `HELIX_WEBHOOK_MAX_ATTEMPTS` attempts, about three days at
        the default of 20. Only a 5xx, a 408/429 or a network failure is retried;
        a 4xx, a redirect or an unsendable request dead-letters on the first
        attempt. Ordering is not guaranteed; make your handler idempotent.
        Exhausted deliveries are kept as dead letters in `webhook_deliveries`
        for `HELIX_RESULT_TTL_HOURS`.

        The URL must be `http` or `https` on a public hostname or address:
        loopback, private and link-local targets, bare service names and
        `localhost` are rejected, and the name is resolved again before each
        send. Redirects are not followed.
      properties:
        url: { type: string, format: uri }
        headers:
          type: object
          additionalProperties: { type: string }
          description: |
            Sent with every delivery, at most 16. `Content-Type`, `Host`,
            `User-Agent` and the `Helix-*` headers are set by Helix and cannot
            be overridden.
        events:
          type: array
          description: Subscribe to a subset. Omitted means every event. `changed` is emitted by monitors only.
          items: { type: string, enum: [started, page, changed, completed, failed] }
        metadata:
          type: object
          description: Echoed back in every delivery. At most 4096 bytes serialised.

    WebhookPayload:
      type: object
      description: The JSON body of every webhook delivery.
      properties:
        id: { type: string, description: 'Delivery id, also sent as Helix-Delivery-Id.' }
        event: { type: string, enum: [started, page, changed, completed, failed] }
        jobId: { type: [string, 'null'], format: uuid }
        monitorId: { type: [string, 'null'], format: uuid }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          description: |
            Per event. `started`: `{ url, limit, maxDepth }`. `page`: `{ url, markdown,
            metadata }`. `completed`: `{ total, completed, failed, unchanged }`.
            `failed`: `{ error }`.
        metadata:
          type: [object, 'null']
          description: The `metadata` given in the webhook config.

    ParseJsonOptions:
      type: object
      description: |
        Structured extraction over the parsed content, using the operator's
        configured model. Needs a `schema` or a `prompt`. Length keywords
        (`minItems`, `maxItems`) are rejected for the same reason as in
        `ExtractConfig`. A `provider` override is not accepted: the instance's
        `HELIX_LLM_PROVIDER` applies to every call.
      additionalProperties: false
      properties:
        schema: { type: object }
        prompt: { type: string }
        model:
          type: string
          description: Override the server's default model. Must be configured on the server.

    ParseOptions:
      type: object
      properties:
        formats:
          type: array
          items: { type: string, enum: [markdown, json] }
          default: [markdown]
        ocr:
          type: string
          enum: [auto, force, off]
          default: auto
          description: '`auto` runs OCR only when the text layer is missing or garbled; `force` always; `off` never (the metadata still reports `needsOcr`).'
        maxPages: { type: integer, minimum: 1 }
        tables:
          type: string
          enum: [auto, high-fidelity]
          default: auto
          description: '`high-fidelity` routes PDFs to a table-specialised parser when one is installed.'
        timeout:
          type: integer
          minimum: 1000
          maximum: 300000
          default: 30000
          description: Remote fetch budget in milliseconds. Applies to the `url` path only.
        jsonOptions: { $ref: '#/components/schemas/ParseJsonOptions' }

    ParseRequest:
      allOf:
        - $ref: '#/components/schemas/ParseOptions'
        - type: object
          required: [url]
          properties:
            url:
              type: string
              format: uri
              description: The file to fetch. An HTML page here is a typed `unsupported_type` failure — use `/scrape` for pages.

    ParseUpload:
      allOf:
        - type: object
          required: [file]
          properties:
            file: { type: string, format: binary }
            formats:
              type: string
              description: Comma-separated, e.g. `markdown,json`. Repeated `formats` fields also work.
            jsonOptions:
              type: string
              description: A `ParseJsonOptions` object encoded as a JSON string.
        - type: object
          properties:
            ocr: { type: string, enum: [auto, force, off] }
            maxPages: { type: integer }
            tables: { type: string, enum: [auto, high-fidelity] }

    ParseMetadata:
      type: object
      required: [filename, pageCount, fileType, ocrUsed, needsOcr, suspectedGarbledText, parser, sizeBytes, contentHash, fetchedAt, timingMs, fromCache]
      properties:
        filename: { type: [string, 'null'] }
        pageCount:
          type: integer
          description: Pages for PDF, slides for PPTX; `0` for DOCX and XLSX, which have no fixed pagination.
        fileType:
          type: string
          enum: [pdf, docx, pptx, xlsx, png, jpg]
        ocrUsed: { type: boolean }
        needsOcr:
          type: boolean
          description: The classifier judged the text layer missing or unusable, whether or not OCR then ran.
        suspectedGarbledText: { type: boolean }
        parser:
          type: string
          description: Which parser produced the markdown, e.g. `pypdfium2`, `marker`, `python-docx`.
        sizeBytes: { type: integer }
        contentHash: { type: string, description: SHA-256 of the file bytes; the cache key. }
        sourceUrl: { type: string, format: uri, description: Present on the `url` path only. }
        fetchedAt: { type: string, format: date-time }
        timingMs: { type: integer }
        fromCache: { type: boolean }

    ParseDocument:
      type: object
      required: [metadata]
      properties:
        markdown: { type: string }
        json:
          type: object
          description: Present when `formats` includes `json` and the model step succeeded.
        usage:
          type: object
          properties:
            tokens:
              type: object
              properties:
                input: { type: integer }
                output: { type: integer }
            model: { type: string }
        metadata: { $ref: '#/components/schemas/ParseMetadata' }

    ParseResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/ParseDocument' }
        failure: { $ref: '#/components/schemas/FetchFailure' }
        warnings:
          type: array
          items: { type: string }
          description: 'Non-fatal notes: a missing text layer with OCR off, or a failed model step when the parse itself succeeded.'

    MapRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        search: { type: string, description: Rank discovered URLs by relevance to this. }
        sitemap: { type: string, enum: [include, skip, only], default: include }
        includeSubdomains: { type: boolean, default: false }
        ignoreQueryParameters: { type: boolean, default: true }
        limit: { type: integer, default: 5000, maximum: 100000 }

    MapResponse:
      type: object
      properties:
        success: { type: boolean }
        links:
          type: array
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              title: { type: string }
              description: { type: string }
              source: { type: string, enum: [sitemap, links, both] }
              lastModified:
                type: string
                format: date-time
                description: From the sitemap where present. Frequently stale or fabricated — treat as a hint.
        truncated: { type: boolean }

    CrawlRequest:
      allOf:
        - type: object
          required: [url]
          properties:
            url: { type: string, format: uri }
            estimate:
              type: boolean
              default: false
              description: Return projected work instead of crawling.
            limit:
              type: integer
              minimum: 1
              description: Maximum pages. Defaults to `HELIX_CRAWL_DEFAULT_LIMIT` (1000); rejected above `HELIX_CRAWL_MAX_LIMIT` (100000).
            maxDepth:
              type: integer
              minimum: 0
              description: Link depth from the seed. Rejected above `HELIX_CRAWL_MAX_DEPTH` (50).
            includePaths:
              type: array
              description: Globs over the pathname, e.g. `/blog/*`. Only matching URLs are crawled.
              items: { type: string }
            excludePaths:
              type: array
              description: Globs over the pathname, e.g. `/blog/tag/*`. Wins over `includePaths`.
              items: { type: string }
            allowSubdomains: { type: boolean, default: false }
            allowExternal: { type: boolean, default: false }
            allowExternalLinks:
              type: boolean
              description: Alias of `allowExternal`.
            sitemap: { type: string, enum: [include, skip, only], default: include }
            respectRobots:
              type: boolean
              default: true
              description: |
                Honours `robots.txt` including `Crawl-delay`. Disabling is logged and
                is your responsibility — only do it for sites you own or have
                permission to crawl.
            politeness:
              type: string
              enum: [adaptive, fixed]
              default: adaptive
              description: |
                `adaptive` ramps concurrency while a host stays healthy and backs off
                on 429s or rising latency.
            maxConcurrency: { type: integer }
            delay: { type: number, description: Seconds between requests to one host. Overrides adaptive pacing. }
            incremental:
              type: boolean
              default: false
              description: Skip pages whose content hash is unchanged since the last crawl of this site.
            ignoreQueryParameters: { type: boolean, default: false }
            scrapeOptions:
              description: Per-page options in the nested form the spec uses. Overrides the same fields given at the top level.
              type: object
              properties:
                formats:
                  type: array
                  items: { $ref: '#/components/schemas/Format' }
                tier: { $ref: '#/components/schemas/Tier' }
                extractor: { type: string, enum: [trafilatura, readability, auto] }
                onlyMainContent: { type: boolean }
            destination: { $ref: '#/components/schemas/Destination' }
            webhook:
              description: A bare URL subscribes to every event; the object form adds headers, an event filter and metadata.
              oneOf:
                - { type: string, format: uri }
                - $ref: '#/components/schemas/WebhookConfig'
        - $ref: '#/components/schemas/ScrapeOptions'

    SearchScrapeOptions:
      type: object
      description: |
        Read options applied to every result page. The subset of `ScrapeOptions`
        that a per-result read supports; `extract`, `actions` and `proxy` are not
        accepted here.
      properties:
        formats:
          type: array
          items: { type: string, enum: [markdown, text, rawHtml, links, screenshot] }
          default: [markdown]
        tier: { $ref: '#/components/schemas/Tier' }
        onlyMainContent: { type: boolean, default: true }
        includeSelectors:
          type: array
          items: { type: string }
        excludeSelectors:
          type: array
          items: { type: string }
        extractor:
          type: string
          enum: [trafilatura, readability, auto]
          default: trafilatura
        waitFor: { type: integer, minimum: 0, maximum: 30000 }
        timeout: { type: integer, default: 20000, minimum: 1000, maximum: 120000 }
        headers:
          type: object
          additionalProperties: { type: string }
        profile: { type: string }

    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 500 }
        limit:
          type: integer
          default: 5
          minimum: 1
          description: Results per source. The instance ceiling is `HELIX_SEARCH_MAX_RESULTS` (default 50).
        lang:
          type: string
          minLength: 2
          maxLength: 2
          description: Two-letter UI language, e.g. `en`.
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: Two-letter country, e.g. `us`.
        tbs:
          type: string
          pattern: '^qdr:[hdwmy][0-9]*$'
          description: 'Time filter in Google `tbs` form: `qdr:d` (day), `qdr:w`, `qdr:m`, `qdr:y`. Wins over `freshness`.'
        freshness:
          type: string
          pattern: '^[0-9]{1,4}[hdwmy]$'
          description: 'Relative window, e.g. `24h`, `7d`, `1y`. Converted to `tbs`.'
        sources:
          type: array
          items: { type: string, enum: [web, news, images] }
          maxItems: 3
          uniqueItems: true
          default: [web]
          description: Each source is one backend call and `limit` more pages to read; repeats are collapsed.
        categories:
          type: array
          items: { type: string, enum: [github, research, pdf, docs] }
          description: Shorthands expanded into search operators.
        includeDomains:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SearchDomain' }
        excludeDomains:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SearchDomain' }
        scrapeOptions:
          allOf:
            - $ref: '#/components/schemas/SearchScrapeOptions'
          description: Read every result in the same call. Omit for url, title and description only.
        scrape:
          allOf:
            - $ref: '#/components/schemas/SearchScrapeOptions'
          deprecated: true
          description: Alias of `scrapeOptions`, kept for early callers.

    SearchDomain:
      type: string
      maxLength: 253
      pattern: '^[a-zA-Z0-9-]{1,63}(\.[a-zA-Z0-9-]{1,63})+$'
      description: A hostname as a `site:` operator accepts it, e.g. `docs.example.com`. No scheme, no path.

    SearchResult:
      type: object
      required: [url, title, position]
      properties:
        url: { type: string, format: uri }
        title: { type: string }
        description: { type: string, description: The backend's snippet. }
        position: { type: integer }
        publishedAt: { type: string }
        imageUrl: { type: string, format: uri, description: Image results only. }
        markdown: { type: string }
        text: { type: string }
        rawHtml: { type: string }
        links:
          type: array
          items: { type: string, format: uri }
        screenshot: { type: string }
        metadata: { $ref: '#/components/schemas/Metadata' }
        failure:
          allOf:
            - $ref: '#/components/schemas/FetchFailure'
          description: Present when this result page could not be read. The search still succeeds.

    SearchResponse:
      type: object
      required: [success, data, warnings]
      properties:
        success: { type: boolean }
        data:
          type: object
          required: [web]
          properties:
            web:
              type: array
              items: { $ref: '#/components/schemas/SearchResult' }
            news:
              type: array
              items: { $ref: '#/components/schemas/SearchResult' }
            images:
              type: array
              items: { $ref: '#/components/schemas/SearchResult' }
        warnings:
          type: array
          items: { type: string }
          description: One line per result page that could not be read, or a note that the backend returned nothing.
        metadata:
          type: object
          properties:
            backend: { type: string, enum: [searxng, serper, serpapi] }
            fromCache: { type: boolean, description: The ranked list came from the short-TTL query cache; pages are always read fresh. }

    MonitorRequest:
      type: object
      required: [url, schedule]
      properties:
        url: { type: string, format: uri, description: The one page to watch. }
        schedule: { $ref: '#/components/schemas/MonitorSchedule' }
        scrapeOptions:
          type: object
          description: Read options for each check. Same knobs as `/scrape`, minus formats (checks always read markdown).
          properties:
            tier: { $ref: '#/components/schemas/Tier' }
            onlyMainContent: { type: boolean, default: true }
            includeSelectors: { type: array, items: { type: string } }
            excludeSelectors: { type: array, items: { type: string } }
            extractor: { type: string, enum: [trafilatura, readability, auto] }
            waitFor: { type: integer, minimum: 0, maximum: 30000 }
            timeout: { type: integer, minimum: 1000, maximum: 300000 }
            headers: { type: object, additionalProperties: { type: string } }
            profile: { type: string }
            proxy:
              type: object
              properties:
                url: { type: string }
                sessionId: { type: string }
                geo: { type: string, minLength: 2, maxLength: 2 }
        diff: { $ref: '#/components/schemas/MonitorDiffOptions' }
        trigger: { $ref: '#/components/schemas/MonitorTrigger' }
        sensitivity:
          type: string
          enum: [any, significant]
          default: any
          description: |
            `any` compares the text verbatim. `significant` first strips relative
            timestamps ("3 minutes ago"), clock times, dates and tracking parameters,
            so a page whose only difference is noise counts as unchanged.
        webhook:
          description: |
            A URL, or an object with headers, events and a signing secret. Must
            be a public http(s) address: loopback, private-network, link-local
            and metadata addresses are rejected with `field: webhook.url`, and a
            hostname that resolves to one at send time dead-letters the delivery.
          oneOf:
            - { type: string, format: uri }
            - $ref: '#/components/schemas/MonitorWebhook'

    MonitorPatch:
      type: object
      description: Any subset of the create request, plus `status`. At least one field.
      properties:
        schedule: { $ref: '#/components/schemas/MonitorSchedule' }
        scrapeOptions: { type: object }
        diff: { $ref: '#/components/schemas/MonitorDiffOptions' }
        trigger: { $ref: '#/components/schemas/MonitorTrigger' }
        sensitivity: { type: string, enum: [any, significant] }
        webhook:
          nullable: true
          oneOf:
            - { type: string, format: uri }
            - $ref: '#/components/schemas/MonitorWebhook'
        status:
          type: string
          enum: [active, paused]
          description: Pausing clears `nextCheckAt`; resuming computes it from the schedule.

    MonitorSchedule:
      description: |
        A cron expression as a string, or an object with `cron` or `every`
        (`15m`, `6h`, `1d`) and an optional IANA `timezone` (default UTC).
        Business-hours windows are written in cron: `0 9-17 * * 1-5`.
      oneOf:
        - { type: string, example: '0 * * * *' }
        - type: object
          properties:
            cron: { type: string }
            every: { type: string, description: 'Interval such as `15m`, `6h`, `1d`.' }
            timezone: { type: string, default: UTC }

    MonitorDiffOptions:
      type: object
      properties:
        granularity: { type: string, enum: [word, line, character], default: word }
        inline:
          type: boolean
          default: true
          description: Include the diff text and ops in the webhook body. Off sends counts only.

    MonitorTrigger:
      type: object
      description: |
        Narrow what counts as a change. Keyword triggers are string searches on the
        two snapshots and need no model call.
      properties:
        keywordAppears: { type: string, description: Fire only when this phrase appears (case-insensitive). }
        keywordDisappears: { type: string, description: Fire only when this phrase disappears. }
        selector: { type: string, description: Watch only this part of the page. Shorthand for `scrapeOptions.includeSelectors`. }
        minChangeRatio:
          type: number
          minimum: 0
          maximum: 1
          description: Ignore changes smaller than this fraction of the content's tokens.

    MonitorWebhook:
      type: object
      required: [url]
      description: |
        Signed with HMAC-SHA256 over `{timestamp}.{body}` when a `secret` is set
        here or `HELIX_WEBHOOK_SECRET` is set on the instance, sent as
        `Helix-Signature: t=<unix>,v1=<hex>`. `Helix-Event`, `Helix-Delivery-Id`
        and `Helix-Monitor-Id` headers accompany every delivery.

        Delivery retries with backoff (1m, 5m, 30m, 2h, 6h, 12h, then daily)
        for ten attempts over roughly four days, then lands in a dead letter you
        can replay. Ordering is not guaranteed; make the handler idempotent.
      properties:
        url: { type: string, format: uri }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Sent with every delivery. Never echoed back; only the header names are.
        events:
          type: array
          default: [changed]
          items: { type: string, enum: [changed, checked, failed] }
          description: '`changed` on a real change, `checked` on every check, `failed` when a check could not read the page.'
        metadata: { type: object, description: Echoed back in every delivery. }
        secret: { type: string, minLength: 8, description: Per-webhook signing secret. Never echoed back. }

    Monitor:
      type: object
      properties:
        success: { type: boolean }
        id: { type: string, format: uuid }
        monitorId: { type: string, format: uuid, description: Same as `id`. }
        url: { type: string, format: uri }
        schedule:
          type: object
          properties:
            cron: { type: string }
            timezone: { type: string }
            every: { type: string }
        scrapeOptions: { type: object }
        diff: { $ref: '#/components/schemas/MonitorDiffOptions' }
        trigger: { $ref: '#/components/schemas/MonitorTrigger' }
        sensitivity: { type: string, enum: [any, significant] }
        webhook:
          type: object
          nullable: true
          properties:
            url: { type: string, format: uri }
            events: { type: array, items: { type: string } }
            metadata: { type: object, nullable: true }
            headers: { type: array, items: { type: string }, description: Header names only. }
            signed: { type: boolean }
        status:
          type: string
          enum: [active, paused, error]
          description: '`error` after a failed check; clears on the next successful one. Checks keep running.'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastCheckedAt: { type: string, format: date-time, nullable: true }
        nextCheckAt: { type: string, format: date-time, nullable: true, description: Null while paused. }
        lastChangeAt: { type: string, format: date-time, nullable: true }
        lastError: { type: string, nullable: true }
        stats:
          type: object
          properties:
            checks: { type: integer }
            changes: { type: integer }
            pagesUnchanged:
              type: integer
              description: Checks that found no change. They store nothing and send nothing.
        latestSnapshot:
          description: Present on `GET /monitor/{id}`; null until the first check.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MonitorSnapshot'

    MonitorSnapshot:
      type: object
      properties:
        id: { type: integer }
        monitorId: { type: string, format: uuid }
        url: { type: string, format: uri }
        capturedAt: { type: string, format: date-time }
        contentHash: { type: string, description: SHA-256 of the markdown. }
        markdown: { type: string }
        snapshotUrl: { type: string }

    MonitorDiff:
      type: object
      description: |
        Exact at the monitor's granularity for ordinary edits. A rewrite too
        large to trace word by word is reported at `line` granularity instead;
        past that it is one delete and one insert, flagged `coarse`. A diff
        whose ops and text exceed 128 KB is stored and delivered with counts
        only, flagged `truncated`.
      properties:
        granularity: { type: string, enum: [word, line, character], description: The granularity that applied, which may be `line` on a large rewrite. }
        added: { type: integer, description: Tokens inserted at the chosen granularity. }
        removed: { type: integer }
        changeRatio: { type: number, description: Changed tokens over the larger side, 0 to 1. }
        coarse: { type: boolean, description: Present and true when the changed region is one delete and one insert. }
        truncated: { type: boolean, description: Present and true when `ops` and `text` were dropped for size. }
        text:
          type: string
          description: 'Line diffs use `+`/`-` prefixes; word and character diffs are inline: `[-old-]{+new+}`.'
        ops:
          type: array
          items:
            type: object
            properties:
              op: { type: string, enum: [equal, insert, delete] }
              text: { type: string }

    MonitorHistoryEntry:
      type: object
      properties:
        id: { type: integer }
        checkedAt: { type: string, format: date-time }
        changed: { type: boolean }
        reason:
          type: string
          enum: [first, changed, unchanged, filtered, trigger_not_met, error]
          description: |
            `first` stored the baseline. `filtered` differed only by noise the
            sensitivity setting ignores. `trigger_not_met` changed but the keyword
            or ratio trigger did not fire; the baseline still moved.
        diff:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MonitorDiff'
        error: { type: string, nullable: true }
        snapshotUrl: { type: string, nullable: true, description: Null when the snapshot was pruned. }

    WebhookDelivery:
      type: object
      properties:
        id: { type: integer }
        event: { type: string, enum: [changed, checked, failed] }
        url: { type: string, format: uri }
        status: { type: string, enum: [pending, delivered, dead] }
        attempts: { type: integer }
        lastError: { type: string, nullable: true }
        responseStatus: { type: integer, nullable: true }
        nextRetryAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, nullable: true }

    Document:
      type: object
      description: The read content of one resource. Identical in shape for web pages and documents.
      properties:
        markdown: { type: string }
        html: { type: string, description: 'Scripts, styles, comments, inline handlers and `javascript:` URLs removed.' }
        rawHtml: { type: string }
        text: { type: string }
        links:
          type: array
          items: { type: string, format: uri }
        screenshot:
          type: [string, 'null']
          description: 'A `data:image/png;base64,...` URI. `null` with a warning when no image was captured.'
        json:
          type: [object, 'null']
          description: 'Schema-conforming extraction, present when `json` was requested. `null` with a warning when the model step failed after the page was read.'
        jsonSources:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              index: { type: integer, description: 'Position of the passage in page order.' }
              score: { type: number, description: 'Relevance to the schema and prompt; 0 when the whole page fit the budget.' }
          description: 'Present when `includeSources` was set. The passages that reached the model, in page order.'
        chunks:
          type: [array, 'null']
          items:
            type: object
            properties:
              text: { type: string }
              anchor: { type: string, description: 'Stable across re-crawls, so citations keep resolving.' }
              tokens: { type: integer }
              headingPath:
                type: array
                items: { type: string }
              index: { type: integer }
        metadata: { $ref: '#/components/schemas/Metadata' }

    Metadata:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        language: { type: string }
        sourceUrl: { type: string, format: uri }
        finalUrl: { type: string, format: uri, description: After redirects. }
        statusCode: { type: integer }
        contentType: { type: string }
        fetchedAt: { type: string, format: date-time }
        contentHash: { type: string, description: SHA-256 of normalised content. Drives incremental crawl and change detection. }
        tier: { $ref: '#/components/schemas/Tier' }
        tiersAttempted:
          type: array
          items: { $ref: '#/components/schemas/Tier' }
        profile: { type: string }
        extractor: { type: string, description: 'The HTML-to-text engine that ran.' }
        mobile: { type: boolean }
        timingMs: { type: integer, description: 'Wall-clock for the fetch ladder, in milliseconds.' }
        fromCache: { type: boolean }
        document:
          type: object
          description: Present for PDFs and Office files.
          properties:
            pages: { type: integer }
            needsOcr: { type: boolean }
            ocrApplied: { type: boolean }
            suspectedGarbledText:
              type: boolean
              description: >-
                Text layer decoded suspiciously. Common with CJK PDFs; triggers
                an OCR fallback when `ocr` is `auto`.
            parser: { type: string }

    ScrapeResponse:
      type: object
      required: [success, warnings]
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Document' }
        failure: { $ref: '#/components/schemas/FetchFailure' }
        warnings:
          type: array
          items: { type: string }
          description: 'Always present. Each entry names the format it concerns, e.g. `json: No LLM credentials configured.`'
        usage: { $ref: '#/components/schemas/ExtractionUsage' }

    ExtractionUsage:
      type: object
      description: 'Present only when a model ran. Tokens are billed by your provider, not by Helix.'
      properties:
        model: { type: string }
        tokens:
          type: object
          properties:
            input: { type: integer }
            output: { type: integer }
        blocksKept:
          type: integer
          description: Content blocks that reached the model after relevance trimming.
        blocksTotal: { type: integer }
        providerCost:
          type: object
          properties:
            amount:
              type: [number, 'null']
              description: '`null`: Helix carries no price table, so the amount is unknown rather than zero.'
            currency: { type: string }

    FetchFailure:
      type: object
      description: |
        A typed failure. Bot challenges appear here even when the upstream returned
        200 — a challenge page is never returned as content.
      required: [reason]
      properties:
        url: { type: string, format: uri }
        reason:
          type: string
          enum: [blocked, challenge, timeout, dns, tls, http_error, empty, robots_denied, unsupported_type, service_unavailable]
        detail: { type: string }
        statusCode: { type: integer }
        detectedBy:
          type: array
          items: { type: string }
          description: 'Signals that fired, e.g. `cloudflare-interstitial`, `content-too-short`.'
        tier: { $ref: '#/components/schemas/Tier' }
        tiersAttempted:
          type: array
          items: { $ref: '#/components/schemas/Tier' }
        profile: { type: string }
        escalationAvailable:
          type: boolean
          description: Whether a higher tier, another profile or a different proxy could still be tried.

    Estimate:
      type: object
      description: Projected work. Resources rather than credits — Helix sells no inference.
      properties:
        pages: { type: integer }
        pagesFromCache: { type: integer }
        tierBreakdown:
          type: object
          additionalProperties: { type: integer }
        estimatedSeconds: { type: integer }
        estimatedTokens:
          type: object
          properties:
            input: { type: integer }
            output: { type: integer }
        estimatedProviderCost:
          type: object
          description: Your provider's charge at the configured model. Zero when no model is involved.
          properties:
            amount: { type: number }
            currency: { type: string }
            model: { type: string }
        assumptions:
          type: array
          items: { type: string }

    JobAccepted:
      type: object
      properties:
        success: { type: boolean }
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid, description: Same as `id`. }
        url: { type: string, format: uri, description: 'Where to poll: /v1/crawl/{jobId}.' }

    JobCancelled:
      type: object
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [cancelled] }

    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid, description: Same as `id`. }
        type: { type: string, enum: [crawl, batch_scrape, enrich] }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        total: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        error: { type: [string, 'null'] }
        next: { type: string, format: uri, description: Cursor for the next page of results. }
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Document'
              - type: object
                properties:
                  url: { type: string, format: uri, description: The URL as crawled. Also in `metadata.sourceUrl`. }
        usage: { $ref: '#/components/schemas/Usage' }

    Usage:
      type: object
      description: What the job actually consumed. Provider spend is what your provider bills you, not a Helix charge.
      properties:
        pagesFetched: { type: integer }
        pagesFromCache: { type: integer }
        pagesUnchanged: { type: integer }
        browserSeconds: { type: number }
        tokens:
          type: object
          properties:
            input: { type: integer }
            output: { type: integer }
        providerCost:
          type: object
          properties:
            amount: { type: number }
            currency: { type: string }

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded, unhealthy] }
        version: { type: string }
        services:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, degraded, unhealthy] }
              detail: { type: string }
        providers:
          type: object
          description: Which BYOK providers are configured. Never reveals key material.
          additionalProperties:
            type: object
            properties:
              configured: { type: boolean }
              model: { type: string }

    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        field: { type: string }
        requestId: { type: string }
