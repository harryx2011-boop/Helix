openapi: 3.1.0

info:
  title: Helix
  version: 2.0.0
  summary: A frontier utility hub. Self-hostable and BYOK.
  description: |
    Helix turns web pages and documents into clean, structured, LLM-ready data.

    It is self-hosted and bring-your-own-key throughout: Helix never bundles an LLM,
    a proxy pool or a vector store. You configure your own providers; your provider
    bills you directly. Helix takes no margin on inference.

    ## Credentials

    Two distinct concepts, never conflated:

    - **Helix API keys** (`Authorization: Bearer hx_...`) authenticate *you* to this
      Helix instance. Create as many as you like, one per project, each revocable.
    - **Provider credentials** (LLM, embedding, proxy, vector store) belong to the
      operator and are set through environment variables on the server. Helix calls
      *your* models with *your* keys.

    ## Failure semantics

    A page that returns a bot-challenge interstitial is a **failure**, not a success,
    even when the upstream status is 200. Such responses come back as a typed
    `FetchFailure` with a machine-readable `reason`. Helix never returns challenge
    HTML dressed up as content.

    Rate limiting **fails open**: if the limiter's backing store is unavailable the
    request proceeds and the server logs a warning. Infrastructure trouble here never
    becomes a 429 for you. Every response carries `X-RateLimit-*` headers so
    autonomous clients can self-throttle without parsing error strings.

    ## Estimating before you run

    Any operation whose cost scales with discovered pages accepts `estimate: true`
    and returns projected work — pages, time, tokens, provider spend — without
    doing it.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://localhost:7400/v1
    description: Local self-hosted default
  - url: '{scheme}://{host}/v1'
    description: Your deployment
    variables:
      scheme: { default: https, enum: [http, https] }
      host: { default: localhost:7400 }

security:
  - ApiKey: []

tags:
  - name: Scrape
    description: Single-resource read. Web pages and documents share one envelope.
  - name: Parse
    description: Documents by upload or URL, returned in the Scrape envelope.
  - name: Metadata
    description: What a file discloses about who and what made it, and a copy without it.
  - name: Crawl
    description: Multi-page discovery and read.
  - name: Search
    description: Web search, optionally scraping each result.
  - name: Agent
    description: Model-assisted helpers for building a request, such as schema design.
  - name: Enrich
    description: Fill columns about a subject from the open web, with a checkable citation for every value.
  - name: Interact
    description: Stateful browser sessions an agent can drive, with a live view.
  - name: Monitors
    description: Scheduled re-reads with change detection.
  - name: Diff
    description: One-shot comparison of two texts or pages, with nothing stored.
  - name: Jobs
    description: Status, results and cancellation for asynchronous work.
  - name: Providers
    description: Your own LLM provider keys, used instead of the instance's environment credentials.
  - name: Keys
    description: >-
      Minting, listing and revoking this instance API keys. Listing and
      revoking are self-host only.
  - name: Usage
    description: Request counts for your own API key.
  - name: System
    description: Health, profiles and capability discovery.

paths:
  /scrape:
    post:
      tags: [Scrape]
      summary: Read one URL
      description: |
        Fetches a single URL and returns it in the formats you ask for.

        Works identically for HTML pages, PDFs and Office documents — the response
        envelope is the same shape regardless of what was on the other end. PDFs are
        classified before parsing, so scanned documents route to OCR rather than
        silently returning garbled text.

        Synchronous. For many URLs, use `/crawl` with an explicit URL list or call `/scrape` concurrently.
      operationId: scrape
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScrapeRequest' }
            examples:
              minimal:
                summary: Just the markdown
                value: { url: 'https://example.com' }
              structured:
                summary: Extract to a schema with your own model
                value:
                  url: 'https://example.com/pricing'
                  formats: [markdown, json]
                  jsonOptions:
                    schema:
                      type: object
                      properties:
                        plans:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              monthlyPrice: { type: number }
                    prompt: Extract every pricing plan on the page.
                    provider: anthropic
                    model: claude-sonnet-4-5
              mobile:
                summary: The phone layout, through your own proxy
                value:
                  url: 'https://example.com'
                  formats: [markdown, screenshot]
                  mobile: true
                  proxy: { url: 'http://user:pass@proxy.example:3128', geo: DE }
              rendered:
                summary: Force a browser and act on the page
                value:
                  url: 'https://example.com/app'
                  tier: chromium
                  formats: [markdown, screenshot]
                  actions:
                    - { type: click, selector: '#accept-cookies' }
                    - { type: scroll, direction: down }
                    - { type: wait, milliseconds: 500 }
      responses:
        '200':
          description: |
            The fetch resolved. Check `success` — a typed failure (including a bot
            challenge) is reported here rather than as an HTTP error, so you can see
            which tier and profile were tried.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScrapeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /screenshot:
    post:
      tags: [Scrape]
      summary: One screenshot, nothing else
      description: |
        The same fetch ladder `/scrape` uses with `formats: [screenshot]` and
        nothing else in the response: no `markdown`, no `links`, no extraction
        step. `screenshot` already forces the Chromium tier inside the
        pipeline, so this buys a caller a smaller response and a smaller
        request body, not a faster fetch.

        Failures are reported the same way as `/scrape`: check `success`
        before reading `data`.
      operationId: screenshot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScreenshotRequest' }
            examples:
              basic:
                summary: Desktop screenshot
                value: { url: 'https://example.com' }
              mobile:
                summary: Phone viewport
                value: { url: 'https://example.com', mobile: true }
      responses:
        '200':
          description: |
            The fetch resolved. Check `success` — a typed failure is reported
            here rather than as an HTTP error, so you can see which tier and
            profile were tried.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScreenshotResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /extract:
    post:
      tags: [Scrape]
      summary: The same shape across a set of URLs
      description: |
        Applies one schema to many pages and returns rows. `/scrape` with
        `jsonOptions` already extracts a single page; this exists for the other
        shape of the question — the same fields across a URL set, as a table.

        Two rules distinguish it from a model call with a schema attached.
        **A field with no grounding span in its source is dropped**, and
        reported in `dropped`, rather than returned: a plausible number nobody
        can check is the expensive failure. Set `allowUngrounded` to keep those
        values; they are reported either way. **A URL that could not be read is
        a warning, not a failed request** — nineteen good rows and one
        unreachable page is a useful answer.

        Provide `schema`, or `prompt` to have one designed from a description.
        `POST /agent/schema` returns a schema you can keep and reuse.
      operationId: extract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtractRequest' }
            examples:
              prompt:
                summary: Describe the shape in words
                value:
                  urls: ['https://example.com/pricing']
                  prompt: every plan name and its monthly price
              schema:
                summary: Bring your own schema, across several pages
                value:
                  urls: ['https://example.com/pricing', 'https://example.com/enterprise']
                  schema:
                    type: object
                    properties:
                      plan: { type: string }
                      monthlyPrice: { type: number }
      responses:
        '200':
          description: |
            The request resolved. `data` holds one row per page that was read
            and extracted; anything skipped is named in `warnings`, and any
            field discarded for want of grounding is named in `dropped`.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExtractResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /parse:
    post:
      tags: [Parse]
      summary: Parse a document
      description: |
        Converts a PDF, DOCX, PPTX or XLSX into markdown (and, with `jsonOptions`,
        structured JSON) — the same envelope `/scrape` returns for web pages.

        Two ways to send the file. A JSON body with `url` makes Helix fetch the
        file first (binary-safe, honouring `timeout` and the upload ceiling). A
        `multipart/form-data` body with a `file` part uploads it directly; the
        other fields ride along as form fields (`formats` comma-separated,
        `jsonOptions` as a JSON string).

        PDFs are classified before parsing: `ocr: auto` runs OCR only when the
        text layer is missing or garbled, `force` always runs it, `off` never
        does and reports `needsOcr` in the metadata instead. Output is cached by
        content hash, so the same file sent twice parses once.

        Synchronous. The upload ceiling is set by the operator
        (`HELIX_PARSE_MAX_UPLOAD_MB`, default 25) and answered with `413`.
        The `url` path only fetches from public hosts over http or https:
        localhost, private, link-local and internal addresses are refused
        with `400`, on the first request and on every redirect. An instance
        holds at most `HELIX_PARSE_MAX_INFLIGHT` parses in memory (default 8)
        and answers `503` with `Retry-After` beyond that.
      operationId: parse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParseRequest' }
            examples:
              url:
                summary: Fetch and parse a remote file
                value:
                  url: 'https://example.com/files/report.pdf'
                  formats: [markdown]
                  ocr: auto
              structured:
                summary: Extract fields with your own model
                value:
                  url: 'https://example.com/files/invoice.pdf'
                  formats: [markdown, json]
                  jsonOptions:
                    schema:
                      type: object
                      properties:
                        invoiceTotal: { type: number }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ParseUpload' }
            encoding:
              file: { contentType: 'application/pdf, application/vnd.openxmlformats-officedocument.*, image/png, image/jpeg' }
      responses:
        '200':
          description: |
            The parse resolved. Check `success` — a remote fetch failure, an
            unsupported file type or an unreachable parser is reported here as a
            typed failure rather than as an HTTP error.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParseResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: The file (uploaded or fetched) exceeds this instance's upload ceiling.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: The request body is neither JSON nor `multipart/form-data`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: This instance is already holding `HELIX_PARSE_MAX_INFLIGHT` parses in memory. Retry after the `Retry-After` header.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /pdf-assess:
    post:
      tags: [Parse]
      summary: Whether a PDF needs OCR, without parsing it
      description: |
        Runs the same classifier `/parse` runs before choosing a parser --
        page count, extractable characters, and whether the text layer looks
        like real prose or decoded to mojibake — without converting anything
        to markdown. For deciding whether a full `/parse` (and its OCR cost)
        is worth paying for, before paying for it.

        PDF only. A DOCX, PPTX or XLSX — or anything else — comes back as a
        typed `unsupported_type` failure rather than an HTTP error, the same
        distinction `/parse` draws for its own unsupported types.

        Accepts a JSON body with `url`, or a `multipart/form-data` body with a
        `file` part, exactly like `/parse`.
      operationId: pdfAssess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PdfAssessRequest' }
            examples:
              byUrl:
                summary: A hosted PDF
                value: { url: 'https://example.com/report.pdf' }
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: |
            The file was read. Check `success` — an unreadable or non-PDF file
            is reported here rather than as an HTTP error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PdfAssessResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: The file exceeds this instance's upload limit (`HELIX_PARSE_MAX_UPLOAD_MB`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /metadata:
    post:
      tags: [Metadata]
      summary: Scan a file's metadata
      description: |
        Reports what a PDF, DOCX, PPTX, XLSX, PNG or JPEG discloses about the
        person and machine that produced it: EXIF and GPS from images, XMP,
        PDF DocInfo, and Office `docProps` (core, app and custom).

        Two ways to send the file, the same as `/parse`. A JSON body with `url`
        makes Helix fetch it first; a `multipart/form-data` body with a `file`
        part uploads it directly.

        **Findings are ranked, not merely listed.** Each carries a `risk` band
        (`high`/`medium`/`low`) and a `category`, and the response is sorted
        worst-first. The band comes from the key the value was read from, and is
        raised — never lowered — when the value itself looks like an email
        address or a home-directory path. GPS coordinates are additionally
        resolved to a decimal `Coordinates` pair, because a raw DMS triple is
        the least readable form of the most consequential finding.

        `riskSummary` always carries all three bands, so a caller rendering a
        summary never has to tell an absent band from a zero one. A container
        that opened but whose part could not be read returns the findings it did
        get plus a `warnings` entry: a partial report must never be read as a
        clean one.

        Synchronous, and nothing is stored. The upload ceiling and in-flight cap
        are the operator's (`HELIX_PARSE_MAX_UPLOAD_MB`,
        `HELIX_PARSE_MAX_INFLIGHT`), answered with `413` and `503`. The `url`
        path only fetches public hosts over http or https, checked on the first
        request and on every redirect.
      operationId: metadataScan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetadataRequest' }
            examples:
              url:
                summary: Scan a remote file
                value:
                  url: 'https://example.com/files/report.pdf'
          multipart/form-data:
            schema: { $ref: '#/components/schemas/MetadataUpload' }
            encoding:
              file: { contentType: 'application/pdf, application/vnd.openxmlformats-officedocument.*, image/png, image/jpeg' }
      responses:
        '200':
          description: |
            The scan resolved. Check `success` — a remote fetch failure, an
            unsupported file type or an unreachable reader is reported here as a
            typed failure rather than as an HTTP error.
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetadataResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: The file (uploaded or fetched) exceeds this instance's upload ceiling.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: The request body is neither JSON nor `multipart/form-data`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: This instance is already holding `HELIX_PARSE_MAX_INFLIGHT` files in memory. Retry after the `Retry-After` header.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /metadata/scrub:
    post:
      tags: [Metadata]
      summary: Strip a file's metadata
      description: |
        Returns the same file with its metadata removed. **The response body is
        the cleaned file**, not a JSON envelope — a base64 wrapper would hold two
        more copies of a 25 MB upload — so the response can be streamed straight
        to disk. `Content-Disposition` names it `<original>.scrubbed.<ext>`.

        The report rides in the `X-Helix-Metadata-Report` header as compact JSON
        (a `MetadataScrubReport`), with `X-Helix-Metadata-Removed` and
        `X-Helix-Metadata-Retained` as bare counts for a caller that only needs
        to branch.

        **Read `retained` before treating a file as clean.** Formats differ in
        what can be dropped without corrupting the result: a Word comments part
        is still pointed at by a relationship, and pypdfium2 re-emits DocInfo it
        cannot write. Those are reported as retained with `removable: false`,
        and the PDF path proves the outcome by re-scanning its own output rather
        than assuming the rewrite worked. Acting on "clean" while something
        remains is the failure this endpoint exists to prevent.

        Removal is structural, not cosmetic: a metadata segment is dropped whole
        rather than emptied, since a zero-length EXIF segment still tells a
        reader the file once carried one. Office containers are rebuilt with
        flattened entry timestamps, because a zip entry's own mtime would leak
        what the scrub just removed. Image data and rendering-relevant chunks
        (colour profiles, gamma) are never touched.

        On a typed failure — an unsupported type, a corrupt file, an unreachable
        reader — the response is `application/json` in the usual envelope
        instead of file bytes. Branch on `Content-Type`.
      operationId: metadataScrub
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MetadataRequest' }
            examples:
              url:
                summary: Scrub a remote file
                value:
                  url: 'https://example.com/files/photo.jpg'
          multipart/form-data:
            schema: { $ref: '#/components/schemas/MetadataUpload' }
            encoding:
              file: { contentType: 'application/pdf, application/vnd.openxmlformats-officedocument.*, image/png, image/jpeg' }
      responses:
        '200':
          description: |
            The cleaned file. On a typed failure the body is `application/json`
            carrying a `MetadataResponse` with `success: false` instead.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="<original>.scrubbed.<ext>"'
            X-Helix-Metadata-Report:
              schema: { $ref: '#/components/schemas/MetadataScrubReport' }
              description: The report, as compact JSON on a single header line.
            X-Helix-Metadata-Removed:
              schema: { type: integer }
              description: How many findings were removed.
            X-Helix-Metadata-Retained:
              schema: { type: integer }
              description: How many were detected and could NOT be removed. Non-zero means the file is not fully clean.
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: '#/components/schemas/MetadataResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: The file (uploaded or fetched) exceeds this instance's upload ceiling.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: The request body is neither JSON nor `multipart/form-data`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: This instance is already holding `HELIX_PARSE_MAX_INFLIGHT` files in memory. Retry after the `Retry-After` header.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /document:
    post:
      tags: [Parse, Metadata]
      summary: One surface over every document operation
      description: |
        Parse, inspect and scrub a document through one endpoint. `op`
        picks the operation; every other field is whatever that operation takes.

        | `op` | Does what `/v1/…` does |
        |---|---|
        | `parse` | `/parse` — markdown, or JSON against a schema |
        | `metadata` | `/metadata` — what the file discloses |
        | `scrub` | `/metadata/scrub` — a cleaned copy, as file bytes |
        | `assess` | `/pdf-assess` — text-layer quality before OCR |

        It **dispatches** rather than reimplements: each operation keeps its own
        multipart parsing, upload ceiling, in-flight cap and result cache, so a
        request behaves identically whether it arrives here or at the original
        path. Those paths remain valid and unchanged — this is an addition,
        not a migration.

        A multipart upload cannot name `op` in the body without the body being
        parsed twice, so it names it in the query string instead: `?op=parse`.

        `scrub` answers with file bytes and a report header rather than JSON,
        exactly as `/metadata/scrub` does.
      operationId: document
      parameters:
        - name: op
          in: query
          required: false
          description: The operation, for multipart uploads that cannot carry it in the body.
          schema: { $ref: '#/components/schemas/DocumentOp' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentRequest' }
            examples:
              parse:
                summary: A PDF as markdown
                value: { op: parse, url: 'https://example.com/files/invoice.pdf', formats: [markdown], ocr: auto }
              assess:
                summary: Is OCR needed before paying for it?
                value: { op: assess, url: 'https://example.com/files/scan.pdf' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/DocumentRequest' }
      responses:
        '200':
          description: |
            Whatever the dispatched operation answers with, forwarded unchanged —
            including its status, its headers and, for `scrub`, its file bytes.
          content:
            application/json:
              schema:
                description: The target operation's own response.
                type: object
                additionalProperties: true
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: The file (uploaded or fetched) exceeds this instance's upload ceiling.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /map:
    post:
      tags: [Crawl]
      summary: List a site's URLs
      description: |
        Discovers URLs without reading them. Sitemap-first, falling back to link
        discovery from the seed page.

        Cheap and fast, and the basis of cost estimation for `/crawl` — map first to
        learn how many pages exist, then decide.
      operationId: map
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MapRequest' }
      responses:
        '200':
          description: Discovered URLs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MapResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /robots-check:
    post:
      tags: [Crawl]
      summary: Whether a URL is allowed to be crawled, without fetching it
      description: |
        Reads and caches `robots.txt` the same way `/crawl` and `/map` do,
        through the same `RobotsCache` — the answer here is what a crawl
        would actually decide, not a second opinion from a separate parser.

        `userAgent` defaults to this instance's own (`HELIX_USER_AGENT`);
        override it to check what a different crawler would be allowed.
        `crawlDelaySeconds` is `null` when the site's `robots.txt` sets none.
      operationId: robotsCheck
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RobotsCheckRequest' }
            examples:
              basic:
                summary: Check with this instance's own user agent
                value: { url: 'https://example.com/private/' }
      responses:
        '200':
          description: The verdict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RobotsCheckResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /crawl:
    post:
      tags: [Crawl, Jobs]
      summary: Crawl a site
      description: |
        Discovers and reads pages from a seed URL.

        Respects `robots.txt` by default, including `Crawl-delay`. Politeness is
        adaptive: concurrency ramps while a host stays healthy and backs off on 429s
        or latency spikes.

        Pass `estimate: true` to get projected pages, time and cost without crawling,
        or call `POST /crawl/estimate` for the same answer without a job body you
        do not intend to submit.

        `url` is required **unless** `resume` names a cancelled job, which keeps
        the seed it started with; the two cannot be combined. Resuming re-queues
        the pages that job had not finished, under its original id.

        A `formats` list including `json` requires `scrapeOptions.jsonOptions`
        with a `schema` or a `prompt`. Without one the request is rejected, rather
        than the field being dropped silently on every page of the crawl.

        `includePaths` and `excludePaths` take globs (`/blog/*`); a pattern using
        regular-expression syntax (`^/blog`) is treated as one. Exclusion wins
        when both match. `limit` defaults to `HELIX_CRAWL_DEFAULT_LIMIT` and,
        together with `maxDepth`, is capped by the operator. A request above the
        cap is rejected rather than silently clamped.

        With `webhook` set, `started`, `page`, `completed` and `failed` events are
        POSTed to it (see `WebhookPayload`). Cancellation emits nothing.
      operationId: crawl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrawlRequest' }
            examples:
              basic:
                summary: Crawl a docs site
                value: { url: 'https://docs.example.com', limit: 200 }
              estimate:
                summary: What would this cost?
                value: { url: 'https://docs.example.com', estimate: true }
              filtered:
                summary: One section, with a webhook
                value:
                  url: 'https://example.com'
                  limit: 100
                  maxDepth: 3
                  includePaths: ['/blog/*']
                  excludePaths: ['/blog/tag/*']
                  scrapeOptions: { formats: [markdown] }
                  webhook: 'https://myapp.example/webhooks/helix'
              toVectors:
                summary: Crawl straight into a vector store
                value:
                  url: 'https://docs.example.com'
                  chunk: { strategy: semantic, maxTokens: 512 }
                  destination: { type: qdrant, collection: docs }
      responses:
        '200':
          description: Estimate only — returned when `estimate` is true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estimate' }
        '202':
          description: |
            The job is queued. A new crawl answers with a fresh id; a resumed one
            answers with its original id and the number of pages re-queued.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/JobAccepted'
                  - $ref: '#/components/schemas/CrawlResumed'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            No such crawl job to resume. A job belonging to another API key reads
            as absent rather than forbidden, so an id cannot be confirmed by
            asking for it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            The job cannot be resumed: `expired` (its queue was released at
            `expiresAt`), `already_running` (it is queued or running and needs
            nothing), or `nothing_to_resume` (no unfinished pages remain).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /crawl/estimate:
    post:
      tags: [Crawl]
      summary: Price a crawl without running it
      description: |
        The same answer `estimate: true` gives on `/crawl`, on its own route, so
        a caller can price a crawl without constructing a job body it does not
        intend to submit.

        Takes the same request as `/crawl` and creates nothing. `resume` is
        rejected here: that work is already queued and its cost already spent.

        The projection assumes the cheap tier unless one is named — a page
        needing a browser costs more, and the assumptions are listed in the
        response rather than buried.
      operationId: estimateCrawl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrawlRequest' }
            examples:
              basic:
                summary: What would this cost?
                value: { url: 'https://example.com', limit: 500 }
      responses:
        '200':
          description: Projected pages, time, tokens and provider spend, with the assumptions behind them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Estimate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /crawl/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: cursor
        in: query
        schema: { type: string }
        description: Continue a paginated result set.
    get:
      tags: [Crawl, Jobs]
      summary: Poll a crawl
      description: |
        The same view as `GET /jobs/{id}`, restricted to crawl jobs. Results are
        paginated by `next`; `status` is `queued` until a worker claims the job,
        then `running`, then one of `completed`, `failed` or `cancelled`.

        Ownership is scoped as on `GET /jobs/{id}`.
      operationId: getCrawl
      responses:
        '200':
          description: Job state, with results so far.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Crawl, Jobs]
      summary: Cancel a crawl
      description: |
        Stops the crawl. Already-completed results stay retrievable. Cancellation
        does not emit a failure webhook per queued URL.

        Ownership is scoped as on `GET /jobs/{id}`.
      operationId: cancelCrawl
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobCancelled' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The job had already finished.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /batch/scrape:
    post:
      tags: [Scrape, Jobs]
      summary: Scrape many URLs as one job
      description: |
        Reads a supplied list of URLs and returns one job to poll, instead of
        making the caller fan out `/scrape` and reassemble the results.

        This is `/scrape` run on the crawl machinery, so per-host politeness and
        `robots.txt` apply exactly as they do there. Nothing is discovered: links
        a page yields are not followed, and no sitemap is read. The list may span
        hosts.

        Asynchronous. Poll `GET /batch/scrape/{id}`, or set `webhook` to have
        `started`, `page`, `completed` and `failed` events POSTed to you.

        A batch does not fail because one URL did: each item carries its own
        outcome and the job reports `completed` and `failed` counts.
      operationId: batchScrape
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchScrapeRequest' }
            examples:
              basic:
                summary: Read three pages
                value:
                  urls:
                    - 'https://example.com/a'
                    - 'https://example.com/b'
                    - 'https://other.example/c'
              formats:
                summary: With scrape options and a webhook
                value:
                  urls: ['https://example.com/a', 'https://example.com/b']
                  scrapeOptions: { formats: [markdown, links], onlyMainContent: true }
                  webhook: 'https://caller.example/hooks/batch'
              lenient:
                summary: Skip unparseable URLs instead of rejecting the batch
                value:
                  urls: ['https://example.com/a', 'not a url']
                  ignoreInvalidURLs: true
      responses:
        '202':
          description: Job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /batch/scrape/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: cursor
        in: query
        schema: { type: string }
        description: Continue a paginated result set.
    get:
      tags: [Scrape, Jobs]
      summary: Poll a batch
      description: |
        The same view as `GET /jobs/{id}`, restricted to batch jobs. Each item in
        `data` carries the `/scrape` document shape plus the `url` it came from.

        Ownership is scoped as on `GET /jobs/{id}`.
      operationId: getBatchScrape
      responses:
        '200':
          description: Job state, with results so far.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Scrape, Jobs]
      summary: Cancel a batch
      description: |
        Stops the batch. Already-completed results stay retrievable.

        Ownership is scoped as on `GET /jobs/{id}`.
      operationId: cancelBatchScrape
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobCancelled' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The job had already finished.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /search:
    post:
      tags: [Search]
      summary: Search the web, optionally reading the results
      description: |
        Runs a web search against the instance's configured backend (SearXNG,
        Serper or SerpAPI) and, when `scrapeOptions` is set, reads each result in
        the same call — so one request goes from question to page content.

        A result page that cannot be read does not fail the search: its row keeps
        `url`, `title` and `description`, carries a typed `failure`, and a line is
        added to `warnings`. One call is bounded by `HELIX_SEARCH_MAX_DURATION_MS`
        (default 120000): pages not read before the budget is spent carry a
        `timeout` failure, and all reads stop when the client disconnects.

        A source the backend cannot answer is reported, not hidden: when every
        requested source fails the call is a 502 `search_failed`; when some
        answer, their results are returned with a `warnings` line per failed
        source and the list is not cached.
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchRequest' }
            example:
              query: transactional email APIs
              limit: 5
              lang: en
              country: us
              tbs: qdr:m
              scrapeOptions:
                formats: [markdown]
                onlyMainContent: true
      responses:
        '200':
          description: Search results, with page content when `scrapeOptions` was set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
              example:
                success: true
                data:
                  web:
                    - url: https://example.com/best-email-apis
                      title: 13 Best Transactional Email APIs
                      description: A comparison of...
                      position: 1
                      markdown: "# 13 Best...\n..."
                      metadata: { statusCode: 200, tier: plain }
                warnings: []
                metadata: { backend: searxng, fromCache: false }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502':
          description: The search backend failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: No search backend is configured on this instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /agent/schema:
    post:
      tags: [Agent]
      summary: Design a JSON Schema from a plain-language description
      description: |
        Turns a description of the data you want into a JSON Schema you can drop
        straight into `jsonOptions.schema` on `/scrape`, `/parse` or
        `scrapeOptions.schema` on `/search`. Uses the operator's configured
        model, the same as `/parse`'s `jsonOptions` step.

        Pass `hint` (the previous schema) and `instruction` to refine an
        existing schema rather than design one from scratch. `urls` are example
        pages this schema will run against, used only to inform field choices —
        they are not fetched.

        A malformed request (an empty prompt, more than 10 URLs, a non-http(s)
        URL) is a 400. A model that could not be reached, or is not configured
        on this instance, is reported as a typed failure with `success: false`
        rather than an HTTP error — the same distinction `/scrape` draws
        between your mistake and the operator's missing credentials.
      operationId: agentSchema
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentSchemaRequest' }
            examples:
              fromScratch:
                summary: Describe the data you want
                value:
                  prompt: Every pricing plan on the page, with its name, monthly price and included features.
              refine:
                summary: Refine a previous schema
                value:
                  prompt: Every pricing plan on the page
                  hint:
                    type: object
                    properties:
                      plans:
                        type: array
                        items:
                          type: object
                          properties:
                            name: { type: string }
                  instruction: Also capture whether each plan is marked "Most popular".
      responses:
        '200':
          description: |
            The request was well-formed. Check `success` — a model that is not
            configured, unreachable, or that could not produce a usable schema
            is reported here as a typed failure rather than an HTTP error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSchemaResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /enrich:
    post:
      tags: [Enrich]
      summary: Fill columns about a subject from the open web, or say why it could not
      description: |
        Takes a sparse identifier — a company name, a domain, an email — and the
        fields you want, and returns each field with the passage that grounds it.

        Sources come from `urls` when you supply them, otherwise from a search.
        Every candidate passes guardrails before it can become evidence: parked
        domains, placeholder and default server pages, blocklisted social hosts
        and anything below the content floor are rejected, and each rejection is
        listed in `sources.rejected` with its reason.

        Fields are answered in phases, cheapest first. A value stated in a page's
        `<meta>` tags or JSON-LD is read directly and never costs a model call;
        only the fields structure could not answer are sent to a model.

        **Every returned value is verified against text this API fetched.** The
        model must quote the passage stating each value; that passage is then
        checked against the page it was attributed to, and the value is checked
        against the passage. Anything that fails becomes `null` with a `reason`
        rather than a low-confidence guess. A field is never invented.

        `confidence` is an ordinal band, not a probability, and is not
        calibrated — see the `EnrichedField` schema for exactly what each band
        means and does not mean.
      operationId: enrich
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnrichRequest' }
            examples:
              fromSearch:
                summary: Let Helix find the sources
                value:
                  subject: Acme Robotics
                  fields:
                    - { name: headquarters, description: City of the head office }
                    - { name: foundedYear, type: number }
              fromUrls:
                summary: Enrich from pages you already have
                value:
                  subject: Acme Robotics
                  urls: ['https://acme.example/about']
                  fields:
                    - { name: headquarters }
      responses:
        '200':
          description: |
            The request was well-formed. Individual fields may still be `null`
            with a `reason` — that is the normal, intended outcome when no
            source states a value or the model could not ground it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrichResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: No `urls` were given and no search backend is configured to discover them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /interact:
    post:
      tags: [Interact]
      summary: Run actions in a browser session
      description: |
        Runs a list of actions against a live page. With no `sessionId` a new
        session is opened and `url` is loaded first; with a `sessionId` the
        actions continue on that session's page, cookies and storage intact.

        Every action names its target with a selector; nothing is inferred.
        The one model call is `extract`, which sends the page's stripped
        content to the operator's configured provider and returns the answer
        as `output`.

        The page only reaches public `http` and `https` addresses. A URL that
        points at the instance itself, a private network, or a link-local
        address fails with reason `unsafe_url`; the same check applies to
        redirects, subresources and anything a script fetches.

        Sessions are bounded by the operator: a cap on open sessions
        (`HELIX_INTERACT_MAX_SESSIONS`), an idle timeout
        (`HELIX_INTERACT_IDLE_TIMEOUT_SECONDS`) and a hard timeout
        (`HELIX_INTERACT_HARD_TIMEOUT_SECONDS`). Set `keepSessionOpen` to
        keep the page for a follow-up call; otherwise it closes when the
        response is sent.
      operationId: interact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InteractRequest' }
            examples:
              oneShot:
                summary: Accept cookies, search, read the price
                value:
                  url: 'https://example.com/shop'
                  actions:
                    - { type: click, selector: '#accept-cookies' }
                    - { type: type, selector: '#search', text: 'wireless keyboard' }
                    - { type: press, key: Enter }
                    - { type: wait, selector: '.results' }
                    - { type: screenshot }
                    - { type: extract, prompt: 'Get the price of the first result' }
              resume:
                summary: Continue on an open session
                value:
                  sessionId: sess_9f2c1a7b3e4d5c60
                  actions:
                    - { type: click, selector: '.next-page' }
                    - { type: extract, prompt: 'List the product names on this page' }
                  keepSessionOpen: true
      responses:
        '200':
          description: |
            The run finished. Check `success`: a failed action (a selector that
            never appeared, a bot challenge on navigation, the model service
            being down) is reported here with the index of the action that
            failed, not as an HTTP error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InteractResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: No open session with that id for this key. It may have been closed or timed out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The session is running another request (`session_busy`). Wait for it to return.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            Either the key's rate limit (`rate_limited`) or the operator's cap on
            open sessions (`session_limit_reached`). Close a session or wait.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: A browser could not be started for the session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /interact/session:
    post:
      tags: [Interact]
      summary: Open a reusable session
      description: |
        Opens a session without running actions, optionally loading `url`.
        Returns the id to pass as `sessionId` to `/interact`, the live-view
        link, and when the session will close if nothing else happens.
      operationId: openInteractSession
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InteractSessionRequest' }
      responses:
        '201':
          description: Session open.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InteractSession' }
        '200':
          description: The first navigation failed; the session was closed again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InteractResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: The operator's cap on open sessions (`session_limit_reached`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: A browser could not be started for the session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /interact/session/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, example: sess_9f2c1a7b3e4d5c60 }
    get:
      tags: [Interact]
      summary: Session status
      operationId: getInteractSession
      responses:
        '200':
          description: The session, its current URL and deadlines.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/InteractSession'
                  - type: object
                    properties:
                      busy: { type: boolean, description: Whether a request is running on it right now. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Interact]
      summary: Close a session
      description: Closes the page and frees its slot. A second call for the same id is a 404.
      operationId: closeInteractSession
      responses:
        '204': { description: Closed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /interact/live/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - name: token
        in: query
        required: true
        schema: { type: string }
        description: The per-session token embedded in `liveViewUrl`. Stands in for the API key, since a browser tab cannot send one.
    get:
      tags: [Interact]
      summary: Live view
      description: |
        A read-only page showing the session as it runs, fed by Chrome's
        screencast over `GET /interact/live/{id}/stream` (server-sent
        events; `frame` events carry base64 JPEG, `closed` announces the end).
        Nothing is loaded from outside the instance. A viewer that falls
        behind receives the newest frame once it catches up rather than every
        frame in between. At most 4 viewers may stream one session at a time
        (`too_many_viewers`, 429).

        The same stream is available over a WebSocket at
        `/interact/live/{id}/ws`, carrying JSON messages
        `{type: session|frame|ping|closed, data}` with the same token, the same
        viewer cap (close code 4429) and the same drop-oldest policy; a rejected
        token closes with 4401. The stream is one-way — anything a viewer sends
        is ignored, since the link carries no authority to act on the session.
      operationId: interactLiveView
      security: []
      responses:
        '200':
          description: The viewer.
          content:
            text/html: {}
        '401':
          description: No open session matches the link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /interact/live/{id}/stream:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - name: token
        in: query
        required: true
        schema: { type: string }
        description: The session's view token. Authenticates this link on its own — no API key is sent.
    get:
      tags: [Interact]
      summary: Screencast frames for a live session (SSE)
      description: |
        The transport behind the viewer page at `/interact/live/{id}`. Streams CDP
        screencast frames as server-sent events for as long as the session lives.
        Token-authenticated, like the page itself. A parallel WebSocket carrying the
        same frames is available at `/interact/live/{id}/ws`; OpenAPI cannot describe
        a WebSocket operation, so it is documented in prose only.
      operationId: streamInteractLive
      security: []
      responses:
        '200':
          description: An event stream of screencast frames.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { description: No open session matches this link. }
        '429': { description: Too many concurrent viewers on this session. }

  /monitor:
    get:
      tags: [Monitors]
      summary: List monitors
      description: |
        Monitors created with the calling API key, newest first.

        Capped at 500. `truncated` is true when the cap was reached and more
        exist; delete or pause monitors you no longer need rather than paging,
        which this endpoint does not offer.
      operationId: listMonitors
      responses:
        '200':
          description: Your monitors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  monitors:
                    type: array
                    items: { $ref: '#/components/schemas/Monitor' }
                  truncated:
                    type: boolean
                    description: More than 500 monitors exist; the list is cut at the cap.
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Monitors]
      summary: Create a monitor
      description: |
        Watches one URL on a schedule and tells you what changed.

        Each check re-reads the page through the same fetch ladder as `/scrape`
        and compares the markdown with the last snapshot. An unchanged page
        stores no new snapshot and sends nothing. A changed page stores a
        snapshot, records a diff at word, line or character granularity, and
        queues a webhook with the diff inline.

        `sensitivity: significant` strips relative timestamps, clock times,
        dates and tracking parameters before comparing, so rotating noise does
        not count as a change. Keyword triggers narrow it further without a
        model call.

        `jsonOptions` swaps the reported diff for a field-level one: on a
        change, the markdown before and after is run through structured
        extraction and the two results are diffed field by field, so the
        webhook says which fields changed instead of a text diff.

        The schedule is a cron expression or an interval (`15m`, `6h`, `1d`),
        with an optional `window` restricting it to business hours. The
        operator sets the minimum gap between checks
        (`HELIX_MONITOR_MIN_INTERVAL`, hourly by default); a schedule under it
        is rejected with `field: schedule`.
      operationId: createMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonitorRequest' }
            examples:
              pricing:
                summary: Watch a pricing page every hour
                value:
                  url: 'https://example.com/pricing'
                  schedule: '0 * * * *'
                  sensitivity: significant
                  webhook: 'https://your.app/webhooks/helix'
              restock:
                summary: Only tell me when a phrase disappears
                value:
                  url: 'https://example.com/product/123'
                  schedule: { every: '6h', timezone: 'Europe/London' }
                  trigger: { keywordDisappears: 'Out of stock' }
                  webhook: { url: 'https://your.app/webhooks/helix', secret: 'a-shared-secret' }
      responses:
        '201':
          description: Monitor created. The first check runs at `nextCheckAt`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
              example:
                success: true
                id: 'f2a1c6e0-4b7d-4c1e-9a3b-2d5e8f7a1b23'
                monitorId: 'f2a1c6e0-4b7d-4c1e-9a3b-2d5e8f7a1b23'
                url: 'https://example.com/pricing'
                schedule: { cron: '0 * * * *', timezone: 'UTC' }
                sensitivity: significant
                diff: { granularity: word, inline: true }
                trigger: {}
                webhook: { url: 'https://your.app/webhooks/helix', events: [changed], metadata: null, headers: [], signed: false }
                status: active
                createdAt: '2026-08-24T12:30:00.000Z'
                updatedAt: '2026-08-24T12:30:00.000Z'
                lastCheckedAt: null
                nextCheckAt: '2026-08-24T13:00:00.000Z'
                lastChangeAt: null
                lastError: null
                stats: { checks: 0, changes: 0, pagesUnchanged: 0 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /monitor/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Monitors]
      summary: Get a monitor
      description: Status, stats and the latest snapshot (markdown) once a check has run.
      operationId: getMonitor
      responses:
        '200':
          description: The monitor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Monitors]
      summary: Update a monitor
      description: |
        Change the schedule, read options, diff, trigger, sensitivity or webhook,
        or pause and resume with `status`. A new schedule is validated against the
        instance minimum and resets `nextCheckAt`. Send `webhook: null` to remove it.
      operationId: updateMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonitorPatch' }
      responses:
        '200':
          description: The updated monitor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Monitors]
      summary: Delete a monitor
      description: Stops the schedule and removes the monitor, its snapshots, history and pending deliveries.
      operationId: deleteMonitor
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }

  /monitor/{id}/history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: cursor, in: query, required: false, schema: { type: integer }, description: Return entries older than this id. Taken from `next`. }
      - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 50 } }
    get:
      tags: [Monitors]
      summary: Change timeline
      description: Every check, newest first, including the quiet ones. Paginated by cursor.
      operationId: monitorHistory
      responses:
        '200':
          description: The timeline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  monitorId: { type: string, format: uuid }
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/MonitorHistoryEntry' }
                  next:
                    type: [string, 'null']
                    description: Path of the next page, or null on the last page.
        '404': { $ref: '#/components/responses/NotFound' }

  /monitor/{id}/snapshots/{snapshotId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: snapshotId, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Monitors]
      summary: Read a snapshot
      description: The markdown captured by one check. `snapshotUrl` in history entries and webhook payloads points here.
      operationId: monitorSnapshot
      responses:
        '200':
          description: The snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitorSnapshot' }
        '404': { $ref: '#/components/responses/NotFound' }

  /monitor/{id}/check:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Monitors]
      summary: Check now
      description: |
        Runs one check immediately, outside the schedule, and returns the
        resulting history entry. The regular schedule is unaffected. The check
        takes the same lock and the same instance-wide slot as a scheduled one:
        a monitor already mid-check answers 409 `check_in_progress`, a paused
        monitor 409 `monitor_paused`, and an instance with every slot busy 503
        `busy` with `Retry-After`.
      operationId: checkMonitor
      responses:
        '200':
          description: The check that ran.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  monitorId: { type: string, format: uuid }
                  check: { $ref: '#/components/schemas/MonitorHistoryEntry' }
                  webhookQueued: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Paused (`monitor_paused`) or already running (`check_in_progress`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Every check slot is in use (`busy`). Retry after the `Retry-After` seconds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /monitor/{id}/deliveries:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Monitors]
      summary: Webhook deliveries
      description: The last 100 deliveries for this monitor with their attempt count, last error and next retry. Dead-lettered ones can be replayed.
      operationId: monitorDeliveries
      responses:
        '200':
          description: Deliveries, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  monitorId: { type: string, format: uuid }
                  deliveries:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookDelivery' }
        '404': { $ref: '#/components/responses/NotFound' }

  /monitor/{id}/deliveries/{deliveryId}/replay:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: deliveryId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Monitors]
      summary: Replay a dead-lettered delivery
      description: Puts a dead delivery back on the queue with a fresh attempt count. Pending and delivered rows are refused with 409.
      operationId: replayMonitorDelivery
      responses:
        '200':
          description: Queued again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  delivery: { $ref: '#/components/schemas/WebhookDelivery' }
        '409':
          description: Not dead-lettered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /diff:
    post:
      tags: [Diff]
      summary: Compare two texts or two pages, once
      description: |
        The same Myers diff `/monitor` runs on every check, without a monitor:
        nothing is scheduled, nothing is stored, and there is no baseline to
        keep. Each side of the comparison is either literal `text` you already
        have, or a `url` Helix reads fresh through the normal fetch ladder —
        the two can be mixed, so a live page can be compared against text you
        captured yourself.

        `mode: text` (the default) diffs at `granularity` (word, line or
        character) and returns the same shape a monitor's webhook carries.
        `mode: json` diffs two JSON values field by field instead of as text,
        for comparing two structured-extraction results; `before`/`after` are
        then JSON values directly, not `{ text }` or `{ url }`.

        A `url` side that fails to read comes back as a 400 naming which side
        and why, rather than a diff against half a comparison.
      operationId: diff
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiffRequest' }
            examples:
              twoTexts:
                summary: Two texts you already have
                value:
                  before: { text: 'Standard $29/month billed annually' }
                  after: { text: 'Standard $34/month billed annually' }
              twoUrls:
                summary: Two live pages
                value:
                  before: { url: 'https://web.archive.org/web/2026/https://example.com/pricing' }
                  after: { url: 'https://example.com/pricing' }
                  granularity: line
              json:
                summary: Two structured-extraction results
                value:
                  mode: json
                  before: { plan: 'Standard', price: 29 }
                  after: { plan: 'Standard', price: 34 }
      responses:
        '200':
          description: The diff. `success` is always true here; a side that could not be read is a 400, not a partial diff.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  diff:
                    oneOf:
                      - $ref: '#/components/schemas/MonitorDiff'
                      - $ref: '#/components/schemas/MonitorJsonDiff'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /jobs/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: cursor
        in: query
        schema: { type: string }
        description: Continue a paginated result set.
    get:
      tags: [Jobs]
      summary: Get job status and results
      description: |
        An instance has a single operator, so every API key on it can read
        every job. An unknown id answers 404.
      operationId: getJob
      responses:
        '200':
          description: Job state, with results so far.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Jobs]
      summary: Cancel a job
      description: |
        Stops the job. Already-completed results stay retrievable. Cancellation does
        not emit a failure webhook per queued URL.

        An instance has a single operator, so every API key on it can cancel
        every job. An unknown id answers 404.
      operationId: cancelJob
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{id}/errors:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Jobs]
      summary: Per-URL failures for a job
      description: |
        Every failure with its typed reason, the tier and profile tried, and
        whether escalation remains. Readable by every API key on the instance,
        as `GET /jobs/{id}` is.
      operationId: getJobErrors
      responses:
        '200':
          description: Failures.
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items: { $ref: '#/components/schemas/FetchFailure' }
                  robotsBlocked:
                    type: array
                    items: { type: string, format: uri }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{id}/schema:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Jobs]
      summary: The output shape a job was started with
      description: |
        Projects `formats` and, when the job asked for structured extraction,
        the `jsonOptions.schema` it will fill — read back from the request
        that created the job, not stored separately. Answers before the job
        finishes, so a caller building a consumer for the results does not
        have to wait on the first page to learn the shape.

        An instance has a single operator, so every API key on it can read
        every job. An unknown id answers 404.
      operationId: getJobSchema
      responses:
        '200':
          description: The expected shape.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  jobId: { type: string, format: uuid, description: Same as `id`. }
                  formats:
                    type: array
                    items: { $ref: '#/components/schemas/Format' }
                  schema:
                    type: [object, 'null']
                    description: The JSON Schema results will conform to, when the job requested structured extraction.
                  prompt:
                    type: [string, 'null']
                    description: The extraction prompt, when one was given.
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{id}/ladder:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - name: cursor
        in: query
        schema: { type: string }
        description: Continue a paginated result set.
    get:
      tags: [Jobs]
      summary: Which tier served each page, and why it climbed
      description: |
        One row per page the job recorded: the tier that served it, every tier
        tried on the way, each climb with the evidence behind it, the browser
        identity used and the time taken. Paginated by `next`, the same as
        `GET /jobs/{id}`. Failed pages are on `GET /jobs/{id}/errors`.

        `escalations` is `[]` when the first tier served the page, and `null`
        for a page recorded before climbs were kept: an empty list there would
        claim the first tier served it.

        Every API key on the instance can read every job. An unknown id answers 404.
      operationId: getJobLadder
      responses:
        '200':
          description: The pages, in the order they were recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string, format: uuid }
                  next: { type: [string, 'null'], description: Path of the next page, or null on the last. }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string }
                        tier: { type: [string, 'null'] }
                        tiersAttempted: { type: array, items: { type: string } }
                        escalations:
                          type: [array, 'null']
                          items:
                            type: object
                            properties:
                              from: { type: string }
                              to: { type: string }
                              reason: { type: string }
                        profile: { type: [string, 'null'] }
                        timingMs: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /jobs/{id}/cost:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Jobs]
      summary: What a job consumed, beside its projection
      description: |
        Measured figures from the finished job next to the projection the
        worker made when it claimed the crawl, before fetching a page (the same
        calculation as `POST /crawl/estimate`). The projection is never
        recomputed: that would describe today's site, not the one crawled.

        A figure that was not measured is `null`, and `reasons` says why.
        Tokens and provider spend are always `null` here; your provider reports
        them. A batch, a resumed crawl, and a job made before projections were
        kept have `estimate: null`.

        Every API key on the instance can read every job. An unknown id answers 404.
      operationId: getJobCost
      responses:
        '200':
          description: Actual spend, the saved projection, and why any figure is missing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobId: { type: string, format: uuid }
                  type: { type: string, enum: [crawl, batch_scrape, enrich] }
                  status: { type: string, enum: [queued, running, completed, failed, cancelled] }
                  actual:
                    type: object
                    properties:
                      pagesFetched: { type: [integer, 'null'] }
                      pagesUnchanged: { type: [integer, 'null'] }
                      tierBreakdown:
                        type: [object, 'null']
                        additionalProperties: { type: integer }
                        description: Recorded pages by the tier that served them.
                      browserSeconds:
                        type: [number, 'null']
                        description: Wall time of pages a render tier (chromium, camoufox) served, cheaper tiers tried first included.
                      tokens: { type: 'null' }
                      providerCost: { type: 'null' }
                  estimate:
                    type: [object, 'null']
                    description: The saved projection, in the shape `POST /crawl/estimate` returns.
                  reasons:
                    type: array
                    items: { type: string }
                    description: One line per figure that is `null`, saying why.
        '404': { $ref: '#/components/responses/NotFound' }

  /usage:
    get:
      tags: [Usage]
      summary: Request usage for your key
      description: |
        Request counts for the calling API key over a window, bucketed hourly.

        Scoped to the key in the `Authorization` header and no other: there is no
        parameter for reading another key's traffic. To total several keys, call
        this once per key.

        These are stored counts, not live headroom. `window` says what period they
        cover; for remaining quota right now read `X-RateLimit-Remaining` on any
        response. Counts are buffered in memory and flushed periodically, so the
        most recent few seconds may be missing, and they are a reporting figure
        rather than a billing ledger.
      operationId: getUsage
      parameters:
        - name: hours
          in: query
          description: Window length in hours, ending now. Defaults to 168 (seven days).
          schema:
            type: integer
            minimum: 1
            maximum: 2160
            default: 168
      responses:
        '200':
          description: Usage over the window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageSummary' }
          headers:
            X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
            X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
            X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /providers:
    get:
      tags: [Providers]
      summary: List your provider keys
      description: |
        Status for every supported provider — the four cloud providers
        (`anthropic`, `openai`, `gemini`, `openrouter`) and three local runtimes
        (`ollama`, `vllm`, `openai-compatible`) — under the calling API key.
        `configured` is true whenever a call can use that provider at all;
        `source` says whether that comes from a key you stored (`key`) or the
        instance's own environment credentials (`instance`), or neither
        (`none`).

        A local runtime is identified by `baseUrl` instead of a key — most need
        no credential at all.

        The plaintext of a stored key is never returned — only `last4`.
      operationId: listProviders
      responses:
        '200':
          description: Provider status for the calling key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  providers:
                    type: array
                    items: { $ref: '#/components/schemas/ProviderStatus' }
              example:
                success: true
                providers:
                  - provider: anthropic
                    configured: true
                    source: key
                    last4: '9f2c'
                    model: claude-sonnet-4-5
                    updatedAt: '2026-08-24T12:30:00.000Z'
                  - provider: openai
                    configured: true
                    source: instance
                  - provider: gemini
                    configured: false
                    source: none
                  - provider: openrouter
                    configured: false
                    source: none
                  - provider: ollama
                    configured: true
                    source: key
                    model: gemma3:4b
                    baseUrl: 'http://localhost:11434/v1'
                    updatedAt: '2026-08-24T12:30:00.000Z'
                  - provider: vllm
                    configured: false
                    source: none
                  - provider: openai-compatible
                    configured: false
                    source: none
        '401': { $ref: '#/components/responses/Unauthorized' }

  /providers/{provider}:
    parameters:
      - { name: provider, in: path, required: true, schema: { $ref: '#/components/schemas/ProviderName' } }
    put:
      tags: [Providers]
      summary: Store your key or base URL for a provider
      description: |
        Upserts your own credential for this provider. Every LLM-backed request
        made with this Helix API key — `/scrape` and `/parse`'s `jsonOptions`,
        and `/agent/schema` — then uses it instead of this instance's
        environment credentials.

        `ollama`, `vllm` and `openai-compatible` are local runtimes: they take
        `baseUrl` instead of `apiKey` (most need no credential at all). Every
        other provider requires `apiKey`.

        The plaintext is accepted once and never returned again; only its last
        4 characters (`last4`) come back, here and from `GET /providers`.
      operationId: putProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                apiKey:
                  type: string
                  minLength: 8
                  maxLength: 512
                  description: Trimmed before storage. Required for every provider except a local runtime.
                model:
                  type: string
                  maxLength: 200
                  description: Used for calls made with this provider when the request names no model.
                baseUrl:
                  type: string
                  format: uri
                  description: Required for `ollama`, `vllm` and `openai-compatible` — where the runtime is reached.
            examples:
              cloud:
                summary: A cloud provider
                value: { apiKey: 'sk-ant-...', model: claude-sonnet-4-5 }
              local:
                summary: A local runtime
                value: { baseUrl: 'http://localhost:11434/v1', model: gemma3:4b }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  provider: { $ref: '#/components/schemas/ProviderName' }
                  last4: { type: [string, 'null'] }
                  model: { type: [string, 'null'] }
                  baseUrl: { type: [string, 'null'] }
                  verified:
                    type: boolean
                    description: >-
                      The provider was asked and accepted this credential. False
                      means it could not be checked — this instance's egress, a
                      provider 5xx, or a local runtime that is not running yet —
                      not that the credential is wrong. A credential the provider
                      actively rejects is never stored (400 `invalid_credential`).
                  warning:
                    type: string
                    description: >-
                      Present only when `verified` is false: why the check could
                      not be completed.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Providers]
      summary: Remove your key for a provider
      description: 'Idempotent — deleting a provider you never stored still answers `success: true`.'
      operationId: deleteProvider
      responses:
        '200':
          description: Removed (or already absent).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /providers/{provider}/models:
    get:
      tags: [Providers]
      summary: List the models a local runtime actually has installed
      description: |
        For `ollama`, `vllm` and `openai-compatible` only — the models a caller
        can pick from instead of typing a model name blind. Reads the base URL
        already saved for this provider (`PUT /providers/{provider}` first);
        a cloud provider or an unsaved local runtime is rejected with 400.

        A local runtime that cannot be reached, or answers with something
        unexpected, is reported as a typed `failure` in a `200` response, never
        a `5xx` — a caller's home network reaching a stopped Ollama is an
        everyday case, not a server error.
      operationId: listProviderModels
      parameters:
        - { name: provider, in: path, required: true, schema: { $ref: '#/components/schemas/ProviderName' } }
      responses:
        '200':
          description: Either the installed models, or a typed reason the runtime could not be listed.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [success, provider, models]
                    properties:
                      success: { type: boolean, enum: [true] }
                      provider: { $ref: '#/components/schemas/ProviderName' }
                      models:
                        type: array
                        items: { $ref: '#/components/schemas/ProviderModel' }
                  - type: object
                    required: [success, provider, failure]
                    properties:
                      success: { type: boolean, enum: [false] }
                      provider: { $ref: '#/components/schemas/ProviderName' }
                      failure:
                        type: object
                        required: [reason, message]
                        properties:
                          reason: { type: string, enum: [invalid_base_url, unreachable, unsupported, bad_response] }
                          message: { type: string }
              examples:
                installed:
                  summary: Ollama, reachable
                  value:
                    success: true
                    provider: ollama
                    models:
                      - name: 'gemma4:latest'
                        parameterSize: 8.0B
                        quantization: Q4_K_M
                        sizeBytes: 9608350718
                        capabilities: [completion, tools, thinking]
                      - name: 'gemma3:4b'
                        parameterSize: 4.3B
                        quantization: Q4_K_M
                        sizeBytes: 3338801804
                        capabilities: [completion]
                unreachable:
                  summary: The runtime is not running
                  value:
                    success: false
                    provider: ollama
                    failure: { reason: unreachable, message: 'Could not reach ollama at http://localhost:11434/v1.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /status/history:
    get:
      tags: [System]
      summary: Daily uptime and latency, per service
      description: |
        Unauthenticated, like `/health` — this is the data behind a public status
        page. Each service gets one bucket per day: the share of successful probes
        and the median latency over that day's samples.
      operationId: getStatusHistory
      security: []
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90, default: 90 }
          description: How many days back to report. Clamped to 90.
      responses:
        '200':
          description: One entry per service.
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        service: { type: string }
                        days:
                          type: array
                          items:
                            type: object
                            properties:
                              day: { type: string, format: date }
                              okPct: { type: [number, 'null'], description: Share of probes that succeeded, 0-100. Null when no samples were recorded. }
                              p50Ms: { type: [integer, 'null'], description: Median probe latency in milliseconds. Null when no samples were recorded. }
                              samples: { type: integer }

  /keys:
    post:
      tags: [Keys]
      summary: Mint an API key
      description: |
        The plaintext key is returned exactly once and cannot be recovered later —
        only its hash is stored. On the hosted multi-tenant deployment the key store
        has no owner column to filter by, so listing and revoking are withheld
        there; minting is not.
      operationId: createKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                rateLimit: { type: integer, minimum: 1, maximum: 1000000, default: 1000, description: Requests per minute. }
      responses:
        '201':
          description: Created. The plaintext key appears here and nowhere else, ever.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  key: { type: string, description: 'The plaintext key. Store it now; it cannot be retrieved again.' }
                  keyPrefix: { type: string }
                  rateLimit: { type: integer }
                  createdAt: { type: string, format: date-time }
                  warning: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Keys]
      summary: List this instance's API keys (self-host only)
      description: |
        Instance-wide with no owner predicate, so it is **withheld on the hosted
        multi-tenant deployment** — there, one tenant could otherwise read another
        tenant's credentials. Never returns plaintext keys, only their prefixes.
      operationId: listKeys
      responses:
        '200':
          description: Every key on this instance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        keyPrefix: { type: string }
                        rateLimit: { type: integer }
                        createdAt: { type: string, format: date-time }
                        lastUsedAt: { type: [string, 'null'], format: date-time }
                        revokedAt: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not available on this deployment (hosted multi-tenant). }

  /keys/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Keys]
      summary: Revoke an API key (self-host only)
      description: |
        Withheld on the hosted multi-tenant deployment for the same reason as the
        list route. Revoking an already-revoked or unknown key answers 404.
      operationId: revokeKey
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /usage/all:
    get:
      tags: [Usage]
      summary: Usage across every key on this instance (self-host only)
      description: |
        Sums usage over all keys, so it crosses the tenant boundary and is
        **withheld on the hosted multi-tenant deployment**. There, the dashboard
        aggregates per profile by calling `/usage` with each of that profile's keys.
      operationId: getUsageAll
      parameters:
        - name: hours
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 2160, default: 168 }
          description: Window in hours. Bounded so a caller cannot scan the whole table.
      responses:
        '200':
          description: Instance-wide usage for the window.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Not available on this deployment (hosted multi-tenant). }

  /health:
    get:
      tags: [System]
      summary: Health check
      operationId: health
      security: []
      responses:
        '200':
          description: Service health, including each dependency.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: One or more dependencies are unhealthy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /profiles/{id}/health:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: 'A browser fingerprint profile id, e.g. `chrome-149-macos`.' }
    get:
      tags: [System]
      summary: Success/block rate for a fingerprint profile
      description: |
        Real usage, not a static description: every successful read and every
        typed failure recorded against this profile id, across every request
        on this instance regardless of which API key made it. There is no
        per-tenant view of this — a profile's coherence against a given site
        is a property of the identity, not of who asked for it.

        404 when the profile has never been used, which is not the same as
        the profile id being unknown; nothing here checks `packages/profiles`
        for whether the id exists.
      operationId: getProfileHealth
      responses:
        '200':
          description: Attempts, successes and failures recorded against this profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { type: string }
                  attempts: { type: integer }
                  successes: { type: integer }
                  failures: { type: integer }
                  successRate: { type: number, description: 'successes / attempts. 0 to 1.' }
                  lastUsedAt: { type: string, format: date-time, nullable: true }
        '404': { $ref: '#/components/responses/NotFound' }

components:

  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      bearerFormat: hx_...
      description: |
        A Helix API key. Create as many as you need, one per project; each can be
        revoked independently and carries its own rate limit and usage counter.

        This authenticates you to Helix. It is unrelated to your LLM, proxy and
        vector-store credentials, which live in server environment variables and are
        never sent over this API.

  headers:
    RateLimitLimit:
      description: Requests permitted in the current window.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests left in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Unix seconds at which the window resets.
      schema: { type: integer }

  responses:
    JobAccepted:
      description: Job accepted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JobAccepted' }
    BadRequest:
      description: The request was malformed or self-contradictory.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            unsupportedKeyword:
              summary: A schema keyword that induces hallucination
              value:
                error: invalid_schema
                message: >-
                  `minItems` is not supported in extraction schemas. Length
                  constraints make models invent entries to satisfy them. Describe
                  the expectation in the field description instead.
                field: jsonOptions.schema.properties.plans.minItems
            proxyUnavailable:
              summary: stealth asked for a proxy the instance does not have
              value:
                error: proxy_unavailable
                message: >-
                  `proxy: "stealth"` needs a proxy configured on this instance. Set
                  HELIX_PROXY_URL, or pass your own as `proxy: { url }`.
                field: proxy
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        Rate limit exceeded. Returned only for genuine limit breaches — never
        because Helix's own limiter backend was unavailable.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: integer }
        X-RateLimit-Limit: { $ref: '#/components/headers/RateLimitLimit' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/RateLimitRemaining' }
        X-RateLimit-Reset: { $ref: '#/components/headers/RateLimitReset' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:

    UsageSummary:
      type: object
      description: |
        Request counts for one API key over a window. Every count is requests
        received, including those the limiter rejected.
      properties:
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        total: { type: integer, description: Requests in the window, including rate-limited ones. }
        rateLimited: { type: integer, description: Requests the limiter answered with 429. }
        errors: { type: integer, description: Responses with a 4xx or 5xx status. }
        series:
          type: array
          description: One entry per hour that saw traffic, ascending. Quiet hours are absent rather than zero.
          items:
            type: object
            properties:
              bucketStart: { type: string, format: date-time }
              requests: { type: integer }
        byEndpoint:
          type: array
          description: |
            Grouped by route family rather than exact path, so `/jobs/{id}` is one
            row and not one per job. Busiest first, capped at 50 families.
          items:
            type: object
            properties:
              endpoint: { type: string, example: '/scrape' }
              requests: { type: integer }
        key:
          type: object
          description: The key these counts belong to. Never includes the secret.
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            keyPrefix: { type: string }
            rateLimit: { type: integer }
            lastUsedAt: { type: string, format: date-time, nullable: true }
        window:
          type: object
          description: The period the counts cover. Not live rate-limit headroom.
          properties:
            hours: { type: integer }
            unit: { type: string, enum: [hour] }

    Format:
      type: string
      description: |
        An output representation.

        `markdown` is clean prose. `html` is the page with scripts, styles,
        comments and inline handlers stripped; `rawHtml` is untouched. `json`
        requires `jsonOptions.schema` and returns schema-conforming data.
        `screenshot` forces the Chromium tier. `chunks` returns split text with
        stable anchors for citation.
      enum: [markdown, html, rawHtml, text, links, screenshot, json, chunks]

    Tier:
      type: string
      description: |
        Fetch tier. Omit to let Helix escalate on evidence — cheapest first, moving
        up only when a block is detected, content is absent from the raw HTML, or a
        requested capability demands it.

        Framework detection alone never triggers escalation: server-rendered React
        and Vue frequently need no browser at all.

        `camoufox` is a hardened Firefox above `chromium`, for sites the render
        tier still loses. It is never reached by escalation: automatic climbing
        stops at `chromium`, so the tier applies only when you name it here. It
        must also be enabled on the instance, and a request for it otherwise
        fails rather than quietly falling back.
      enum: [auto, plain, tls, lightpanda, chromium, camoufox]
      default: auto

    Engine:
      type: string
      description: |
        Which browser drives the render tier. Defaults to the instance's
        configured engine (Chromium unless the operator changed it), and is
        ignored by the `plain`, `tls` and `lightpanda` tiers, which run no
        browser.

        A `profile` is applied only on the engine family it describes: asking for
        a Chrome identity on `firefox` presents no identity at all and returns a
        warning, because a Chrome user-agent over Gecko contradicts itself and is
        easier to detect than an unmodified browser.
      enum: [chromium, firefox, webkit]

    ScrapeOptions:
      type: object
      description: Shared read options. Reused by scrape and crawl; search takes the `SearchScrapeOptions` subset.
      properties:
        formats:
          type: array
          items: { $ref: '#/components/schemas/Format' }
          default: [markdown]
        tier: { $ref: '#/components/schemas/Tier' }
        engine: { $ref: '#/components/schemas/Engine' }
        onlyMainContent:
          type: boolean
          default: true
          description: Strip navigation, headers, footers and other furniture.
        includeSelectors:
          type: array
          items: { type: string }
        excludeSelectors:
          type: array
          items: { type: string }
        extractor:
          type: string
          enum: [trafilatura, readability, auto]
          default: trafilatura
          description: |
            HTML-to-text engine. trafilatura is the more precise; readability
            recovers more at the cost of including extra. `auto` picks per page shape.
        waitFor:
          type: integer
          description: Milliseconds to wait after load. Browser tiers only.
          minimum: 0
          maximum: 30000
        timeout:
          type: integer
          default: 30000
          minimum: 1000
          maximum: 300000
          description: |
            Milliseconds for the whole fetch. On the browser tiers this is one
            budget shared by navigation, `waitFor`, `actions` and the screenshot,
            not a per-step allowance.
        mobile:
          type: boolean
          default: false
          description: |
            Render in a phone viewport (390x844, touch enabled). Forces the Chromium
            tier when `tier` is `auto`. With `plain`, `tls` or `lightpanda` no
            viewport exists, so the page is fetched as-is, a warning says so, and
            `metadata.mobile` is `false`. The `firefox` engine narrows the viewport
            but does not emulate touch, so it is treated the same way.
        actions:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Action' }
          description: Steps to run before reading. Forces the Chromium tier.
        headers:
          type: object
          additionalProperties: { type: string }
        profile:
          type: string
          description: Browser identity to present. Omit for an automatic choice.
        proxy:
          description: |
            `auto` uses the instance's `HELIX_PROXY_URL` when one is set and goes
            direct otherwise. `stealth` requires it and is a 400 `proxy_unavailable`
            when none is set. `none` goes direct regardless. An object is your own
            proxy for this one request. Helix ships no pool.

            A proxied request never uses the `lightpanda` tier: `auto` skips it, and
            asking for it explicitly is a failure rather than a fetch from the
            instance's own address.
          oneOf:
            - type: string
              enum: [auto, stealth, none]
            - $ref: '#/components/schemas/ProxyConfig'
        extract:
          allOf:
            - $ref: '#/components/schemas/ExtractConfig'
          description: 'Same option as `jsonOptions`. Send one of the two, not both.'
        jsonOptions:
          allOf:
            - $ref: '#/components/schemas/ExtractConfig'
          description: 'Structured extraction for the `json` format. `schema` is required when `json` is requested.'
        chunk: { $ref: '#/components/schemas/ChunkConfig' }

    ScrapeRequest:
      allOf:
        - type: object
          required: [url]
          properties:
            url: { type: string, format: uri }
        - $ref: '#/components/schemas/ScrapeOptions'

    Action:
      type: object
      required: [type]
      discriminator: { propertyName: type }
      properties:
        type:
          type: string
          enum: [wait, click, write, press, scroll, screenshot, executeJavascript, scrape]
        selector: { type: string }
        milliseconds: { type: integer }
        text: { type: string }
        key: { type: string }
        direction: { type: string, enum: [up, down] }
        script: { type: string }
        fullPage: { type: boolean }

    ExtractConfig:
      type: object
      description: |
        Structured extraction using your configured model.

        Page content is relevance-scored and trimmed before it reaches the model
        rather than dumped wholesale — cheaper and more accurate.

        Constrained decoding guarantees the *shape* of the output and guarantees
        nothing about its truth. Length keywords such as `minItems` and `maxItems`
        are rejected because they push models to invent entries; say what you expect
        in the field description instead.
      properties:
        schema:
          type: object
          description: 'A JSON Schema. Required for the `json` format. Over ~30 fields, split into several calls.'
        prompt:
          type: string
          maxLength: 4000
          description: 'Guidance for the model. Accompanies a schema; it cannot replace one.'
        provider:
          type: string
          enum: [anthropic, openai, openrouter, google, gemini, ollama, vllm, openai-compatible]
          description: |
            Override the instance default provider. Its key must already be
            configured (`ANTHROPIC_API_KEY`, `OPENAI_API_KEY`, `OPENROUTER_API_KEY`,
            `GEMINI_API_KEY` or `GOOGLE_API_KEY`, `OPENAI_COMPATIBLE_BASE_URL`);
            Helix never accepts credentials over the API.
        model:
          type: string
          maxLength: 200
          description: |
            Override the instance default model. When `provider` differs from the
            instance default and `model` is omitted, a standard model for that
            provider is used; `ollama`, `vllm` and `openai-compatible` have none,
            so `model` is required there (400 with `field: jsonOptions.model`).
        includeSources:
          type: boolean
          default: false
          description: |
            Return the passages that reached the model as `jsonSources`: each with
            its `text`, its `index` in page order, and the relevance `score` that
            selected it.

    ChunkConfig:
      type: object
      description: Split content for retrieval. Chunks carry stable anchors that survive re-crawls, so citations keep resolving.
      properties:
        strategy:
          type: string
          enum: [semantic, heading, fixed]
          default: semantic
        maxTokens: { type: integer, default: 512, minimum: 64, maximum: 4096 }
        overlap: { type: integer, default: 64, minimum: 0, maximum: 1024 }

    DocumentConfig:
      type: object
      description: |
        Document handling. PDFs are classified before parsing, so a scanned document
        routes to OCR instead of returning garbled characters.
      properties:
        ocr:
          type: string
          enum: [auto, never, always]
          default: auto
        maxPages: { type: integer, minimum: 1 }
        tables:
          type: string
          enum: [auto, high-fidelity]
          default: auto
          description: '`high-fidelity` routes to a table-specialised parser. Slower, markedly better on complex tables.'

    ProxyConfig:
      type: object
      description: Your own proxy. Helix ships no pool and never proxies through its own credentials.
      properties:
        url:
          type: string
          description: 'scheme://user:pass@host:port'
        sessionId:
          type: string
          description: Reuse the same exit IP across requests sharing this value.
        geo: { type: string, minLength: 2, maxLength: 2 }

    Destination:
      type: object
      description: Write results straight to your own store, skipping a round trip.
      required: [type]
      properties:
        type: { type: string, enum: [qdrant, pgvector] }
        collection: { type: string }
        namespace: { type: string }
        upsertMode:
          type: string
          enum: [update-in-place, append]
          default: update-in-place
          description: |
            `update-in-place` derives deterministic point IDs from the URL, so
            re-crawling a site updates existing vectors instead of duplicating them.

    WebhookConfig:
      type: object
      required: [url]
      description: |
        When `HELIX_WEBHOOK_SECRET` is set, deliveries are signed with HMAC-SHA256
        over `{timestamp}.{body}` and sent as `Helix-Signature: t=<unix>,v1=<hex>`.
        Compare in constant time and reject timestamps outside a five-minute
        window. Every delivery also carries `Helix-Event` and `Helix-Delivery-Id`.

        Delivery retries with exponential backoff (one minute, doubling, capped at
        six hours) for `HELIX_WEBHOOK_MAX_ATTEMPTS` attempts, about three days at
        the default of 20. Only a 5xx, a 408/429 or a network failure is retried;
        a 4xx, a redirect or an unsendable request dead-letters on the first
        attempt. Ordering is not guaranteed; make your handler idempotent.
        Exhausted deliveries are kept as dead letters in `webhook_deliveries`
        for `HELIX_RESULT_TTL_HOURS`.

        The URL must be `http` or `https` on a public hostname or address:
        loopback, private and link-local targets, bare service names and
        `localhost` are rejected, and the name is resolved again before each
        send. Redirects are not followed.
      properties:
        url: { type: string, format: uri }
        headers:
          type: object
          additionalProperties: { type: string }
          description: |
            Sent with every delivery, at most 16. `Content-Type`, `Host`,
            `User-Agent` and the `Helix-*` headers are set by Helix and cannot
            be overridden.
        events:
          type: array
          description: Subscribe to a subset. Omitted means every event. `changed` is emitted by monitors only.
          items: { type: string, enum: [started, page, changed, completed, failed] }
        metadata:
          type: object
          description: Echoed back in every delivery. At most 4096 bytes serialised.

    WebhookPayload:
      type: object
      description: The JSON body of every webhook delivery.
      properties:
        id: { type: string, description: 'Delivery id, also sent as Helix-Delivery-Id.' }
        event: { type: string, enum: [started, page, changed, completed, failed] }
        jobId: { type: [string, 'null'], format: uuid }
        monitorId: { type: [string, 'null'], format: uuid }
        timestamp: { type: string, format: date-time }
        data:
          type: object
          description: |
            Per event. `started`: `{ url, limit, maxDepth }`. `page`: `{ url, markdown,
            metadata }`. `completed`: `{ total, completed, failed, unchanged }`.
            `failed`: `{ error }`.
        metadata:
          type: [object, 'null']
          description: The `metadata` given in the webhook config.

    ParseJsonOptions:
      type: object
      description: |
        Structured extraction over the parsed content, using the operator's
        configured model. Needs a `schema` or a `prompt`. Length keywords
        (`minItems`, `maxItems`) are rejected for the same reason as in
        `ExtractConfig`. A `provider` override is not accepted: the instance's
        `HELIX_LLM_PROVIDER` applies to every call.
      additionalProperties: false
      properties:
        schema: { type: object }
        prompt: { type: string }
        model:
          type: string
          description: Override the server's default model. Must be configured on the server.

    ParseOptions:
      type: object
      properties:
        formats:
          type: array
          items: { type: string, enum: [markdown, json] }
          default: [markdown]
        ocr:
          type: string
          enum: [auto, force, off]
          default: auto
          description: '`auto` runs OCR only when the text layer is missing or garbled; `force` always; `off` never (the metadata still reports `needsOcr`).'
        maxPages: { type: integer, minimum: 1 }
        tables:
          type: string
          enum: [auto, high-fidelity]
          default: auto
          description: '`high-fidelity` routes PDFs to a table-specialised parser when one is installed.'
        timeout:
          type: integer
          minimum: 1000
          maximum: 300000
          default: 30000
          description: Remote fetch budget in milliseconds. Applies to the `url` path only.
        jsonOptions: { $ref: '#/components/schemas/ParseJsonOptions' }

    ParseRequest:
      allOf:
        - $ref: '#/components/schemas/ParseOptions'
        - type: object
          required: [url]
          properties:
            url:
              type: string
              format: uri
              description: The file to fetch. An HTML page here is a typed `unsupported_type` failure — use `/scrape` for pages.

    ParseUpload:
      allOf:
        - type: object
          required: [file]
          properties:
            file: { type: string, format: binary }
            formats:
              type: string
              description: Comma-separated, e.g. `markdown,json`. Repeated `formats` fields also work.
            jsonOptions:
              type: string
              description: A `ParseJsonOptions` object encoded as a JSON string.
        - type: object
          properties:
            ocr: { type: string, enum: [auto, force, off] }
            maxPages: { type: integer }
            tables: { type: string, enum: [auto, high-fidelity] }

    ParseMetadata:
      type: object
      required: [filename, pageCount, fileType, ocrUsed, needsOcr, suspectedGarbledText, parser, sizeBytes, contentHash, fetchedAt, timingMs, fromCache]
      properties:
        filename: { type: [string, 'null'] }
        pageCount:
          type: integer
          description: Pages for PDF, slides for PPTX; `0` for DOCX and XLSX, which have no fixed pagination.
        fileType:
          type: string
          enum: [pdf, docx, pptx, xlsx, png, jpg]
        ocrUsed: { type: boolean }
        needsOcr:
          type: boolean
          description: The classifier judged the text layer missing or unusable, whether or not OCR then ran.
        suspectedGarbledText: { type: boolean }
        parser:
          type: string
          description: Which parser produced the markdown, e.g. `pypdfium2`, `marker`, `python-docx`.
        sizeBytes: { type: integer }
        contentHash: { type: string, description: SHA-256 of the file bytes; the cache key. }
        sourceUrl: { type: string, format: uri, description: Present on the `url` path only. }
        fetchedAt: { type: string, format: date-time }
        timingMs: { type: integer }
        fromCache: { type: boolean }

    ParseDocument:
      type: object
      required: [metadata]
      properties:
        markdown: { type: string }
        json:
          type: object
          description: Present when `formats` includes `json` and the model step succeeded.
        usage:
          type: object
          properties:
            tokens:
              type: object
              properties:
                input: { type: integer }
                output: { type: integer }
            model: { type: string }
        metadata: { $ref: '#/components/schemas/ParseMetadata' }

    ParseResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/ParseDocument' }
        failure: { $ref: '#/components/schemas/FetchFailure' }
        warnings:
          type: array
          items: { type: string }
          description: 'Non-fatal notes: a missing text layer with OCR off, or a failed model step when the parse itself succeeded.'

    PdfAssessRequest:
      type: object
      description: Send exactly one of `url` (JSON body) or a `file` part (`multipart/form-data`); this shape documents the JSON form.
      properties:
        url:
          type: string
          format: uri
          description: The PDF to fetch. An HTML page or any other type here is a typed `unsupported_type` failure.
        timeout:
          type: integer
          default: 30000
          minimum: 1000
          maximum: 300000
          description: Milliseconds for the remote fetch, when `url` is used.

    PdfAssessResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            pageCount: { type: integer }
            charsExtracted: { type: integer, description: Characters read from a sample of pages, for judging the text layer. }
            needsOcr: { type: boolean }
            suspectedGarbledText: { type: boolean, description: 'The text layer decoded, but to characters that look like broken font encoding rather than prose.' }
            reason: { type: string, description: Human-readable justification for the verdict. }
            metadata:
              type: object
              properties:
                filename: { type: [string, 'null'] }
                sizeBytes: { type: integer }
                sourceUrl: { type: string, format: uri, description: Present on the `url` path only. }
        failure: { $ref: '#/components/schemas/FetchFailure' }

    MetadataRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: The file to fetch. An HTML page here is a typed `unsupported_type` failure.
        timeout:
          type: integer
          default: 30000
          minimum: 1000
          maximum: 300000
          description: Remote fetch budget in milliseconds, for the `url` path.

    MetadataUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        timeout: { type: integer, description: Remote fetch budget in milliseconds; ignored on the upload path. }

    MetadataFinding:
      type: object
      required: [group, key, value, risk, category, removable]
      properties:
        group:
          type: string
          description: Where it was read from, e.g. `exif`, `gps`, `xmp`, `docinfo`, `core`, `app`, `custom`, `png`, `tracked`.
        key: { type: string, description: 'The tag or property name, e.g. GPSLatitude, lastModifiedBy.' }
        value:
          type: string
          description: The disclosed value. A long value is truncated and says so, so a cut value is never read as a complete one.
        risk:
          type: string
          enum: [high, medium, low]
          description: |
            How much it gives away. An ordinal band, not a probability. Set from
            the key, then raised — never lowered — when the value itself looks
            like an email address or a home-directory path.
        category:
          type: string
          enum: [location, identity, device, software, timestamp, content, other]
        removable:
          type: boolean
          description: False where the format cannot drop the entry without corrupting the file.

    MetadataRiskSummary:
      type: object
      required: [high, medium, low]
      description: Counts per band. Always carries all three, so absent and zero never have to be told apart.
      properties:
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }

    MetadataScanMetadata:
      type: object
      required: [fileType, sizeBytes, contentHash, scannedAt, timingMs]
      properties:
        filename: { type: [string, 'null'] }
        fileType:
          type: string
          enum: [pdf, docx, pptx, xlsx, png, jpg]
        sizeBytes: { type: integer }
        contentHash: { type: string, description: SHA-256 of the file bytes. }
        sourceUrl: { type: string, format: uri, description: Present on the `url` path only. }
        scannedAt: { type: string, format: date-time }
        timingMs: { type: integer }

    MetadataScan:
      type: object
      required: [findings, riskSummary, metadata]
      properties:
        findings:
          type: array
          description: Sorted worst-first, so the highest-consequence disclosure reads at the top.
          items: { $ref: '#/components/schemas/MetadataFinding' }
        riskSummary: { $ref: '#/components/schemas/MetadataRiskSummary' }
        metadata: { $ref: '#/components/schemas/MetadataScanMetadata' }

    MetadataResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/MetadataScan' }
        failure: { $ref: '#/components/schemas/FetchFailure' }
        warnings:
          type: array
          items: { type: string }
          description: A container opened but a part of it could not be read. The report is partial; do not read it as clean.

    MetadataScrubReport:
      type: object
      required: [removed, retained, riskSummary, metadata]
      description: The payload of the `X-Helix-Metadata-Report` header, as compact JSON.
      properties:
        removed:
          type: array
          description: Sorted worst-first.
          items: { $ref: '#/components/schemas/MetadataFinding' }
        retained:
          type: array
          description: |
            Detected and NOT removed, each with `removable: false`. Non-empty
            means the file is not fully clean; check this before treating it as
            safe to publish.
          items: { $ref: '#/components/schemas/MetadataFinding' }
        riskSummary: { $ref: '#/components/schemas/MetadataRiskSummary' }
        metadata:
          type: object
          required: [fileType, bytesBefore, bytesAfter, scrubbedAt, timingMs]
          properties:
            filename: { type: [string, 'null'] }
            fileType:
              type: string
              enum: [pdf, docx, pptx, xlsx, png, jpg]
            bytesBefore: { type: integer }
            bytesAfter: { type: integer }
            sourceUrl: { type: string, format: uri }
            scrubbedAt: { type: string, format: date-time }
            timingMs: { type: integer }
        warnings:
          type: array
          items: { type: string }

    MapRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        search: { type: string, description: Rank discovered URLs by relevance to this. }
        sitemap: { type: string, enum: [include, skip, only], default: include }
        includeSubdomains: { type: boolean, default: false }
        ignoreQueryParameters: { type: boolean, default: true }
        limit: { type: integer, default: 5000, maximum: 100000 }

    MapResponse:
      type: object
      properties:
        success: { type: boolean }
        links:
          type: array
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              title: { type: string }
              description: { type: string }
              source: { type: string, enum: [sitemap, links, both] }
              lastModified:
                type: string
                format: date-time
                description: From the sitemap where present. Frequently stale or fabricated — treat as a hint.
        truncated: { type: boolean }

    RobotsCheckRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        userAgent:
          type: string
          description: Defaults to this instance's own (`HELIX_USER_AGENT`). Override to check what a different crawler would be allowed.

    RobotsCheckResponse:
      type: object
      properties:
        url: { type: string, format: uri }
        userAgent: { type: string }
        allowed: { type: boolean }
        crawlDelaySeconds:
          type: [number, 'null']
          description: '`Crawl-delay` from the site''s `robots.txt`, honoured by `/crawl` despite being absent from RFC 9309. `null` when the site sets none.'
        sitemaps:
          type: array
          items: { type: string, format: uri }

    BatchScrapeRequest:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          minItems: 1
          maxItems: 10000
          description: |
            The URLs to read, http(s) only. Duplicates are dropped. The ceiling is
            `HELIX_BATCH_MAX_URLS` (10000).
          items: { type: string, format: uri }
        ignoreInvalidURLs:
          type: boolean
          default: false
          description: |
            Drop unparseable URLs and report them in `invalidURLs`, instead of
            rejecting the whole batch with a 400.
        scrapeOptions:
          type: object
          description: Applied to every URL in the batch.
          properties:
            formats:
              type: array
              items: { type: string }
            tier: { type: string, enum: [auto, plain, tls, lightpanda, chromium, camoufox] }
            extractor: { type: string, enum: [trafilatura, readability, auto] }
            onlyMainContent: { type: boolean }
        formats:
          type: array
          description: Top-level alias of `scrapeOptions.formats`.
          items: { type: string }
        tier: { type: string, enum: [auto, plain, tls, lightpanda, chromium, camoufox] }
        extractor: { type: string, enum: [trafilatura, readability, auto] }
        onlyMainContent: { type: boolean }
        maxConcurrency:
          type: integer
          minimum: 1
          maximum: 64
          description: Per-host ceiling, capped by `HELIX_MAX_HOST_CONCURRENCY`.
        delay:
          type: number
          minimum: 0
          maximum: 60
          description: Fixed delay between requests to one host, in seconds.
        webhook:
          oneOf:
            - { type: string, format: uri }
            - { $ref: '#/components/schemas/WebhookConfig' }

    BatchAccepted:
      type: object
      properties:
        success: { type: boolean, example: true }
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        total:
          type: integer
          description: URLs actually queued, after duplicates and any skipped invalid ones.
        invalidURLs:
          type: array
          description: Present only when `ignoreInvalidURLs` skipped something.
          items: { type: string }
        url: { type: string, example: '/v1/batch/scrape/0d9f7c1e-1a3c-4d21-9f0e-5b6a2c8d4e11' }

    CrawlRequest:
      allOf:
        - type: object
          properties:
            url:
              type: string
              format: uri
              description: The seed. Required unless `resume` names an existing job, which keeps the seed it started with.
            resume:
              type: string
              format: uuid
              description: |
                Revive a cancelled crawl under its original id, re-queueing the
                pages it had not finished. Cannot be combined with `url` or
                `estimate`. A job belonging to another key reads as absent (404);
                one past `expiresAt`, still running, or with nothing left queued
                is a 409.
            estimate:
              type: boolean
              default: false
              description: Return projected work instead of crawling.
            limit:
              type: integer
              minimum: 1
              description: Maximum pages. Defaults to `HELIX_CRAWL_DEFAULT_LIMIT` (1000); rejected above `HELIX_CRAWL_MAX_LIMIT` (100000).
            maxDepth:
              type: integer
              minimum: 0
              description: Link depth from the seed. Rejected above `HELIX_CRAWL_MAX_DEPTH` (50).
            includePaths:
              type: array
              description: Globs over the pathname, e.g. `/blog/*`. Only matching URLs are crawled.
              items: { type: string }
            excludePaths:
              type: array
              description: Globs over the pathname, e.g. `/blog/tag/*`. Wins over `includePaths`.
              items: { type: string }
            allowSubdomains: { type: boolean, default: false }
            allowExternal: { type: boolean, default: false }
            allowExternalLinks:
              type: boolean
              description: Alias of `allowExternal`.
            sitemap: { type: string, enum: [include, skip, only], default: include }
            respectRobots:
              type: boolean
              default: true
              description: |
                Honours `robots.txt` including `Crawl-delay`. Disabling is logged and
                is your responsibility — only do it for sites you own or have
                permission to crawl.
            politeness:
              type: string
              enum: [adaptive, fixed]
              default: adaptive
              description: |
                `adaptive` ramps concurrency while a host stays healthy and backs off
                on 429s or rising latency.
            maxConcurrency: { type: integer }
            delay: { type: number, description: Seconds between requests to one host. Overrides adaptive pacing. }
            incremental:
              type: boolean
              default: false
              description: Skip pages whose content hash is unchanged since the last crawl of this site.
            changesOnly:
              type: boolean
              default: false
              description: |
                Omit unchanged pages from the result set. `incremental` decides
                what is fetched; this decides what is returned, so a weekly
                re-crawl answers with the pages that moved rather than all of
                them. Implies `incremental`, since filtering needs the hashes.
            maxPagesPerPath:
              type: integer
              minimum: 1
              maximum: 100000
              description: |
                Cap on pages sharing a first path segment. Bounds calendar and
                facet traps, where one path would otherwise consume the whole
                limit. Pages turned away are counted as `pagesOverPathCap`.
            includeContent:
              type: array
              description: |
                Globs or regular expressions matched against the extracted text,
                after the fetch. Only matching pages are kept. Path patterns
                cannot express "skip the login wall" when each such page has a
                distinct URL.
              items: { type: string }
            excludeContent:
              type: array
              description: As `includeContent`, but drops matching pages. Wins where both match.
              items: { type: string }
            ignoreQueryParameters: { type: boolean, default: false }
            scrapeOptions:
              description: Per-page options in the nested form the spec uses. Overrides the same fields given at the top level.
              type: object
              properties:
                formats:
                  type: array
                  items: { $ref: '#/components/schemas/Format' }
                tier: { $ref: '#/components/schemas/Tier' }
                extractor: { type: string, enum: [trafilatura, readability, auto] }
                onlyMainContent: { type: boolean }
                jsonOptions:
                  type: object
                  description: |
                    Structured extraction applied to every page, so one schema
                    turns a crawl into a table rather than a set of documents.
                    Required when `formats` includes `json`: without a `schema`
                    or `prompt` the request is rejected, rather than the field
                    being dropped silently on every page.
                  properties:
                    schema: { type: object, additionalProperties: true }
                    prompt: { type: string, maxLength: 2000 }
                    provider: { type: string, maxLength: 64 }
                    model: { type: string, maxLength: 200 }
            destination: { $ref: '#/components/schemas/Destination' }
            webhook:
              description: A bare URL subscribes to every event; the object form adds headers, an event filter and metadata.
              oneOf:
                - { type: string, format: uri }
                - $ref: '#/components/schemas/WebhookConfig'
        - $ref: '#/components/schemas/ScrapeOptions'

    SearchScrapeOptions:
      type: object
      description: |
        Read options applied to every result page. The subset of `ScrapeOptions`
        that a per-result read supports; `extract`, `actions` and `proxy` are not
        accepted here.
      properties:
        formats:
          type: array
          items: { type: string, enum: [markdown, text, rawHtml, links, screenshot] }
          default: [markdown]
        tier: { $ref: '#/components/schemas/Tier' }
        onlyMainContent: { type: boolean, default: true }
        includeSelectors:
          type: array
          items: { type: string }
        excludeSelectors:
          type: array
          items: { type: string }
        extractor:
          type: string
          enum: [trafilatura, readability, auto]
          default: trafilatura
        waitFor: { type: integer, minimum: 0, maximum: 30000 }
        timeout: { type: integer, default: 20000, minimum: 1000, maximum: 120000 }
        headers:
          type: object
          additionalProperties: { type: string }
        profile: { type: string }

    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 500 }
        limit:
          type: integer
          default: 5
          minimum: 1
          description: Results per source. The instance ceiling is `HELIX_SEARCH_MAX_RESULTS` (default 50).
        lang:
          type: string
          minLength: 2
          maxLength: 2
          description: Two-letter UI language, e.g. `en`.
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: Two-letter country, e.g. `us`.
        tbs:
          type: string
          pattern: '^qdr:[hdwmy][0-9]*$'
          description: 'Time filter in Google `tbs` form: `qdr:d` (day), `qdr:w`, `qdr:m`, `qdr:y`. Wins over `freshness`.'
        freshness:
          type: string
          pattern: '^[0-9]{1,4}[hdwmy]$'
          description: 'Relative window, e.g. `24h`, `7d`, `1y`. Converted to `tbs`.'
        sources:
          type: array
          items: { type: string, enum: [web, news, images] }
          maxItems: 3
          uniqueItems: true
          default: [web]
          description: Each source is one backend call and `limit` more pages to read; repeats are collapsed.
        categories:
          type: array
          items: { type: string, enum: [github, research, pdf, docs] }
          description: Shorthands expanded into search operators.
        includeDomains:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SearchDomain' }
        excludeDomains:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/SearchDomain' }
        scrapeOptions:
          allOf:
            - $ref: '#/components/schemas/SearchScrapeOptions'
          description: Read every result in the same call. Omit for url, title and description only.
        scrape:
          allOf:
            - $ref: '#/components/schemas/SearchScrapeOptions'
          deprecated: true
          description: Alias of `scrapeOptions`, kept for early callers.

    SearchDomain:
      type: string
      maxLength: 253
      pattern: '^[a-zA-Z0-9-]{1,63}(\.[a-zA-Z0-9-]{1,63})+$'
      description: A hostname as a `site:` operator accepts it, e.g. `docs.example.com`. No scheme, no path.

    SearchResult:
      type: object
      required: [url, title, position]
      properties:
        url: { type: string, format: uri }
        title: { type: string }
        description: { type: string, description: The backend's snippet. }
        position: { type: integer }
        publishedAt: { type: string }
        imageUrl: { type: string, format: uri, description: Image results only. }
        markdown: { type: string }
        text: { type: string }
        rawHtml: { type: string }
        links:
          type: array
          items: { type: string, format: uri }
        screenshot: { type: string }
        metadata: { $ref: '#/components/schemas/Metadata' }
        failure:
          allOf:
            - $ref: '#/components/schemas/FetchFailure'
          description: Present when this result page could not be read. The search still succeeds.

    SearchResponse:
      type: object
      required: [success, data, warnings]
      properties:
        success: { type: boolean }
        data:
          type: object
          required: [web]
          properties:
            web:
              type: array
              items: { $ref: '#/components/schemas/SearchResult' }
            news:
              type: array
              items: { $ref: '#/components/schemas/SearchResult' }
            images:
              type: array
              items: { $ref: '#/components/schemas/SearchResult' }
        warnings:
          type: array
          items: { type: string }
          description: One line per result page that could not be read, or a note that the backend returned nothing.
        metadata:
          type: object
          properties:
            backend: { type: string, enum: [searxng, serper, serpapi] }
            fromCache: { type: boolean, description: The ranked list came from the short-TTL query cache; pages are always read fresh. }

    AgentSchemaRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
          description: What you want extracted, in plain language.
        provider:
          type: string
          enum: [anthropic, openai, openrouter, google, gemini, ollama, vllm, openai-compatible]
          description: Override the instance default provider for this call. Its key must already be stored.
        model:
          type: string
          description: Override the model used for this call. Defaults to the provider's configured model.
        urls:
          type: array
          maxItems: 10
          items: { type: string, format: uri }
          description: Example pages this schema will run against. Used to inform field choices; never fetched.
        hint:
          type: object
          description: A previous schema, sent back when refining rather than starting fresh.
        instruction:
          type: string
          minLength: 1
          maxLength: 2000
          description: How to change `hint`. Only meaningful together with `hint`.

    AgentSchemaResponse:
      type: object
      required: [success]
      properties:
        success: { type: boolean }
        schema:
          type: object
          description: A JSON Schema, ready to pass as `jsonOptions.schema` or `scrapeOptions.schema`.
        summary: { type: string, description: One line describing what the schema captures. }
        usage:
          type: object
          properties:
            tokens:
              type: object
              properties:
                input: { type: integer }
                output: { type: integer }
            model: { type: string }
        failure:
          type: object
          description: Present only when `success` is `false` — the model was not configured, unreachable, or timed out.
          required: [reason]
          properties:
            reason: { type: string, enum: [service_unavailable, timeout] }
            detail: { type: string }

    EnrichField:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 64
          pattern: '^[A-Za-z][A-Za-z0-9_]*$'
          description: Field name, as it will appear in the response.
        type:
          type: string
          enum: [string, number, boolean]
          default: string
        description:
          type: string
          maxLength: 300
          description: What you mean by this field. Sent to the model when structure cannot answer it.

    EnrichRequest:
      type: object
      required: [subject, fields]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
          description: What is being enriched - a company name, a domain, an email.
        fields:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/EnrichField' }
        urls:
          type: array
          maxItems: 10
          items: { type: string, format: uri }
          description: |
            Pages to read instead of searching. When omitted, sources are
            discovered with the configured search backend; without one, the
            request is a 503.
        maxSources:
          type: integer
          minimum: 1
          maximum: 10
          default: 4
          description: How many pages may become evidence.
        timeout:
          type: integer
          minimum: 1000
          maximum: 120000
          default: 30000
        provider:
          type: string
          enum: [anthropic, openai, openrouter, google, gemini, ollama, vllm, openai-compatible]
          description: |
            Which of your configured providers runs the model phase. Optional;
            when omitted a provider is chosen from your stored credentials.
            Name a local runtime (`ollama`, `vllm`, `openai-compatible`)
            explicitly if it is the only one you have configured.
        model:
          type: string
          maxLength: 200
          description: Model to use, when it differs from the one stored for that provider.

    EnrichCitation:
      type: object
      required: [url, quote, locator]
      properties:
        url: { type: string, format: uri, description: The page the passage was read from. }
        quote:
          type: string
          description: |
            The passage grounding this value, verified to appear in the page at
            `url`. This is the citation - a span you can check, not just a link.
        locator:
          type: string
          description: Where in the page it was read, e.g. `meta[og:site_name]`, `ld+json Organization.name`, or `body`.

    EnrichedField:
      type: object
      required: [value, confidence, citation, phase, reason, evidence]
      properties:
        value:
          nullable: true
          description: |
            The value, or `null` when none could be grounded. A `null` here is a
            real answer, not an error - see `reason`.
          oneOf:
            - { type: string }
            - { type: number }
            - { type: boolean }
        confidence:
          type: string
          nullable: true
          enum: [high, medium, low]
          description: |
            An ordinal band, NOT a probability, and NOT calibrated - no error
            rate is claimed for any band because none has been measured.

            `high` - read directly out of the page's `<meta>` tags or JSON-LD by
            this API. No model was involved, so it cannot be a hallucination.

            `medium` - a model proposed it, quoted a passage, that passage was
            found in the fetched page, and the value appears inside the passage.

            `low` - as `medium`, but the value could not be required to appear
            inside its own passage. This is the boolean case: a page establishes
            `hiring: true` by saying "we are hiring", never by containing "true".

            Grounding proves a passage is real, not that it is true. A page that
            states a falsehood yields a `medium` field quoting it faithfully.

            `null` whenever `value` is `null`.
        citation:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/EnrichCitation' }]
          description: Null whenever `value` is null.
        phase:
          type: string
          nullable: true
          enum: [metadata, structural, model]
          description: Which extractor phase produced the value.
        reason:
          type: string
          nullable: true
          enum:
            - no_sources
            - all_sources_rejected
            - not_stated
            - no_citation
            - citation_not_in_source
            - value_not_in_citation
            - citation_too_short
            - unknown_source_url
            - model_unavailable
          description: |
            Why `value` is null. Null when a value was found.

            `not_stated` - no source stated it. `citation_not_in_source` and
            `unknown_source_url` - the model proposed a value it could not tie
            to a page this API fetched, so it was discarded rather than returned
            at low confidence. `all_sources_rejected` - every candidate page was
            discarded by the guardrails; see `sources.rejected`.
        evidence:
          type: object
          required: [valueInCitation, sourcesConsidered]
          properties:
            valueInCitation:
              type: boolean
              description: |
                Whether the value itself was found inside its cited passage.
                Always false for booleans, which cannot appear literally in the
                prose that establishes them.
            sourcesConsidered: { type: integer, description: How many screened pages were searched for this field. }

    EnrichRejectedSource:
      type: object
      required: [url, reason, detail]
      properties:
        url: { type: string, format: uri }
        reason:
          type: string
          enum: [parked_domain, placeholder_page, blocklisted_social, below_content_floor, unsafe_url, unreadable]
        detail: { type: string, description: What the guardrail saw, in one line. }

    EnrichResponse:
      type: object
      required: [success, data, sources]
      properties:
        success: { type: boolean }
        subject: { type: string }
        data:
          type: object
          additionalProperties: { $ref: '#/components/schemas/EnrichedField' }
          description: One entry per requested field, keyed by field name.
        sources:
          type: object
          required: [used, rejected]
          properties:
            used:
              type: array
              items: { type: string, format: uri }
              description: Pages that became evidence, in the order they were read.
            rejected:
              type: array
              items: { $ref: '#/components/schemas/EnrichRejectedSource' }
              description: Pages fetched or considered and discarded, each with the guardrail that discarded it.
        usage:
          type: object
          description: Present only when the model phase ran. Absent when structure answered every field.
          properties:
            tokens:
              type: object
              properties:
                input: { type: integer }
                output: { type: integer }
            model: { type: string }
        warnings:
          type: array
          items: { type: string }

    InteractAction:
      type: object
      required: [type]
      discriminator: { propertyName: type }
      description: |
        One step. `navigate`, `click`, `type`, `press`, `scroll`, `wait`,
        `screenshot` and `executeJavascript` need no model; `extract` sends the
        page's stripped content to your configured provider.
      properties:
        type:
          type: string
          enum: [navigate, click, type, press, scroll, wait, screenshot, executeJavascript, extract]
        url: { type: string, format: uri, description: '`navigate` only.' }
        selector: { type: string, description: 'CSS selector: `click`, `type`, and optionally `wait`.' }
        text: { type: string, description: '`type` only. Replaces the current value of the field.' }
        key: { type: string, description: '`press` only, e.g. `Enter`, `Tab`, `ArrowDown`.' }
        direction: { type: string, enum: [up, down], default: down, description: '`scroll` only.' }
        amount: { type: integer, minimum: 1, maximum: 20000, description: '`scroll` only. Pixels; omitted means one viewport.' }
        milliseconds: { type: integer, minimum: 0, maximum: 30000, description: '`wait` only. Total waiting per request is capped at 60s.' }
        fullPage: { type: boolean, default: false, description: '`screenshot` only.' }
        script: { type: string, description: '`executeJavascript` only. Its return value lands in `javascriptReturns`; the script has 10s to settle and its serialized return is capped at 1,000,000 characters. A script that never yields closes the session.' }
        prompt: { type: string, maxLength: 4000, description: '`extract` only. What to find on the page.' }
        schema:
          type: object
          description: '`extract` only. JSON Schema for the result; without it the answer is one string.'
        model: { type: string, description: '`extract` only. Overrides the instance default model.' }

    InteractRequest:
      type: object
      required: [actions]
      properties:
        url:
          type: string
          format: uri
          description: Loaded before the actions. Required when `sessionId` is absent; with one, navigates that session first.
        sessionId:
          type: [string, 'null']
          description: Continue on an open session from an earlier call or from `/interact/session`.
        actions:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/InteractAction' }
        keepSessionOpen:
          type: boolean
          default: false
          description: Keep the page after the response so a later call can continue. Idle and hard timeouts still apply.
        headers:
          type: object
          additionalProperties: { type: string }
          description: Extra request headers for a new session.
        viewport:
          type: object
          properties:
            width: { type: integer, minimum: 320, maximum: 3840 }
            height: { type: integer, minimum: 240, maximum: 2160 }

    InteractSessionRequest:
      type: object
      properties:
        url: { type: string, format: uri, description: Loaded on open. Omit for a blank page. }
        headers:
          type: object
          additionalProperties: { type: string }
        viewport:
          type: object
          properties:
            width: { type: integer, minimum: 320, maximum: 3840 }
            height: { type: integer, minimum: 240, maximum: 2160 }

    InteractSession:
      type: object
      required: [success, sessionId, liveViewUrl, expiresAt, idleExpiresAt]
      properties:
        success: { type: boolean }
        sessionId: { type: string, example: sess_9f2c1a7b3e4d5c60 }
        url: { type: string, description: Current URL of the page. }
        createdAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: 'Hard deadline, regardless of activity.' }
        idleExpiresAt: { type: string, format: date-time, description: When the session closes if nothing else happens. }
        liveViewUrl: { type: string, format: uri, description: Read-only live view; carries its own token. }
        idleTimeoutSeconds: { type: integer }
        hardTimeoutSeconds: { type: integer }

    InteractFailure:
      allOf:
        - $ref: '#/components/schemas/FetchFailure'
        - type: object
          properties:
            actionIndex:
              type: [integer, 'null']
              description: Index into `actions` of the step that failed; `null` when the initial navigation from `url` failed.
            actionType: { type: string }

    InteractResponse:
      type: object
      required: [success, sessionId, sessionOpen]
      properties:
        success: { type: boolean }
        sessionId: { type: string }
        sessionOpen: { type: boolean, description: 'Whether the session is still open for a follow-up call. Reflects the registry after the run, so a session closed or expired mid-run reports `false` (with failure reason `session_closed`).' }
        url: { type: string, description: URL of the page after the last action. }
        output:
          type: [string, 'null']
          description: The last `extract` result; the answer string, or the JSON of a schema result.
        data:
          type: [object, 'null']
          description: The last `extract` result as an object.
        screenshot: { type: [string, 'null'], description: 'Last `screenshot` as a `data:image/png;base64,...` URL.' }
        javascriptReturns:
          type: array
          items: {}
          description: Return values of `executeJavascript` actions, in order.
        actionsRun: { type: integer, description: How many of `actions` completed. }
        liveViewUrl: { type: string, format: uri, description: Present while the session is open. }
        expiresAt: { type: string, format: date-time, description: Present while the session is open. }
        idleExpiresAt: { type: string, format: date-time, description: Present while the session is open. }
        usage:
          type: object
          properties:
            tokens:
              type: object
              properties:
                input: { type: integer }
                output: { type: integer }
            model: { type: [string, 'null'] }
        timingMs: { type: integer }
        failure: { $ref: '#/components/schemas/InteractFailure' }

    DiffRequest:
      type: object
      required: [before, after]
      description: |
        Either `text` diffing (the default) or `json` diffing, chosen by
        `mode`. In `text` mode, `before` and `after` are each `{ text }` or
        `{ url }`; in `json` mode they are JSON values directly.
      properties:
        mode: { type: string, enum: [text, json], default: text }
        before: {}
        after: {}
        granularity:
          type: string
          enum: [word, line, character]
          default: word
          description: Ignored in `json` mode.

    MonitorRequest:
      type: object
      required: [url, schedule]
      properties:
        url: { type: string, format: uri, description: The one page to watch. }
        schedule: { $ref: '#/components/schemas/MonitorSchedule' }
        scrapeOptions:
          type: object
          description: Read options for each check. Same knobs as `/scrape`, minus formats (checks always read markdown).
          properties:
            tier: { $ref: '#/components/schemas/Tier' }
            onlyMainContent: { type: boolean, default: true }
            includeSelectors: { type: array, items: { type: string } }
            excludeSelectors: { type: array, items: { type: string } }
            extractor: { type: string, enum: [trafilatura, readability, auto] }
            waitFor: { type: integer, minimum: 0, maximum: 30000 }
            timeout: { type: integer, minimum: 1000, maximum: 300000 }
            headers: { type: object, additionalProperties: { type: string } }
            profile: { type: string }
            proxy:
              type: object
              properties:
                url: { type: string }
                sessionId: { type: string }
                geo: { type: string, minLength: 2, maxLength: 2 }
        diff: { $ref: '#/components/schemas/MonitorDiffOptions' }
        jsonOptions: { $ref: '#/components/schemas/MonitorJsonOptions' }
        trigger: { $ref: '#/components/schemas/MonitorTrigger' }
        sensitivity:
          type: string
          enum: [any, significant]
          default: any
          description: |
            `any` compares the text verbatim. `significant` first strips relative
            timestamps ("3 minutes ago"), clock times, dates and tracking parameters,
            so a page whose only difference is noise counts as unchanged.
        webhook:
          description: |
            A URL, or an object with headers, events and a signing secret. Must
            be a public http(s) address: loopback, private-network, link-local
            and metadata addresses are rejected with `field: webhook.url`, and a
            hostname that resolves to one at send time dead-letters the delivery.
          oneOf:
            - { type: string, format: uri }
            - $ref: '#/components/schemas/MonitorWebhook'

    MonitorPatch:
      type: object
      description: Any subset of the create request, plus `status`. At least one field.
      properties:
        schedule: { $ref: '#/components/schemas/MonitorSchedule' }
        scrapeOptions: { type: object }
        diff: { $ref: '#/components/schemas/MonitorDiffOptions' }
        jsonOptions:
          description: Send `null` to remove it.
          oneOf:
            - { type: 'null' }
            - $ref: '#/components/schemas/MonitorJsonOptions'
        trigger: { $ref: '#/components/schemas/MonitorTrigger' }
        sensitivity: { type: string, enum: [any, significant] }
        webhook:
          oneOf:
            - { type: string, format: uri }
            - $ref: '#/components/schemas/MonitorWebhook'
        status:
          type: string
          enum: [active, paused]
          description: Pausing clears `nextCheckAt`; resuming computes it from the schedule.

    MonitorSchedule:
      description: |
        A cron expression as a string, or an object with `cron` or `every`
        (`15m`, `6h`, `1d`), an optional IANA `timezone` (default UTC), and an
        optional business-hours `window`.

        `window` restricts the cron rather than replacing it: a firing outside
        the window is skipped forward to the next one inside it, so the cron
        still decides how often a check *could* run and the window decides
        which of those firings are kept. A schedule whose cron and window never
        intersect (e.g. a Sunday-only cron against a Monday-Friday window) is
        rejected at creation with `field: schedule.window`.
      oneOf:
        - { type: string, example: '0 * * * *' }
        - type: object
          properties:
            cron: { type: string }
            every: { type: string, description: 'Interval such as `15m`, `6h`, `1d`.' }
            timezone: { type: string, default: UTC }
            window: { $ref: '#/components/schemas/MonitorScheduleWindow' }

    MonitorScheduleWindow:
      type: object
      required: [startHour, endHour]
      description: Business hours the cron is narrowed to, evaluated in the schedule's own timezone.
      properties:
        days:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
          default: [1, 2, 3, 4, 5]
          description: 0 = Sunday .. 6 = Saturday. Defaults to Monday-Friday.
        startHour: { type: integer, minimum: 0, maximum: 23, description: Hour the window opens, inclusive. }
        endHour: { type: integer, minimum: 1, maximum: 24, description: Hour the window closes, exclusive. }

    MonitorDiffOptions:
      type: object
      properties:
        granularity: { type: string, enum: [word, line, character], default: word }
        inline:
          type: boolean
          default: true
          description: Include the diff text and ops in the webhook body. Off sends counts only.

    MonitorJsonOptions:
      type: object
      required: [schema]
      description: |
        Field-level diffing on extracted JSON instead of markdown text. On a
        change, the page's markdown before and after is run through
        helix-extract `/structured` with this schema, and the two results are
        diffed field by field (see `MonitorJsonDiff`). The text diff still
        decides whether the page changed and drives keyword/ratio triggers;
        this only replaces what gets reported and delivered once a change
        already fired, so a quiet check never pays for the extra model call.
      properties:
        schema:
          type: object
          description: A JSON Schema describing the fields to extract. `minItems`/`maxItems` are rejected, same as `/scrape`'s `jsonOptions.schema`.
        prompt: { type: string, maxLength: 4000 }
        provider:
          type: string
          enum: [anthropic, openai, openrouter, google, gemini, ollama, vllm, openai-compatible]
        model: { type: string }

    MonitorTrigger:
      type: object
      description: |
        Narrow what counts as a change. Keyword triggers are string searches on the
        two snapshots and need no model call.
      properties:
        keywordAppears: { type: string, description: Fire only when this phrase appears (case-insensitive). }
        keywordDisappears: { type: string, description: Fire only when this phrase disappears. }
        selector: { type: string, description: Watch only this part of the page. Shorthand for `scrapeOptions.includeSelectors`. }
        minChangeRatio:
          type: number
          minimum: 0
          maximum: 1
          description: Ignore changes smaller than this fraction of the content's tokens.

    MonitorWebhook:
      type: object
      required: [url]
      description: |
        Signed with HMAC-SHA256 over `{timestamp}.{body}` when a `secret` is set
        here or `HELIX_WEBHOOK_SECRET` is set on the instance, sent as
        `Helix-Signature: t=<unix>,v1=<hex>`. `Helix-Event`, `Helix-Delivery-Id`
        and `Helix-Monitor-Id` headers accompany every delivery.

        Delivery retries on the same schedule as crawl webhooks (one minute,
        doubling, capped at six hours) for `HELIX_WEBHOOK_MAX_ATTEMPTS` attempts,
        about three days at the default of 20, then lands in a dead letter you
        can replay. Ordering is not guaranteed; make the handler idempotent.
      properties:
        url: { type: string, format: uri }
        headers:
          type: object
          additionalProperties: { type: string }
          description: Sent with every delivery. Never echoed back; only the header names are.
        events:
          type: array
          default: [changed]
          items: { type: string, enum: [changed, checked, failed] }
          description: '`changed` on a real change, `checked` on every check, `failed` when a check could not read the page.'
        metadata: { type: object, description: Echoed back in every delivery. }
        secret: { type: string, minLength: 8, description: Per-webhook signing secret. Never echoed back. }

    Monitor:
      type: object
      properties:
        success: { type: boolean }
        id: { type: string, format: uuid }
        monitorId: { type: string, format: uuid, description: Same as `id`. }
        url: { type: string, format: uri }
        schedule:
          type: object
          properties:
            cron: { type: string }
            timezone: { type: string }
            every: { type: string }
            window: { $ref: '#/components/schemas/MonitorScheduleWindow' }
        scrapeOptions: { type: object }
        diff: { $ref: '#/components/schemas/MonitorDiffOptions' }
        jsonOptions:
          oneOf:
            - { type: 'null' }
            - $ref: '#/components/schemas/MonitorJsonOptions'
        trigger: { $ref: '#/components/schemas/MonitorTrigger' }
        sensitivity: { type: string, enum: [any, significant] }
        webhook:
          type: [object, 'null']
          properties:
            url: { type: string, format: uri }
            events: { type: array, items: { type: string } }
            metadata: { type: [object, 'null'] }
            headers: { type: array, items: { type: string }, description: Header names only. }
            signed: { type: boolean }
        status:
          type: string
          enum: [active, paused, error]
          description: '`error` after a failed check; clears on the next successful one. Checks keep running.'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastCheckedAt: { type: [string, 'null'], format: date-time }
        nextCheckAt: { type: [string, 'null'], format: date-time, description: Null while paused. }
        lastChangeAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        stats:
          type: object
          properties:
            checks: { type: integer }
            changes: { type: integer }
            pagesUnchanged:
              type: integer
              description: Checks that found no change. They store nothing and send nothing.
        latestSnapshot:
          description: Present on `GET /monitor/{id}`; null until the first check.
          allOf:
            - $ref: '#/components/schemas/MonitorSnapshot'

    MonitorSnapshot:
      type: object
      properties:
        id: { type: integer }
        monitorId: { type: string, format: uuid }
        url: { type: string, format: uri }
        capturedAt: { type: string, format: date-time }
        contentHash: { type: string, description: SHA-256 of the markdown. }
        markdown: { type: string }
        snapshotUrl: { type: string }

    MonitorDiff:
      type: object
      description: |
        Exact at the monitor's granularity for ordinary edits. A rewrite too
        large to trace word by word is reported at `line` granularity instead;
        past that it is one delete and one insert, flagged `coarse`. A diff
        whose ops and text exceed 128 KB is stored and delivered with counts
        only, flagged `truncated`.
      properties:
        granularity: { type: string, enum: [word, line, character], description: 'The granularity that applied, which may be `line` on a large rewrite.' }
        added: { type: integer, description: Tokens inserted at the chosen granularity. }
        removed: { type: integer }
        changeRatio: { type: number, description: 'Changed tokens over the larger side, 0 to 1.' }
        coarse: { type: boolean, description: Present and true when the changed region is one delete and one insert. }
        truncated: { type: boolean, description: Present and true when `ops` and `text` were dropped for size. }
        text:
          type: string
          description: 'Line diffs use `+`/`-` prefixes; word and character diffs are inline: `[-old-]{+new+}`.'
        ops:
          type: array
          items:
            type: object
            properties:
              op: { type: string, enum: [equal, insert, delete] }
              text: { type: string }

    MonitorJsonDiff:
      type: object
      description: |
        Field-level diff of two structured-extraction results, produced when
        the monitor has `jsonOptions` set. Unlike `MonitorDiff`, this never
        diffs serialized JSON as text: a key reordering counts as no change,
        and `fields` names only the paths whose value actually differs.
      properties:
        granularity: { type: string, enum: [json] }
        changeRatio: { type: number, description: 'Changed fields over the total fields seen across both sides, 0 to 1.' }
        fields:
          type: array
          items:
            type: object
            properties:
              path: { type: string, description: 'Dot-pathed for nested objects (`address.city`), index-pathed for arrays (`items.0.price`).' }
              before: { description: Omitted, not null, when the field did not exist before. }
              after: { description: Omitted, not null, when the field no longer exists. }

    MonitorHistoryEntry:
      type: object
      properties:
        id: { type: integer }
        checkedAt: { type: string, format: date-time }
        changed: { type: boolean }
        reason:
          type: string
          enum: [first, changed, unchanged, filtered, trigger_not_met, error]
          description: |
            `first` stored the baseline. `filtered` differed only by noise the
            sensitivity setting ignores. `trigger_not_met` changed but the keyword
            or ratio trigger did not fire; the baseline still moved.
        diff:
          description: A `MonitorDiff` (text) normally, or a `MonitorJsonDiff` when the monitor's `jsonOptions` is set and extraction succeeded.
          oneOf:
            - $ref: '#/components/schemas/MonitorDiff'
            - $ref: '#/components/schemas/MonitorJsonDiff'
        error: { type: [string, 'null'] }
        snapshotUrl: { type: [string, 'null'], description: Null when the snapshot was pruned. }

    WebhookDelivery:
      type: object
      properties:
        id: { type: integer }
        event: { type: string, enum: [changed, checked, failed] }
        url: { type: string, format: uri }
        status: { type: string, enum: [pending, delivered, dead] }
        attempts: { type: integer }
        lastError: { type: [string, 'null'] }
        responseStatus: { type: [integer, 'null'] }
        nextRetryAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        deliveredAt: { type: [string, 'null'], format: date-time }

    Document:
      type: object
      description: The read content of one resource. Identical in shape for web pages and documents.
      properties:
        markdown: { type: string }
        html: { type: string, description: 'Scripts, styles, comments, inline handlers and `javascript:` URLs removed.' }
        rawHtml: { type: string }
        text: { type: string }
        links:
          type: array
          items: { type: string, format: uri }
        screenshot:
          type: [string, 'null']
          description: 'A `data:image/png;base64,...` URI. `null` with a warning when no image was captured.'
        json:
          type: [object, 'null']
          description: 'Schema-conforming extraction, present when `json` was requested. `null` with a warning when the model step failed after the page was read.'
        jsonSources:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
              index: { type: integer, description: 'Position of the passage in page order.' }
              score: { type: number, description: 'Relevance to the schema and prompt; 0 when the whole page fit the budget.' }
          description: 'Present when `includeSources` was set. The passages that reached the model, in page order.'
        chunks:
          type: [array, 'null']
          items:
            type: object
            properties:
              text: { type: string }
              anchor: { type: string, description: 'Stable across re-crawls, so citations keep resolving.' }
              tokens: { type: integer }
              headingPath:
                type: array
                items: { type: string }
              index: { type: integer }
        metadata: { $ref: '#/components/schemas/Metadata' }

    Metadata:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        language: { type: string }
        sourceUrl: { type: string, format: uri }
        finalUrl: { type: string, format: uri, description: After redirects. }
        statusCode: { type: integer }
        contentType: { type: string }
        fetchedAt: { type: string, format: date-time }
        contentHash: { type: string, description: SHA-256 of normalised content. Drives incremental crawl and change detection. }
        tier: { $ref: '#/components/schemas/Tier' }
        tiersAttempted:
          type: array
          items: { $ref: '#/components/schemas/Tier' }
        profile: { type: string }
        engine:
          allOf:
            - $ref: '#/components/schemas/Engine'
          description: The browser that rendered the page. Absent when no browser tier ran.
        extractor: { type: string, description: 'The HTML-to-text engine that ran.' }
        mobile: { type: boolean }
        timingMs: { type: integer, description: 'Wall-clock for the fetch ladder, in milliseconds.' }
        fromCache: { type: boolean }
        favicon: { type: string, format: uri, description: 'Absolute favicon URL, resolved from the page''s declared <link rel="icon"> or falling back to /favicon.ico. Never fetched by the API — a URL for the client to load.' }
        document:
          type: object
          description: Present for PDFs and Office files.
          properties:
            pages: { type: integer }
            needsOcr: { type: boolean }
            ocrApplied: { type: boolean }
            suspectedGarbledText:
              type: boolean
              description: >-
                Text layer decoded suspiciously. Common with CJK PDFs; triggers
                an OCR fallback when `ocr` is `auto`.
            parser: { type: string }

    ScrapeResponse:
      type: object
      required: [success, warnings]
      properties:
        success: { type: boolean }
        data: { $ref: '#/components/schemas/Document' }
        failure: { $ref: '#/components/schemas/FetchFailure' }
        warnings:
          type: array
          items: { type: string }
          description: 'Always present. Each entry names the format it concerns, e.g. `json: No LLM credentials configured.`'
        usage: { $ref: '#/components/schemas/ExtractionUsage' }

    CrawlResumed:
      type: object
      description: A resumed crawl answers with the id it already had, not a new one.
      required: [id, status, resumed, requeued]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        resumed: { type: boolean, const: true }
        requeued:
          type: integer
          description: Pages put back on the queue, counting those the cancelled worker had claimed but not finished.

    ExtractRequest:
      type: object
      required: [urls]
      description: One of `schema` or `prompt` is required.
      properties:
        urls:
          type: array
          minItems: 1
          maxItems: 25
          items: { type: string, format: uri }
        schema:
          type: object
          additionalProperties: true
          description: JSON Schema describing one row.
        prompt:
          type: string
          maxLength: 2000
          description: A description of the data to extract, when you have no schema to hand.
        instruction:
          type: string
          maxLength: 2000
          description: Extra direction for the model, alongside the schema rather than instead of it.
        provider: { type: string, maxLength: 64 }
        model: { type: string, maxLength: 200 }
        allowUngrounded:
          type: boolean
          default: false
          description: |
            Keep fields the source does not support. They are listed in
            `dropped` either way; this only decides whether they also appear in
            `data`.
        tier: { type: string, enum: [auto, plain, tls, lightpanda, chromium, camoufox] }
        timeout: { type: integer, default: 60000, minimum: 1000, maximum: 300000 }

    ExtractedRowSource:
      type: object
      description: Where a row came from, and how much of the page the model actually saw.
      properties:
        url: { type: string, format: uri }
        spans:
          type: array
          description: The grounding spans the extractor reported, one per field it could support.
          items: { type: object, additionalProperties: true }
        blocksKept:
          type: integer
          description: |
            Blocks that reached the model. Lower than `blocksTotal` means the
            row was produced from part of the page, which the values alone
            cannot show.
        blocksTotal: { type: integer }

    ExtractDroppedField:
      type: object
      description: A field the model returned that nothing in the page supports.
      properties:
        url: { type: string, format: uri }
        field: { type: string }
        reason: { type: string }

    ExtractResponse:
      type: object
      required: [success, data, dropped, warnings]
      properties:
        success: { type: boolean }
        data:
          type: array
          description: One row per page read, carrying the schema's fields plus `_source`.
          items:
            type: object
            additionalProperties: true
            properties:
              _source: { $ref: '#/components/schemas/ExtractedRowSource' }
        dropped:
          type: array
          description: Fields discarded for want of a grounding span. Never silently absent.
          items: { $ref: '#/components/schemas/ExtractDroppedField' }
        warnings:
          type: array
          description: A URL that could not be read, or a page whose extraction failed, appears here rather than failing the request.
          items: { type: string }
        usage:
          type: object
          properties:
            urls: { type: integer }
            rows: { type: integer }
            model: { type: [string, 'null'] }
            tokens:
              type: object
              properties:
                input: { type: integer }
                output: { type: integer }
            blocksKept: { type: integer }
            blocksTotal: { type: integer }
            providerCost:
              type: object
              description: Tokens are billed by your provider; the amount is reported as unknown rather than zero.
              properties:
                amount: { type: [number, 'null'] }
                currency: { type: string }

    DocumentOp:
      type: string
      enum: [parse, metadata, scrub, assess]
      description: Which document operation `/document` dispatches to.

    DocumentRequest:
      type: object
      required: [op]
      description: |
        `op` plus whatever that operation takes. The fields are the union of the
        four underlying requests rather than a discriminated union, because the
        dispatcher forwards the body untouched and each operation validates its
        own — a `oneOf` here would imply a contract this endpoint does not
        itself enforce.
      additionalProperties: true
      properties:
        op: { $ref: '#/components/schemas/DocumentOp' }
        url: { type: string, format: uri, description: The document. Omit when uploading a `file` part. }
        file: { type: string, format: binary, description: 'multipart only. Name the operation as `?op=` when uploading.' }
        formats:
          type: array
          description: '`parse` only.'
          items: { $ref: '#/components/schemas/Format' }
        ocr: { type: string, enum: [auto, force, off], description: '`parse` only.' }
        jsonOptions: { type: object, additionalProperties: true, description: '`parse` only.' }
        timeout: { type: integer }

    ScreenshotRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        fullPage:
          type: boolean
          default: false
          description: |
            Capture everything below the fold. Height is capped server-side; a
            page taller than the cap is captured to it and the clipping is
            reported in `warnings` rather than passing as a whole-page image.
        selector:
          type: string
          maxLength: 500
          description: |
            Capture one element instead of the page. A selector matching nothing
            captures the viewport and says so in `warnings`, rather than
            returning the page as though it were the element. Cannot be combined
            with `clip`.
        clip:
          type: object
          description: Capture a fixed region. Cannot be combined with `selector`.
          required: [x, y, width, height]
          properties:
            x: { type: integer, minimum: 0 }
            y: { type: integer, minimum: 0 }
            width: { type: integer, minimum: 1, maximum: 10000 }
            height: { type: integer, minimum: 1, maximum: 10000 }
        format:
          type: string
          enum: [png, jpeg, webp]
          default: png
        quality:
          type: integer
          minimum: 1
          maximum: 100
          description: JPEG and WebP only. Ignored on PNG, which has no lossy setting.
        omitBackground:
          type: boolean
          default: false
          description: Transparent where the page paints no background. Ignored on JPEG, which has no alpha channel.
        viewport:
          type: object
          description: Explicit device size, overriding both the profile's screen and any preset. Cannot be combined with `mobile`.
          required: [width, height]
          properties:
            width: { type: integer, minimum: 200, maximum: 3840 }
            height: { type: integer, minimum: 200, maximum: 2160 }
            dpr: { type: number, minimum: 1, maximum: 3, description: Device pixel ratio, for retina output. }
        darkMode:
          type: boolean
          default: false
          description: 'Emulates `prefers-color-scheme: dark`. A page that ignores the query is unaffected.'
        blockAds:
          type: boolean
          default: false
          description: Aborts requests to known ad, tracker and consent-dialog hosts, so banners stay out of the frame.
        mobile:
          type: boolean
          default: false
          description: Render in a phone viewport (390x844, touch enabled). Forces the Chromium tier when `tier` is `auto`.
        tier:
          type: string
          enum: [auto, chromium, camoufox]
          default: auto
          description: A screenshot always needs a real render; `plain`, `tls` and `lightpanda` have no layout engine, so they are not offered here.
        engine: { $ref: '#/components/schemas/Engine' }
        waitFor:
          type: integer
          minimum: 0
          maximum: 30000
          description: Milliseconds to wait after load, before capturing.
        timeout:
          type: integer
          default: 30000
          minimum: 1000
          maximum: 300000
        actions:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/Action' }
          description: Steps to run before capturing, e.g. dismissing a cookie banner.
        profile:
          type: string
          description: Browser identity to present. Omit for an automatic choice.
        proxy:
          type: string
          description: Your own proxy URL for this request. Omit to use the instance's configured proxy, when it has one.

    ScreenshotResponse:
      type: object
      required: [success, warnings]
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            screenshot:
              type: [string, 'null']
              description: 'A `data:` URI carrying the requested format, e.g. `data:image/webp;base64,...`. `null` with a warning when no image was captured.'
            format:
              type: string
              enum: [png, jpeg, webp]
              description: The format actually produced.
            bytes:
              type: [integer, 'null']
              description: Encoded size of the capture.
            metadata:
              type: object
              properties:
                sourceUrl: { type: string, format: uri }
                finalUrl: { type: string, format: uri }
                statusCode: { type: integer }
                fetchedAt: { type: string, format: date-time }
                tier: { $ref: '#/components/schemas/Tier' }
                tiersAttempted:
                  type: array
                  items: { $ref: '#/components/schemas/Tier' }
                profile: { type: string }
                engine: { $ref: '#/components/schemas/Engine' }
                mobile: { type: boolean, description: True only when a phone viewport was actually applied. }
                timingMs: { type: integer }
        failure: { $ref: '#/components/schemas/FetchFailure' }
        warnings:
          type: array
          items: { type: string }

    ExtractionUsage:
      type: object
      description: 'Present only when a model ran. Tokens are billed by your provider, not by Helix.'
      properties:
        model: { type: string }
        tokens:
          type: object
          properties:
            input: { type: integer }
            output: { type: integer }
        blocksKept:
          type: integer
          description: Content blocks that reached the model after relevance trimming.
        blocksTotal: { type: integer }
        providerCost:
          type: object
          properties:
            amount:
              type: [number, 'null']
              description: '`null`: Helix carries no price table, so the amount is unknown rather than zero.'
            currency: { type: string }

    FetchFailure:
      type: object
      description: |
        A typed failure. Bot challenges appear here even when the upstream returned
        200 — a challenge page is never returned as content.
      required: [reason]
      properties:
        url: { type: string, format: uri }
        reason:
          type: string
          enum: [blocked, challenge, timeout, dns, tls, http_error, empty, robots_denied, unsupported_type, unsafe_url, session_closed, service_unavailable]
        detail: { type: string }
        statusCode: { type: integer }
        detectedBy:
          type: array
          items: { type: string }
          description: 'Signals that fired, e.g. `cloudflare-interstitial`, `content-too-short`.'
        tier: { $ref: '#/components/schemas/Tier' }
        tiersAttempted:
          type: array
          items: { $ref: '#/components/schemas/Tier' }
        profile: { type: string }
        escalationAvailable:
          type: boolean
          description: Whether a higher tier, another profile or a different proxy could still be tried.

    Estimate:
      type: object
      description: Projected work. Resources rather than credits — Helix sells no inference.
      properties:
        pages: { type: integer }
        pagesFromCache: { type: integer }
        tierBreakdown:
          type: object
          additionalProperties: { type: integer }
        estimatedSeconds: { type: integer }
        estimatedTokens:
          type: object
          properties:
            input: { type: integer }
            output: { type: integer }
        estimatedProviderCost:
          type: object
          description: Your provider's charge at the configured model. Zero when no model is involved.
          properties:
            amount: { type: number }
            currency: { type: string }
            model: { type: string }
        assumptions:
          type: array
          items: { type: string }

    JobAccepted:
      type: object
      properties:
        success: { type: boolean }
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid, description: Same as `id`. }
        url: { type: string, format: uri, description: 'Where to poll: /v1/crawl/{jobId}.' }

    JobCancelled:
      type: object
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [cancelled] }

    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid, description: Same as `id`. }
        type: { type: string, enum: [crawl, batch_scrape, enrich] }
        status: { type: string, enum: [queued, running, completed, failed, cancelled] }
        total: { type: integer }
        completed: { type: integer }
        failed: { type: integer }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        error: { type: [string, 'null'] }
        warnings:
          type: array
          items: { type: string }
          description: |
            Gaps between what the job queued and what it recorded, e.g. pages
            queued but never recorded as fetched or failed. Empty on a clean
            run. A job with nothing recorded and pages left over is `failed`
            instead, with the same text in `error`.
        next: { type: [string, 'null'], description: "Path of the next page, relative to this API's base (e.g. `/v1/jobs/<id>?cursor=100`), or null on the last page." }
        data:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Document'
              - type: object
                properties:
                  url: { type: string, format: uri, description: The URL as crawled. Also in `metadata.sourceUrl`. }
        usage: { $ref: '#/components/schemas/Usage' }

    Usage:
      type: object
      description: |
        What the job consumed, written when it finishes. Only measured figures
        appear; tokens and provider spend are not tracked per job, and
        `GET /jobs/{id}/cost` says so beside the saved projection.
      properties:
        pagesFetched: { type: integer }
        pagesUnchanged: { type: integer }
        tierBreakdown:
          type: object
          additionalProperties: { type: integer }
          description: Recorded pages by the tier that served them.
        browserSeconds:
          type: number
          description: Wall time of pages a render tier (chromium, camoufox) served, cheaper tiers tried first included.
        pagesFiltered: { type: integer, description: Present when the crawl set a content filter. }
        pagesOverPathCap: { type: integer, description: Present when the crawl set `maxPagesPerPath`. }
        jsonExtracted: { type: integer, description: Present when the crawl requested structured extraction. }
        jsonFailed: { type: integer, description: Present when the crawl requested structured extraction. }
        vectorFailures: { type: integer, description: Present when the crawl set a `destination`. }

    ProviderName:
      type: string
      enum: [anthropic, openai, gemini, openrouter, ollama, vllm, openai-compatible]

    ProviderStatus:
      type: object
      required: [provider, configured, source]
      properties:
        provider: { $ref: '#/components/schemas/ProviderName' }
        configured:
          type: boolean
          description: Whether a call for this provider can use a key at all, yours or the instance's.
        source:
          type: string
          enum: [key, instance, none]
          description: '`key`: yours, stored here. `instance`: the environment credential, no key of yours stored. `none`: neither.'
        last4:
          type: string
          description: Present only when `source` is `key` and a credential (not just a base URL) is stored.
        model:
          type: [string, 'null']
          description: Your stored default model for this provider, when you set one.
        baseUrl:
          type: [string, 'null']
          description: Where a local runtime (`ollama`, `vllm`, `openai-compatible`) is reached. Absent for cloud providers.
        updatedAt:
          type: string
          format: date-time
          description: Present only when `source` is `key`.
        detected:
          type: object
          description: |
            Present only when `source` is `none` and this local runtime answers
            on its default address. Save `baseUrl` with `PUT /providers/{provider}`
            to use it; until then no request goes to it.
          properties:
            baseUrl: { type: string }
            models: { type: array, items: { type: string } }

    ProviderModel:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The exact string to pass as `model` — Ollama's tag, or an OpenAI-compatible model id.
        parameterSize: { type: string, description: 'e.g. "8.0B", when the runtime reports it.' }
        quantization: { type: string, description: 'e.g. "Q4_K_M", when the runtime reports it.' }
        sizeBytes: { type: integer, description: On-disk size, when the runtime reports it. }
        capabilities:
          type: array
          items: { type: string }
          description: 'e.g. ["completion", "tools", "thinking"], when the runtime reports them.'

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded, unhealthy] }
        version: { type: string }
        services:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, degraded, unhealthy] }
              detail: { type: string }
        providers:
          type: object
          description: Which BYOK providers are configured. Never reveals key material.
          additionalProperties:
            type: object
            properties:
              configured: { type: boolean }
              model: { type: string }
              detected:
                type: array
                items: { type: string }
                description: |
                  `llm` only. Local runtimes answering on their default address,
                  by provider name (e.g. `ollama`). Offered, never used: nothing
                  is stored or called until one is saved through
                  `PUT /providers/{provider}`. Addresses and model lists are on
                  the authenticated `GET /providers`, not here.

    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        field: { type: string }
        requestId: { type: string }
