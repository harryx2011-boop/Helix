# Supabase project config. Required by `supabase db push`, which refuses to run
# without it even when the project is linked.
#
# project_id is the local shorthand, not the remote ref — `supabase link` writes
# the remote ref into .supabase/ (gitignored) and does not touch this file.

project_id = "helix"

[db]
# Matches the stack's Postgres (the Supabase project runs Postgres 17; compose runs pg16 locally).
# A mismatch makes `db push` diff against the wrong shadow database.
major_version = 17

[db.migrations]
schema_paths = []
